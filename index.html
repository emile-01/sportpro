    if(l.indexOf("#EXTINF")===0){m={name:l.slice(l.lastIndexOf(",")+1).trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||"",meta:(l.match(/group-title="([^"]*)"/)||[])[1]||""}}

  }

}
function getTV(cc){

}
var HOSTS=["https://de1.api.radio-browser.info","https://nl1.api.radio-browser.info","https://at1.api.radio-browser.info"];

  function go(i){if(i>=HOSTS.length)return Promise.resolve([]);return fetch(HOSTS[i]+path).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return go(i+1)})}

/* ---- live testing ---- */
function fresh(u){var p=P[u];return !!p&&p[0]===1&&!p[3]&&Date.now()-p[1]<108e5}
function alive(i){var p=P[i.url];return !!p&&p[0]===1}
function savePSoon(){if(savePSoon.t)return;savePSoon.t=setTimeout(function(){savePSoon.t=0;var k=Object.keys(P);if(k.length>5000)k.sort(function(a,b){return P[a][1]-P[b][1]}).slice(0,1500).forEach(function(x){delete P[x]});store.set("broad.probe",P)},2000)}
function probe(i){
  return new Promise(function(res){
    var done=false,h=null,el=null,t;
    function fin(ok){if(done)return;done=true;clearTimeout(t);if(h){try{h.destroy()}catch(e){}}if(el){try{el.pause();el.removeAttribute("src");el.load()}catch(e){}}res(ok)}
    t=setTimeout(function(){fin(false)},i.type==="tv"?20000:12000);
    var isH=/\.m3u8?(\?|$)/i.test(i.url)||i.url.indexOf("m3u8")>-1;
    if(isH&&window.Hls&&Hls.isSupported()){
      h=new Hls({manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,manifestLoadingTimeOut:9000,levelLoadingTimeOut:9000});
      h.on(Hls.Events.LEVEL_LOADED,function(){fin(true)});
      h.on(Hls.Events.MANIFEST_PARSED,function(){setTimeout(function(){fin(true)},2500)});
      h.on(Hls.Events.ERROR,function(e,d){if(d.fatal)fin(false)});
      h.loadSource(i.url);
    }else{
      el=document.createElement(i.type==="tv"?"video":"audio");el.muted=true;el.preload="auto";
      el.oncanplay=el.onloadeddata=function(){fin(true)};el.onerror=function(){fin(false)};el.src=i.url;
    }
  });
}
var rt=0;function sched(){if(rt)return;rt=setTimeout(function(){rt=0;render()},600)}
var holdUntil=0;
function startProbe(items,id){
  S.kn={};items.forEach(function(i){if(alive(i))S.kn[i.url]=1});
  var qd=S.qd&&S.qd.id===id?S.qd:(S.qd={id:id,u:{}});
  var q=items.filter(function(i){return !fresh(i.url)&&!qd.u[i.url]}).sort(function(a,b){function r(i){var p=P[i.url];return !p?0:p[0]?1:2}return r(a)-r(b)}).slice(0,500);
  q.forEach(function(i){qd.u[i.url]=1});
  var o=S.pt&&S.pt.id===id?S.pt:{done:0,total:0};S.pt={done:o.done,total:o.total+q.length,id:id};if(!q.length)return;
  var idx=0,act=0;
  (function pump(){
    if(Date.now()<holdUntil&&idx<q.length&&id===loadId){setTimeout(pump,1000);return}
    while(act<10&&idx<q.length&&id===loadId){(function(i){act++;var t0=Date.now();probe(i).then(function(ok){var o=P[i.url],fc=ok?0:((o&&o[3])||0)+1;P[i.url]=[ok||(o&&o[0]===1&&fc<3)?1:0,Date.now(),ok?Date.now()-t0:(o&&o[2])||0,fc];act--;S.pt.done++;savePSoon();sched();pump()})})(q[idx++])}
  })();
}

/* ---- list ---- */
var CAT={news:/news|info|actual/i,sports:/sport|football|soccer/i,movies:/movie|cinema|film/i,music:/music|song|hits|musique/i,kids:/kid|cartoon|child|anim/i,documentary:/documentar|nature|history/i};
function filtered(){

  if(!S.list.length){el.innerHTML='<div class="msg">'+(testing?"Finding live streams…":S.tab==="fav"?"Tap the bookmark on any channel or station to keep it here.":S.tab==="hist"?"What you watch and listen to shows up here.":"No live streams found. Try another country or search.")+'</div>';renderAlt();return}

function load(){
  var id=++loadId;S.pt=null;
  document.querySelectorAll("#chips .chip[data-t]").forEach(function(c){c.setAttribute("aria-pressed",c.dataset.t===S.tab)});
  document.querySelectorAll("#nav button").forEach(function(c){c.setAttribute("aria-pressed",c.dataset.t===S.tab)});$("#hero").hidden=S.tab==="fav"||S.tab==="hist";
  $("#ccb").firstChild.textContent=S.search?"Search":cname(S.cc);

    $("#list").innerHTML='<div class="msg">Searching…</div>';
    var q=S.search.toLowerCase();
    var qs=q.split(/\s+/).filter(Boolean),rad=[],tvl=[];
    function hit(i){var n=(i.name||"").toLowerCase();return qs.every(function(t){return n.indexOf(t)>-1})}
    function upd(l){if(id!==loadId)return;var seen={},a=[];l.forEach(function(i){if(!seen[i.url]){seen[i.url]=1;a.push(i)}});a.sort(function(x,y){return (x.name.toLowerCase().indexOf(q)===0?0:1)-(y.name.toLowerCase().indexOf(q)===0?0:1)});S.src=a;startProbe(S.src,id);render()}
    var loc=(cache["tv"+S.cc]||[]).concat(cache["r"+S.cc]||[],cache.idx||[]).filter(hit).slice(0,60);
    if(loc.length)upd(loc);
    rb("/json/stations/search?name="+encodeURIComponent(S.search)+"&hidebroken=true&order=clickcount&reverse=true&limit=60&is_https=true").then(function(a){rad=mapRadio(a);upd(loc.concat(tvl,rad))});

    S.src=r[0].concat(r[1]);startProbe(S.src,id);render();
  }).catch(function(){if(id===loadId)$("#list").innerHTML='<div class="msg">Could not load this list. Check your connection.</div>'});
}

/* ---- alternatives ---- */
var STOP=["hd","sd","fhd","tv","channel","live","official","the","fm","radio","1080p","720p","480p","360p"];
function toks(n){return String(n||"").toLowerCase().replace(/\(.*?\)|\[.*?\]/g," ").replace(/[^a-z0-9\u00c0-\u024f]+/g," ").split(" ").filter(function(t){return t&&STOP.indexOf(t)<0})}
function score(c,s){
  var a=toks(s.name),b=toks(c.name),com=a.filter(function(t){return b.indexOf(t)>-1}).length,uni=new Set(a.concat(b)).size||1,p=com/uni*60;
  if(a.join(" ")===b.join(" "))p+=100;
  if(c.cc&&c.cc===s.cc)p+=15;
  if(s.meta&&c.meta&&s.meta.split(/[,;]/)[0]===c.meta.split(/[,;]/)[0])p+=10;
  return p;
}
function alts(s){
  var pool=S.src.concat(cache["tv"+s.cc]||[],cache["r"+s.cc]||[],cache.idx||[]),seen={};
  seen[fid(s)]=1;
  return pool.filter(function(c){if(c.type!==s.type||seen[fid(c)]||(P[c.url]&&!P[c.url][0]&&Date.now()-P[c.url][1]<6e5))return false;seen[fid(c)]=1;return true})
    .map(function(c){return[score(c,s),c]}).filter(function(x){return x[0]>8}).sort(function(a,b){return b[0]-a[0]}).slice(0,12).map(function(x){return x[1]});
}

qLbl();

function go(){var p=v.play();if(p&&p.catch)p.catch(function(e){if(e&&e.name==="NotAllowedError"){clearTimeout(timer);setSt("Tap play to start");setPP(PLAY)}})}
function play(i,auto){
  holdUntil=Date.now()+12000;destroy();S.cur=i;
  var tv=i.type==="tv";
  $("#player").classList.toggle("radio",!tv);$("#bar").classList.add("show");
  $("#nm").textContent=i.name;$("#pn").textContent=i.name;$("#pm").textContent=[tv?"TV":"Radio",i.cc?cname(i.cc):"",i.meta].filter(Boolean).join(" · ");
  var th=thumb(i);$("#bart").innerHTML=th;$("#art").innerHTML=th;fixImgs($("#bar"));fixImgs($("#art"));if(!auto)openP();
  setSt("Connecting…");setPP(PAUSE);

/* theme */
$("#theme").onclick=function(){
  var n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";store.set("broad.theme",n);
  var d=n==="dark"||(n==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",d?"dark":"light");
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#121418":"#ffffff";
  toast("Appearance: "+(n==="auto"?"device":n));
};
/* country sheet */
function drawC(f){f=(f||"").toLowerCase();$("#cl").innerHTML=S.countries.filter(function(c){return !f||c.name.toLowerCase().indexOf(f)>-1}).map(function(c){return'<button class="cr'+(c.code===S.cc?" on":"")+'" data-c="'+c.code+'">'+esc(c.name)+'</button>'}).join("")}
function openSheet(){$("#sheet").classList.add("show");$("#cq").value="";drawC();$("#cq").focus()}
$("#cx").onclick=function(){$("#sheet").classList.remove("show")};
$("#cq").addEventListener("input",function(){drawC(this.value)});
$("#cl").addEventListener("click",function(e){var b=e.target.closest(".cr");if(!b)return;S.cc=b.dataset.c;store.set("broad.cc",S.cc);S.search="";$("#gq").value="";if(S.tab==="fav"||S.tab==="hist")S.tab="all";$("#sheet").classList.remove("show");track("select_country",{country:S.cc});load()});
/* install */
var dip=null;
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e;$("#install").hidden=false});
addEventListener("appinstalled",function(){$("#install").hidden=true;dip=null;track("app_installed")});
if(!(matchMedia("(display-mode: standalone)").matches||navigator.standalone))$("#install").hidden=false;
$("#install").onclick=function(){if(!dip){toast(/iphone|ipad|ipod/i.test(navigator.userAgent)?"Tap Share, then Add to Home Screen":"Open the browser menu, then tap Install app");return}dip.prompt();dip.userChoice.finally(function(){dip=null;$("#install").hidden=true})};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone&&!store.get("broad.iosHint",0)){setTimeout(function(){toast("Install: tap Share, then Add to Home Screen");store.set("broad.iosHint",1)},4000)}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});

/* ---- start ---- */
loadCountries().then(function(){
  var p=new URLSearchParams(location.search),t=p.get("tab");
  if(t&&/^(all|tv|radio|fav|hist)$/.test(t))S.tab=t;
  load();
  var w=p.get("watch");
  if(w&&/^https?:/.test(w)){play({type:p.get("type")==="radio"?"radio":"tv",name:p.get("name")||"Shared channel",logo:p.get("logo")||"",meta:"",url:w,cc:""})}
});
})();
</script>
</body>
</html>
