// lightweight partial refresh for the search box so it doesn't lose focus while typing
function renderFeedOnly() {
  const homeEl = document.querySelector(".mn-home");
  if (!homeEl || state.screen !== "home") { render(); return; }
  const feedWrap = homeEl.querySelector(".mn-feed, .mn-empty");
  const list = filteredQuestions();
  const newHtml = list.length === 0
    ? `<div class="mn-empty">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <p class="mn-empty-title">No questions match</p>
        <p class="mn-empty-sub">Try a different topic, or be the first to ask.</p>
      </div>`
    : feedListHtml(list);
  if (feedWrap) feedWrap.outerHTML = newHtml;
  const sentinelEl = homeEl.querySelector("#mn-feed-sentinel");
  if (sentinelEl) sentinelEl.remove();
  if (list.length > 0 && questionsHasMore) {
    homeEl.insertAdjacentHTML(
      "beforeend",
      `<div id="mn-feed-sentinel" class="mn-feed-sentinel">${questionsLoadingMore ? `<span class="mn-feed-spinner"></span>` : ""}</div>`
    );
  }
  observeFeedSentinel();
  observeFeedViews();
  updateNewPostsPill();
}

// Refreshes just the numbers (points/answers/upvoted state) on every post card
// currently in the feed, without touching card structure or media elements at
// all — used for background listener ticks that don't add, remove, or reorder
// anything the reader is looking at (see reconcileCommittedFeed()).
function patchFeedStatsOnly() {
  const feedEl = document.querySelector(".mn-home .mn-feed");
  if (!feedEl) return;
  const byId = new Map(state.questions.map((q) => [q.id, q]));
  Array.from(feedEl.children).forEach((el) => {
    if (!el.id || !el.id.startsWith("q-")) return;
    const q = byId.get(el.id.slice(2));
    if (q) patchQuestionCardStats(el, q);
  });
}
// Updates one feed card's answers/upvote counts and upvoted state in place.
// Shared by patchFeedStatsOnly() above.
function patchQuestionCardStats(el, q) {
  const upvoted = state.user && (q.upvoterIds || []).includes(state.user.uid);
  const points = q.points || 0;
  const answers = q.answersCount || 0;
  const answersBtn = el.querySelector('.mn-stat[title="Answers"]');
  if (answersBtn) {
    let countEl = answersBtn.querySelector(".mn-count");
    if (answers > 0) {
      if (countEl) countEl.textContent = answers;
      else answersBtn.insertAdjacentHTML("beforeend", `<span class="mn-count">${answers}</span>`);
    } else if (countEl) {
      countEl.remove();
    }
  }
  const upvoteBtn = el.querySelector('.mn-stat[title="Upvote"]');
  if (upvoteBtn) {
    upvoteBtn.classList.toggle("mn-stat-upvoted", !!upvoted);
    let countEl = upvoteBtn.querySelector(".mn-count");
    if (points > 0) {
      if (countEl) countEl.textContent = points;
      else upvoteBtn.insertAdjacentHTML("beforeend", `<span class="mn-count">${points}</span>`);
    } else if (countEl) {
      countEl.remove();
    }
  }
}

// Partial refresh for the Reels viewer: mirrors updateDetailStatsOnly, but
// for the caption panel's upvote/answers buttons. Never touches
// .mn-reels-image-wrap (the <img> — reels are photos only), so an upvote, a Firestore-driven
// answers-count bump, etc. can't restart or remount the currently playing
// media — only the numbers/hover-state on the buttons update.
function updateReelsStatsOnly() {
  if (!state.reelsViewerOpen) return;
  const reels = getReelPosts();
  if (!reels.length) return;
  const idx = Math.min(state.reelsIndex, reels.length - 1);
  const q = reels[idx].q;
  const panel = document.querySelector(".mn-reels-caption-actions");
  if (!panel) return;
  const upvoted = state.user && (q.upvoterIds || []).includes(state.user.uid);
  const points = q.points || 0;
  const answers = q.answersCount || 0;
  const upvoteBtn = panel.querySelector('.mn-stat[title="Upvote"]');
  if (upvoteBtn) {
    upvoteBtn.classList.toggle("mn-stat-upvoted", !!upvoted);
    upvoteBtn.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
      ${points > 0 ? `<span class="mn-count">${points}</span>` : ""}
    `;
  }
  const viewPostBtn = panel.querySelector('.mn-stat[title="View post"]');
  if (viewPostBtn) {
    viewPostBtn.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
      ${answers > 0 ? `<span class="mn-count">${answers}</span>` : `<span>View post</span>`}
    `;
  }
}
function updateReelsStageOnly() {
  const reels = getReelPosts();
  if (!reels.length) return;
  const idx = Math.min(state.reelsIndex, reels.length - 1);
  const { q, image } = reels[idx];
  const stage = document.querySelector(".mn-reels-stage");
  if (!stage) return;
  stage.dataset.reelId = q.id;
  const img = stage.querySelector(".mn-reels-image");
  if (img) {
    img.style.opacity = 0;
    img.onload = () => { img.style.opacity = 1; };
    img.src = image;
  }
  document.querySelectorAll(".mn-reels-progress-seg").forEach((seg, i) => {
    seg.classList.toggle("mn-reels-progress-seg-active", i <= idx);
  });

  // update author + caption to match the reel now showing
  const authorEl = document.querySelector(".mn-reels-caption-author");
  if (authorEl) {
    const nameEsc = escapeHtml(q.authorName || "").replace(/'/g, "\\'");
    authorEl.setAttribute("onclick", `closeReelsViewer(); openUserProfile('${q.authorId || ""}', '${nameEsc}', event)`);
    authorEl.innerHTML = `
      ${avatarHtml(q.authorName, q.authorId, q.authorPhoto)}
      <span class="mn-reels-caption-name">${escapeHtml(q.authorName || "")}</span>
      <span class="mn-time">${timeAgo(q.createdAt)}</span>
    `;
  }
  const rawCaption = stripUrlsForFeed(q.body) || q.title || "";
  const isLong = rawCaption.length > 140;
  const expanded = !!state.reelsCaptionExpanded[q.id];
  const shownCaption = isLong && !expanded ? rawCaption.slice(0, 140).trim() + "…" : rawCaption;
  const panel = document.querySelector(".mn-reels-caption-panel");
  const textEl = panel ? panel.querySelector(".mn-reels-caption-text") : null;
  if (shownCaption) {
    const html = `${escapeHtml(shownCaption)}${isLong ? ` <button class="mn-reels-readmore" onclick="toggleReelCaption('${q.id}')">${expanded ? "Show less" : "Read more"}</button>` : ""}`;
    if (textEl) textEl.innerHTML = html;
    else if (authorEl) authorEl.insertAdjacentHTML("afterend", `<p class="mn-reels-caption-text">${html}</p>`);
  } else if (textEl) {
    textEl.remove();
  }

  updateReelsStatsOnly();
  preloadReelNeighbors(idx, reels);
}
function preloadReelNeighbors(idx, reels) {
  [idx + 1, idx - 1].forEach(i => {
    const r = reels[(i + reels.length) % reels.length];
    if (r) new Image().src = r.image;
  });
}

// Partial refresh for the detail screen: updates the upvote count/state and the
// answers count in place, without touching .mn-detail-post (which holds the
// video/image/Spotify embed) — so playback isn't interrupted.
function updateDetailStatsOnly() {
  const q = findQuestionById(state.detailId);
  if (!q) return;
  const countEl = document.querySelector(".mn-detail-actions-row .mn-count");
  if (countEl) countEl.textContent = q.points || 0;
  const btn = document.querySelector(".mn-detail-actions-row .mn-stat");
  if (btn) btn.classList.toggle("mn-stat-upvoted", !!(state.user && (q.upvoterIds || []).includes(state.user.uid)));
  const answersCountEl = document.querySelector(".mn-answers-count");
  if (answersCountEl) answersCountEl.textContent = `${q.answersCount || 0} ${(q.answersCount || 0) === 1 ? "Answer" : "Answers"}`;
}

// Partial refresh for the answers list: swaps just the comments block, leaving
// .mn-detail-post (and its embedded media) untouched.
function updateAnswersListOnly(id) {
  const q = findQuestionById(id);
  if (!q) return;
  const answers = state.answersByQuestion[id] || [];
  const html = answers.length === 0
    ? `<p class="mn-empty-sub" style="text-align:center;padding:20px 0;">No answers yet. Be the first to help!</p>`
    : `<div class="mn-comments">${answers.map((a) => answerCardHtml(q, a)).join("")}</div>`;
  const detailEl = document.querySelector(".mn-detail");
  const existing = detailEl && detailEl.querySelector(".mn-comments, .mn-empty-sub");
  if (existing) existing.outerHTML = html;
  updateDetailStatsOnly();
}

// ---------------- feed "Read more" (inline expand for truncated post text) ----------------
// Post text in the feed is clamped to a few lines via CSS. Rather than guess
// a character-count cutoff, a "Read more" button is added only to posts that
// are actually visually truncated, measured after each paint. Tapping it just
// toggles the clamp off in place — no navigation, no full post opens.
function toggleReadMore(btn, ev) {
  if (ev) ev.stopPropagation();
  const p = btn.previousElementSibling;
  if (!p || !p.classList.contains("mn-post-desc")) return;
  const expanded = p.classList.toggle("mn-post-desc-expanded");
  btn.textContent = expanded ? "Show less" : "Read more";
}
window.toggleReadMore = toggleReadMore;

function markTruncatedPosts() {
  document.querySelectorAll(".mn-post-desc").forEach((p) => {
    if (p.classList.contains("mn-post-desc-expanded")) return;
    const next = p.nextElementSibling;
    const hasBtn = next && next.classList && next.classList.contains("mn-read-more");
    if (p.scrollHeight > p.clientHeight + 2) {
      if (!hasBtn) p.insertAdjacentHTML("afterend", `<button type="button" class="mn-read-more" onclick="toggleReadMore(this, event)">Read more</button>`);
    } else if (hasBtn) {
      next.remove();
    }
  });
}
let markTruncatedRaf = null;
function scheduleMarkTruncated() {
  if (markTruncatedRaf) cancelAnimationFrame(markTruncatedRaf);
  markTruncatedRaf = requestAnimationFrame(markTruncatedPosts);
}
// Watches the whole app for DOM changes (new feed cards, re-renders, infinite
// scroll) and re-checks truncation, so "Read more" stays correct everywhere
// questionCardHtml() is used without having to hook every render call site.
new MutationObserver(scheduleMarkTruncated).observe(document.getElementById("root"), { childList: true, subtree: true });

render();

maybeOpenSharedChannel();
maybeOpenSharedChallenge();
trackEvent("screen_view", { screen_name: "home" });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}

const mnBanner = document.querySelector('.mn-install-banner');
const mnBannerText = mnBanner ? mnBanner.querySelector('span') : null;
const mnBannerBtn = mnBanner ? mnBanner.querySelector('button') : null;

// Already installed / running standalone? Never show the banner.
const mnIsStandalone =
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

const mnIsIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!mnIsStandalone && mnBanner) {
    mnBanner.classList.add('mn-install-banner-show');
  }
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
    mnBanner.classList.remove('mn-install-banner-show');
    return;
  }
  // No native prompt available (iOS, or Chrome hasn't fired it yet) — show manual instructions instead.
  if (mnIsIOS) {
    alert('To install: tap the Share icon, then "Add to Home Screen".');
  } else {
    alert('To install: open the browser menu (⋮) and tap "Install app".');
  }
}

// Fallback: if beforeinstallprompt never fires (iOS, or some Android/Chrome
// versions delay it), still surface the banner after a short delay so the
// user always sees an install message — installApp() falls back to manual
// instructions in that case.
window.addEventListener('load', () => {
  setTimeout(() => {
    if (!mnIsStandalone && mnBanner && !mnBanner.classList.contains('mn-install-banner-show')) {
      if (mnIsIOS && mnBannerText) {
        mnBannerText.textContent = 'Install MENYA: tap Share, then "Add to Home Screen"';
        if (mnBannerBtn) mnBannerBtn.style.display = 'none';
      }
      mnBanner.classList.add('mn-install-banner-show');
    }
  }, 2500);
});
</script>
