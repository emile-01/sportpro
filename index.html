const COV={map:{},q:[],busy:false,io:null,fail:new Set()},COV_TTL=6e5;
try{Object.assign(COV.map,JSON.parse(localStorage.getItem("covs")||"{}"))}catch(e){}
function covSave(){
  const ks=Object.keys(COV.map).sort((a,b)=>COV.map[b].t-COV.map[a].t).slice(0,24),o={};
  ks.forEach(k=>o[k]=COV.map[k]);COV.map=o;

function covShow(w,d){
  if(w.querySelector(".cov"))return;
  const im=new Image();im.className="cov";im.alt="";
  im.onload=()=>im.classList.add("on");im.src=d;w.appendChild(im);
}
function covGrab(s){
  return new Promise(res=>{
    const v=document.createElement("video");v.muted=true;v.playsInline=true;
    let h=null,done=false;
    const end=d=>{if(done)return;done=true;clearTimeout(tm);if(h)h.destroy();v.pause();v.removeAttribute("src");v.load();res(d)};
    const tm=setTimeout(()=>end(null),15000);COV.kill=()=>end("x");
    const snap=()=>{
      try{
        if(!v.videoWidth)return end(null);
        const c=document.createElement("canvas"),x=c.getContext("2d");
        c.width=480;c.height=Math.round(480*v.videoHeight/v.videoWidth);
        x.drawImage(v,0,0,c.width,c.height);
        const p=x.getImageData(0,0,c.width,c.height).data;let sum=0,n=0;
        for(let i=0;i<p.length;i+=400){sum+=p[i]+p[i+1]+p[i+2];n+=3}
        if(sum/n<10)return end(null);
        end(c.toDataURL("image/jpeg",.6));
      }catch(e){end(null)}
    };
    v.onplaying=()=>setTimeout(snap,1200);
    if(window.Hls&&Hls.isSupported()){
      h=new Hls({startLevel:0,maxBufferLength:4,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:1});
      h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)end(null)});
      h.loadSource(s.url);h.attachMedia(v);
    }else{v.crossOrigin="anonymous";v.src=s.url}
    v.play().catch(()=>{});
  });
}
async function covNext() {
    if (covHold()) return;
  if(COV.busy)return;
  const w=COV.q.shift();if(!w)return;
  const id=w.dataset.pv,s=all.find(x=>x.id===id),c=COV.map[id];
  if(!s)return covNext();
  if(c&&c.d&&Date.now()-c.t<COV_TTL){if(w.isConnected)covShow(w,c.d);return covNext()}
  COV.busy=true;
  const d=await covGrab(s);
  COV.busy=false;
  if(d&&d!=="x"){COV.map[id]={d,t:Date.now()};covSave();if(w.isConnected)covShow(w,d)}
  else if(d!=="x")COV.fail.add(id);
  covNext();
}
function pvStop(){COV.q.length=0;if(COV.io)COV.io.disconnect()}
function pvScan(){
  if(COV.io)COV.io.disconnect();
  COV.io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      const w=e.target,id=w.dataset.pv,c=COV.map[id];
      COV.io.unobserve(w);
      if(c&&c.d){covShow(w,c.d);if(Date.now()-c.t<COV_TTL)return}
      if(COV.fail.has(id)||(navigator.connection&&navigator.connection.saveData))return;
      COV.q.push(w);covNext();
    });
  },{rootMargin:"200px"});
  document.querySelectorAll(".aw[data-pv]").forEach(w=>COV.io.observe(w));
}

async function loadTv(){
  const out=[],seen=new Set();
  const add=(name,url,icon,home)=>{
    const k=(name||"").toLowerCase();
    if(!k||!url||seen.has(k))return;
    if(location.protocol==="https:"&&url.startsWith("http:"))return;
    seen.add(k);
    out.push({id:"tv:"+url,type:"tv",cat:"rw",name,url,icon:icon||"",home:home||"",meta:"TV channel"});
  };
  let lg={},api=null;
  try{api=await Promise.race([rwApi(),new Promise((_,j)=>setTimeout(j,5000))]);lg=api.logos||{}}catch(e){}
  for(const u of TV){
    try{
      const r=await ft(u);if(!r.ok)continue;
      let info=null;
      for(const l of (await r.text()).split(/\r?\n/)){
        if(l.startsWith("#EXTINF"))info=l;
        else if(info&&l.trim()&&!l.startsWith("#")){
          const name=info.slice(info.lastIndexOf(",")+1).trim().replace(/\s*\((\d+p|Geo-blocked)\)/gi,"").replace(/\s*\[.*?\]/g,"");
          const tid=(info.match(/tvg-id="([^"@]*)/)||[])[1]||"";
          const icon=(info.match(/tvg-logo="([^"]*)"/)||[])[1]||lg[tid]||"";
          add(name,l.trim(),icon);
          info=null;
        }
      }
      if(out.length)break;
    }catch(e){}
  }
  if(api)api.streams.forEach(x=>add(nameOf(x.title||""),x.url,lg[x.channel]));
  BACKUP_TV.forEach(([n,u])=>add(n,u,lg[LOGO_FIX[n]],BACKUP_HOME[n]));
  tv=out;dbg("TV list ready: "+out.length+" channels");
}

function play(i){

    hls.on(Hls.Events.ERROR,(e,d)=>{dbg("HLS "+d.type+" / "+d.details+(d.response?" HTTP "+d.response.code:""));if(d.fatal)fail(i)});
    hls.loadSource(s.url);hls.attachMedia(au);
  }else au.src=s.url;

  render();
}

/* ===== INTERNATIONAL TV FIX ===== */
const CAT_BUSY={},CAT_WANT=12,CAT_POOL=80,CAT_TTL=108e5;
const absUrl=(b,u)=>{try{return new URL(u,b).href}catch(e){return""}};

async function probeTv(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
  try{
    let r=await fetch(url,{signal:c.signal});
    if(!r.ok)return false;
    let txt=await r.text();
    if(!/^#EXTM3U/.test(txt.trim()))return false;
    let base=r.url||url,ls=txt.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith("#"));
    if(!ls.length)return false;
    if(/#EXT-X-STREAM-INF/.test(txt)){
      const next=absUrl(base,ls[0].trim());
      r=await fetch(next,{signal:c.signal});if(!r.ok)return false;
      txt=await r.text();base=r.url||next;
      ls=txt.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith("#"));
      if(!ls.length)return false;
    }
    const sr=await fetch(absUrl(base,ls[ls.length-1].trim()),{signal:c.signal});
    const ok=sr.ok;c.abort();return ok;
  }catch(e){return false}
  finally{clearTimeout(t)}
}

function pickCands(items,c,n){
  if(c!=="sports")return items.slice(0,n);
  const groups=SPORTS.map(re=>items.filter(x=>re.test(x.name+" "+x.meta)));
  const out=[],seen=new Set();
  for(let i=0;out.length<n&&groups.some(g=>i<g.length);i++)
    for(const g of groups){const x=g[i];if(x&&!seen.has(x.id)&&out.length<n){seen.add(x.id);out.push(x)}}
  return out;
}

async function loadCat(c){
  if(loaded[c]||CAT_BUSY[c])return;
  failed[c]=false;
  try{
    const k=JSON.parse(localStorage.getItem("catv_"+c)||"null");
    if(k&&Date.now()-k.t<CAT_TTL&&k.items&&k.items.length){extra=extra.filter(x=>x.cat!==c).concat(k.items);loaded[c]=true;return}
  }catch(e){}
  CAT_BUSY[c]=true;
  let cand=[];
  for(const u of CAT_SRC(c)){
    try{const r=await ft(u,10000);if(r.ok){cand=parseM3u(await r.text(),c);if(cand.length)break}}catch(e){}
  }
  cand=pickCands(cand,c,CAT_POOL);
  (BACKUP_CAT[c]||[]).slice().reverse().forEach(([name,url])=>{
    if(!cand.some(x=>x.url===url))cand.unshift({id:"tv:"+url,type:"tv",cat:c,name,url,icon:"",meta:"TV channel"});
  });
  const good=[];let idx=0;
  const worker=async()=>{
    while(good.length<CAT_WANT&&idx<cand.length){
      const x=cand[idx++];
      if(await probeTv(x.url)&&good.length<CAT_WANT){
        good.push(x);
        extra=extra.filter(y=>y.cat!==c).concat(good);
        merge();
      }
    }
  };
  await Promise.all(Array.from({length:8},worker));
  CAT_BUSY[c]=false;
  if(good.length){
    loaded[c]=true;
    try{localStorage.setItem("catv_"+c,JSON.stringify({t:Date.now(),items:good}))}catch(e){}
  }else failed[c]=true;
  merge();
}
/* ===== END INTERNATIONAL TV FIX ===== */

// 2) logos already loaded appear instantly
const LOGO_OK=new Set();
function loadLogo(av,list,fail){
  const next=()=>{
    const u=list.shift();if(!u){if(fail)fail();return}
    const im=new Image();im.alt="";im.referrerPolicy="no-referrer";
    const known=LOGO_OK.has(u);let done=false;
    im.decoding=known?"sync":"async";
    const show=()=>{
      if(done)return;
      if(im.naturalWidth<24&&u.includes("google.com/s2")){done=true;badLogo.add(u);next();return}
      done=true;LOGO_OK.add(u);
      av.textContent="";av.classList.add("has");
      if(u===TV_DEFAULT||u===RADIO_DEFAULT)av.classList.add("def");
      av.appendChild(im);av.style.setProperty("--logo",'url("'+u+'")');
    };
    im.onload=show;
    im.onerror=()=>{if(done)return;done=true;badLogo.add(u);LOGO_OK.delete(u);next()};
    im.src=u;
    if(known&&im.complete&&im.naturalWidth)show();
  };
  next();
}

let _mt=null,_sig="";
function merge(){
  const playing=cur>=0?all[cur]?.id:null;
  all=radio.concat(tv,extra);cur=playing?all.findIndex(s=>s.id===playing):-1;
  const sig=[tab,$("q").value,all.length,cur>=0?all[cur].id:"",bad.size,dead.size,JSON.stringify(failed)].join("|");
  if(sig===_sig)return;
  clearTimeout(_mt);
  _mt=setTimeout(()=>{_sig=sig;const y=window.scrollY;render();window.scrollTo(0,y)},300);
}

function drawChat(list){
  const box=$("cmsgs"),fresh=box.dataset.fresh==="1",near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML="";box.dataset.fresh="0";
  if(!list.length){box.innerHTML='<div class="cempty"><b>No messages yet</b><span>Be the first to say hello.</span></div>';return}
  const me=localStorage.getItem("cname")||"";let prev=null;
  list.forEach(m=>{
    const t=m.t&&m.t.toDate?m.t.toDate():new Date(),mine=m.n===me,grp=prev&&prev.n===m.n&&(t-prev.t)<3e5;
    const row=document.createElement("div");row.className="cr"+(mine?" me":"")+(grp?" g":"");
    if(!mine){const av=document.createElement("div");av.className="cav";av.style.setProperty("--h",hue(m.n||"?"));av.textContent=(m.n||"?")[0].toUpperCase();row.appendChild(av)}
    const col=document.createElement("div");col.className="cc";
    if(!mine&&!grp){const n=document.createElement("div");n.className="cn";n.textContent=m.n;col.appendChild(n)}
    const b=document.createElement("div");b.className="cb";
    const tx=document.createElement("span");tx.textContent=m.m;
    const tm=document.createElement("small");tm.textContent=t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    b.append(tx,tm);col.appendChild(b);row.appendChild(col);box.appendChild(row);
    prev={n:m.n,t};
  });
  if(fresh||near)box.scrollTop=box.scrollHeight;
}
