// "Write" posts need body text; "Link" posts just need a link (a caption is optional) —
// mirrors how sharing a link works on other social apps.
function canPostForm() {
  return state.createTab === "link" ? !!state.form.link.trim() : !!state.form.body.trim();
}
// There's no separate title field in the composer anymore (see renderCreate) — this
// derives a short label from what the person actually wrote, purely for places that
// still need a compact title (browser tab, share text, history list, notifications).
function deriveTitleFromForm() {
  const firstLine = state.form.body.trim().split("\n")[0] || "";
  if (firstLine) return firstLine.length > 140 ? firstLine.slice(0, 137).trim() + "…" : firstLine;
  if (state.form.link.trim()) return "Shared a link from " + getUrlDomain(state.form.link.trim());
  return "Untitled post";
}
function getMediaDimsFromText(text) {
  const url = extractImageUrl(text) || extractVideoUrl(text);
  if (!url) return Promise.resolve({ mediaWidth: null, mediaHeight: null });
  const isVideo = !!extractVideoUrl(text);
  return new Promise((resolve) => {
    const el = isVideo ? document.createElement("video") : new Image();
    const done = (w, h) => resolve({ mediaWidth: w || null, mediaHeight: h || null });
    if (isVideo) { el.preload = "metadata"; el.onloadedmetadata = () => done(el.videoWidth, el.videoHeight); }
    else { el.onload = () => done(el.naturalWidth, el.naturalHeight); }
    el.onerror = () => done(null, null);
    setTimeout(() => done(null, null), 4000);
    el.src = url;
  });
}

async function postQuestion() {
  if (!state.user) { setState({ pendingScreen: "create", authModal: "signin" }); return; }
  if (!canPostForm()) return;
  if (state.postBusy) return; // guard against a double tap firing this twice and creating duplicate posts
  setState({ postBusy: true });
  const tags = extractHashtags(state.form.body + " " + (state.form.link || ""));
  const { mediaWidth, mediaHeight } = await getMediaDimsFromText(state.form.body + " " + (state.form.link || ""));
  const payload = {
    title: deriveTitleFromForm(),
    body: state.form.body.trim(),
    linkUrl: state.createTab === "link" && state.form.link.trim() ? state.form.link.trim() : null,
    tags,
    authorId: state.user.uid,
    authorName: state.profile.username,
    authorPhoto: state.profile.photoURL || "",
    authorRegion: state.profile.region || null, // powers the "near you" boost/badge for readers in the same region
    createdAt: serverTimestamp(),
    answersCount: 0,
    points: 0,
    upvoterIds: [],
    views: 0,
    sharesCount: 0,
    mediaWidth,
    mediaHeight,
  };
  try {
    await addDoc(collection(db, "questions"), payload);
    await updateDoc(doc(db, "users", state.user.uid), { totalQuestions: increment(1) });
  } catch (e) {
    setState({ postBusy: false });
    showToast("Couldn't post. Please try again.", "error");
    return;
  }
  state.profile.totalQuestions = (state.profile.totalQuestions || 0) + 1;
  // Briefly show a "Posted!" confirmation on the button (still disabled/busy) before
  // clearing the form and leaving the create screen, so a second tap can't slip in
  // while the first post is still being confirmed.
  const btn = document.querySelector(".mn-postbtn");
  if (btn) btn.innerHTML = `<span class="mn-btn-checkicon">${iconOk()}</span> Posted!`;
  hapticTap(12);
  recordTagInterest(tags, 5); // posting with a tag is the strongest interest signal
  await new Promise((res) => setTimeout(res, 320));
  state.form = { body: "", link: "" };
  state.createTab = "write";
  state.screen = "home";
  state.myQuestionsLoaded = false;
  state.postBusy = false;
  resetCommittedFeed(); // land back on Home already showing the post just made, not a "1 new post" pill
  render();
  trackEvent("question_posted", {});
  showToast("Your post is live!");
}

// One view per question per browser session (via a Set in memory), so
// refreshing or reopening the same post while browsing doesn't inflate the
// count — mirrors how most feed apps count a "view" once per session.
const viewedThisSession = new Set();
function trackViewOnce(id) {
  if (viewedThisSession.has(id)) return;
  viewedThisSession.add(id);
  const q = findQuestionById(id);
  if (q) { q.views = (q.views || 0) + 1; recordTagInterest(q.tags, 1); }
  updateDoc(doc(db, "questions", id), { views: increment(1) }).catch(() => {});

async function submitAnswer(qid) {
  if (!state.user) { setState({ pendingScreen: state.commentsOpen ? "comments" : "detail", authModal: "signin" }); return; }
  if (!state.answerDraft.trim()) return;

  if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = `<span class="mn-spinner"></span>`; }
  const q = findQuestionById(qid);
  const quoted = state.quoteTarget;
  const draftBody = state.answerDraft.trim();
  recordTagInterest(q && q.tags, 4); // answering a post is a strong interest signal
  // Any Firestore call below can fail (offline, permissions, etc). Without a
  // try/catch here, a failure left the composer stuck forever: answerBusy
  // stayed true, the send button stayed disabled with its spinner, and the
  // comment simply vanished with no explanation. Now a failure restores the
  // composer and tells the reader to retry, same as postQuestion() does.
  try {
    await addDoc(collection(db, "questions", qid, "answers"), {
      body: draftBody,
      authorId: state.user.uid,

    await updateDoc(doc(db, "users", state.user.uid), { totalAnswers: increment(1) });
  } catch (e) {

    }
    showToast("Couldn't post your comment. Please try again.", "error");
    return;
  }
  if (q && q.authorId) createNotification(q.authorId, { type: "answer", questionId: qid, preview: draftBody.slice(0, 90) });

  state.answerDraft = "";
  state.answerBusy = false;
  state.quoteTarget = null;

  await loadAnswers(qid);

// ---------------- threaded replies (Threads-style discussion under each answer) ----------------
function repliesKey(qid, aid) { return `${qid}_${aid}`; }

async function loadReplies(qid, aid) {
  const snap = await getDocs(query(collection(db, "questions", qid, "answers", aid, "replies"), orderBy("createdAt", "asc")));
  state.repliesByAnswer[repliesKey(qid, aid)] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  if ((state.screen === "detail" && document.querySelector(".mn-detail-post")) || commentsSheetMounted()) updateAnswersListOnly(qid);
  else render();
}

function toggleThread(qid, aid) {
  const key = repliesKey(qid, aid);
  const expanded = !state.expandedThreads[aid];
  state.expandedThreads = { ...state.expandedThreads, [aid]: expanded };
  if ((state.screen === "detail" && document.querySelector(".mn-detail-post")) || commentsSheetMounted()) updateAnswersListOnly(qid);
  else render();
  if (expanded && !Object.prototype.hasOwnProperty.call(state.repliesByAnswer, key)) loadReplies(qid, aid);
}

function toggleReplyBox(qid, aid, replyingTo) {
  const opening = state.openReplyBox !== aid || !!replyingTo;
  state.openReplyBox = opening ? aid : null;
  state.replyingTo = opening ? (replyingTo || null) : null;
  if (opening) state.expandedThreads = { ...state.expandedThreads, [aid]: true };
  if ((state.screen === "detail" && document.querySelector(".mn-detail-post")) || commentsSheetMounted()) updateAnswersListOnly(qid);
  else render();
  if (opening) {
    const key = repliesKey(qid, aid);
    if (!Object.prototype.hasOwnProperty.call(state.repliesByAnswer, key)) loadReplies(qid, aid);
    setTimeout(() => { const el = document.getElementById(`mn-replybox-${aid}`); if (el) el.focus(); }, 30);
  }
}

function setReplyDraft(aid, v) {
  state.replyDrafts = { ...state.replyDrafts, [aid]: v };
  const btn = document.querySelector(`.mn-reply-send[data-aid="${aid}"]`);
  if (btn) btn.disabled = !(v.trim() && !state.replyBusy[aid]);
}

async function submitReply(qid, aid) {
  if (!state.user) { setState({ pendingScreen: state.commentsOpen ? "comments" : "detail", authModal: "signin" }); return; }
  const draft = (state.replyDrafts[aid] || "").trim();
  if (!draft) return;
  state.replyBusy = { ...state.replyBusy, [aid]: true };
  if ((state.screen === "detail" && document.querySelector(".mn-detail-post")) || commentsSheetMounted()) updateAnswersListOnly(qid);
  else render();
  const replyingTo = state.replyingTo && state.replyingTo.aid === aid ? state.replyingTo : null;
  // Same failure mode as submitAnswer(): without this try/catch, a failed
  // write left replyBusy[aid] stuck true forever — the reply box stayed
  // disabled with no way to retry or even know it had failed.
  try {
    await addDoc(collection(db, "questions", qid, "answers", aid, "replies"), {
      body: draft,
      authorId: state.user.uid,
      authorName: state.profile.username,
      authorPhoto: state.profile.photoURL || "",
      createdAt: serverTimestamp(),
      points: 0,
      upvoterIds: [],
      replyingToName: replyingTo ? replyingTo.name : null,
    });
  } catch (e) {
    console.error(e);
    state.replyBusy = { ...state.replyBusy, [aid]: false };
    if ((state.screen === "detail" && document.querySelector(".mn-detail-post")) || commentsSheetMounted()) updateAnswersListOnly(qid);
    else render();
    showToast("Couldn't post your reply. Please try again.", "error");
    return;
  }
  await updateDoc(doc(db, "questions", qid, "answers", aid), { repliesCount: increment(1) }).catch(() => {});
  // Notify the person being replied to: a specific reply author if this was an
  // @mention-style threaded reply, otherwise the answer's author.
  const targetReply = replyingTo && replyingTo.rid
    ? (state.repliesByAnswer[repliesKey(qid, aid)] || []).find((r) => r.id === replyingTo.rid)
    : null;
  const answerAuthorId = (() => {
    const a = (state.answersByQuestion[qid] || []).find((a) => a.id === aid);
    return a ? a.authorId : null;
  })();
  createNotification(targetReply ? targetReply.authorId : answerAuthorId, { type: "reply", questionId: qid, answerId: aid, replyId: null, preview: draft.slice(0, 90) });
  state.replyDrafts = { ...state.replyDrafts, [aid]: "" };
  state.replyBusy = { ...state.replyBusy, [aid]: false };
  state.replyingTo = null;
  hapticTap(10);
  await loadReplies(qid, aid);
  trackEvent("reply_posted", { question_id: qid, answer_id: aid });
}

async function upvoteReply(qid, aid, rid, ev) {
  if (ev) ev.stopPropagation();
  if (!state.user) { setState({ pendingScreen: state.commentsOpen ? "comments" : "detail", authModal: "signin" }); return; }
  const key = repliesKey(qid, aid);
  const replies = state.repliesByAnswer[key] || [];
  const r = replies.find((r) => r.id === rid);
  if (!r || (r.upvoterIds || []).includes(state.user.uid)) return;
  celebrateUpvote(ev && ev.currentTarget);

// Builds the actual invite copy people send out — a short "hook" line that
// sells MENYA itself (not just a bare link), so whoever receives it has a
// reason to tap through and discover the app, not just this one post.
function shareHookLine(kind, title, forwardSnippet) {
  if (forwardSnippet) return `↪️ Forwarded from "${title}" on MENYA:\n"${forwardSnippet}"`;
  return kind === "profile"
    ? `👀 Come discover ${title} on MENYA — ask, share, and learn together.`
    : kind === "channel"
    ? `📢 Join the "${title}" channel on MENYA to get their updates.`
    : kind === "challenge"
    ? `🧠 Think you can beat "${title}"? Play it on MENYA.`
    : `🔥 Come discover "${title}" on MENYA — ask, share, and learn together.`;
}
function shareTo(platform) {
  if (!state.shareModal) return;
  const { id, title, kind, forwardSnippet } = state.shareModal;
  const isProfile = kind === "profile";
  const isChannel = kind === "channel";
  const isChallenge = kind === "challenge";
  const url = isProfile
    ? location.origin + location.pathname + "?u=" + id.replace(/^u_/, "")
    : isChannel
    ? location.origin + location.pathname + "?c=" + id.replace(/^c_/, "")
    : isChallenge
    ? location.origin + location.pathname + "?ch=" + id.replace(/^ch_/, "")
    : location.origin + location.pathname + "?q=" + id;
  const hookLine = shareHookLine(kind, title, forwardSnippet);
  const shareMessage = hookLine + "\n" + url;
  trackEvent("share", { method: platform, content_type: isProfile ? "profile" : isChannel ? "channel" : "question", item_id: id });
  if (!isProfile && !isChannel) {
    const q = findQuestionById(id);
    if (q) q.sharesCount = (q.sharesCount || 0) + 1;
    updateDoc(doc(db, "questions", id), { sharesCount: increment(1) }).catch(() => {});
  }
  if (platform === "whatsapp") window.open("https://wa.me/?text=" + encodeURIComponent(shareMessage), "_blank");
  else if (platform === "telegram") window.open("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(hookLine), "_blank");
  else if (platform === "copy") navigator.clipboard.writeText(shareMessage).then(() => showToast("Message copied — paste it anywhere!"));
  closeShare();
}

function reelsNext() {
  const reels = getReelPosts();

// Swipe left/right to move between reels — matches the tap-arrow navigation,
// just via touch. A vertical drag (scrolling) is ignored so it doesn't fight
// with an accidental diagonal swipe.
let reelsTouchStartX = null;
let reelsTouchStartY = null;
function reelsTouchStart(e) {
  if (!e.touches || !e.touches[0]) return;
  reelsTouchStartX = e.touches[0].clientX;
  reelsTouchStartY = e.touches[0].clientY;
}
function reelsTouchEnd(e) {
  if (reelsTouchStartX === null || !e.changedTouches || !e.changedTouches[0]) return;
  const dx = e.changedTouches[0].clientX - reelsTouchStartX;
  const dy = e.changedTouches[0].clientY - reelsTouchStartY;
  reelsTouchStartX = null;
  reelsTouchStartY = null;
  if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
  if (dx < 0) reelsNext(); else reelsPrev();
}

// Only accepts links that are actually hosted on Wikimedia — either a direct
// upload.wikimedia.org image file, or any *.wikimedia.org subdomain (which
// covers commons.wikimedia.org file pages people might paste by mistake).
function isWikimediaPhotoUrl(url) {
  if (!url) return false;
  try {
    const u = new URL(url.trim());
    return u.protocol === "https:";
  } catch (e) { return false; }
}
// People very often paste the Commons "File:" page link (what you get from
// the browser address bar or "Share"), not the actual raw image URL — that
// page is HTML, not an image, so an <img> pointed at it just fails to load.
// Rewrite it to Wikimedia's Special:FilePath redirect, which resolves
// straight to the real image file. Anything already a direct file (e.g.
// upload.wikimedia.org/...) passes through unchanged.
// Extracts the bare Wikimedia filename from any of the shapes people paste:
// a Commons "File:"/"Image:" page, an already-built Special:FilePath link,
// or a direct upload.wikimedia.org file/thumb URL.
function extractWikimediaFilename(u) {
  let m = u.pathname.match(/\/wiki\/Special:FilePath\/(.+)$/i);
  if (m) return decodeURIComponent(m[1]);
  m = u.pathname.match(/\/wiki\/(?:File|Image):(.+)$/i);
  if (m) return decodeURIComponent(m[1]);
  // upload.wikimedia.org paths look like /wikipedia/commons/a/ab/Name.jpg or
  // .../thumb/a/ab/Name.jpg/120px-Name.jpg — the real filename is the last
  // segment, minus any "NNNpx-" thumbnail-size prefix.
  const segs = u.pathname.split("/").filter(Boolean);
  let last = segs[segs.length - 1] || "";
  last = last.replace(/^\d+px-/, "");
  return last ? decodeURIComponent(last) : "";
}
// Always resolves to a Special:FilePath link with a `width` param, so the
// browser fetches a small scaled thumbnail instead of the (often multi-MB)
// original — originals were slow/unreliable to load as tiny round avatars,
// especially once a re-render recreated the <img> mid-download.
function normalizeWikimediaUrl(raw, width) {
  const trimmed = (raw || "").trim();
  if (!trimmed || !isWikimediaPhotoUrl(trimmed)) return trimmed;
  try {
    const u = new URL(trimmed);
    // Only rewrite genuine Wikimedia links (e.g. a Commons File: page) into a
    // direct FilePath thumbnail. Any other https link — catbox.moe included —
    // is already a direct file URL, so pass it through unchanged.
    if (!/(^|\.)wikimedia\.org$/i.test(u.hostname)) return trimmed;
    const filename = extractWikimediaFilename(u);
    if (!filename) return trimmed;
    const out = new URL(`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(filename)}`);
    if (width) out.searchParams.set("width", String(width));
    return out.toString();
  } catch (e) { return trimmed; }
}
// Full render() replaces the whole DOM tree, which would knock focus out of
// the text field on every keystroke — so the photo URL preview is patched
// in place instead, the same way renderFeedOnly() avoids that for search.
function updatePhotoPreviewOnly() {
  const preview = document.querySelector(".mn-photo-edit-preview");
  const status = document.querySelector(".mn-photo-edit-status");
  if (!preview) return;
  const raw = (state.profileForm.photoUrl || "").trim();
  if (status) status.textContent = "";
  if (!raw) { preview.innerHTML = iconPersonSilhouette(); return; }
  if (!isWikimediaPhotoUrl(raw)) {
    preview.innerHTML = iconPersonSilhouette();
    if (status) status.textContent = "That's not a valid link.";
    return;
  }
  const direct = normalizeWikimediaUrl(raw, 150);
  preview.innerHTML = `<img class="mn-avatar-img" src="${escapeHtml(direct)}" alt="" onerror="previewImgError(this)" />`;
}
// Distinct from avatarImgError below: this one is for the edit-form preview
// specifically, so a bad/unreachable link tells the person why instead of
// just silently reverting to the placeholder icon.
function previewImgError(el) {
  if (el && el.parentElement) el.parentElement.innerHTML = iconPersonSilhouette();

}
function setProfileField(field, v) { state.profileForm[field] = v; if (field === "photoUrl") updatePhotoPreviewOnly(); }
async function saveProfile() {
  const rawInput = (state.profileForm.photoUrl || "").trim();

    showToast("That doesn't look like a valid link. Paste a direct image link (e.g. from catbox.moe).");

// In-memory cache of uid -> photoURL ("" = known to have no photo). Lets any
// avatar anywhere in the app (feed, comments, leaderboard, notifications...)
// show a person's current profile photo without denormalizing it onto every
// post/answer/reply document — so changing your photo updates it everywhere
// instantly for content already on screen, and on next render for the rest.
const photoFetchInFlight = new Set();
function ensurePhotoCached(uid) {
  if (!uid || Object.prototype.hasOwnProperty.call(state.photoCache, uid) || photoFetchInFlight.has(uid)) return;
  photoFetchInFlight.add(uid);
  getDoc(doc(db, "users", uid)).then((snap) => {
    photoFetchInFlight.delete(uid);
    const url = snap.exists() ? (snap.data().photoURL || "") : "";
    const changed = state.photoCache[uid] !== url;
    state.photoCache[uid] = url;
    if (changed) render();
  }).catch(() => { photoFetchInFlight.delete(uid); state.photoCache[uid] = ""; });
}
function avatarImgError(el) {
  if (!el || !el.parentElement) return;
  el.parentElement.innerHTML = iconPersonSilhouette();
}
function avatarHtml(name, uid, knownPhoto) {
  const label = `${escapeHtml(name || "User")} avatar`;
  const isChannel = uid && uid.startsWith("chan_");
  let photo = "";
  if (typeof knownPhoto === "string" && isChannel) {
    // Channel avatarUrl is always read live from the channel doc — trust it.
    photo = knownPhoto;
    state.photoCache[uid] = knownPhoto;
  } else if (uid && Object.prototype.hasOwnProperty.call(state.photoCache, uid)) {
    // We already know this person's CURRENT photo (from a live fetch, or
    // set on save) — that's always fresher than a photo snapshotted onto
    // an old post/comment/reply, so it wins.
    photo = state.photoCache[uid] || "";
  } else if (typeof knownPhoto === "string") {
    // No cached value yet: show the snapshot immediately (no blank flash),
    // but don't record it as fact — fetch live so it self-corrects.
    photo = knownPhoto;
    if (uid) ensurePhotoCached(uid);
  } else if (uid) {
    ensurePhotoCached(uid);
  }
  if (photo) photo = normalizeWikimediaUrl(photo, 240);
  const inner = photo
    ? `<img class="mn-avatar-img" src="${escapeHtml(photo)}" alt="" loading="lazy" onerror="avatarImgError(this)" />`
    : (uid && uid.startsWith("chan_")) ? `<img class="mn-avatar-img" src="favicon.png" alt="MENYA" />` : iconPersonSilhouette();
  return `<div class="mn-avatar" role="img" aria-label="${label}">${inner}</div>`;
}

// Reddit/HN-style "hot" score: engagement decays with age so new, actively-voted
// questions can outrank older ones, instead of a flat reverse-chron list.
function hotScore(q) {
  const points = q.points || 0;
  const answers = q.answersCount || 0;
  const age = Math.max(ageInHours(q.createdAt), 0);
  return (points + answers * 1.5 + 1) / Math.pow(age + 2, 1.5);
}
// "Top" ignores recency entirely — pure all-time engagement, like Reddit's Top sort.
function topScore(q) {
  return (q.points || 0) * 2 + (q.answersCount || 0);
}
// Weighted-random ordering (Efraimidis-Spirakis reservoir sampling): each
// item gets a random key scaled by its weight, then the list is sorted by
// that key. High-weight items land near the front far more often than low-
// weight ones, but the exact order is different every time it's computed —
// this is the "random + ranking blended" logic real feeds (Facebook,
// Instagram, TikTok) use instead of a flat, always-identical sort. A pure
// descending sort by score would show the same posts in the same order on
// every visit; blending in randomness keeps the feed feeling alive and
// worth re-checking without ever ignoring relevance — a post still needs a
// real (weight-driving) reason to reach the top.
function weightedShuffle(items, weightFn) {
  return items
    .map((item) => {
      const w = Math.max(weightFn(item), 0.0001);
      return { item, key: Math.pow(Math.random(), 1 / w) };
    })
    .sort((a, b) => b.key - a.key)
    .map((x) => x.item);
}
// Blended ranking for the "For You" feed — the same ingredients Facebook/Instagram/Reddit
// each lean on individually, combined into one score instead of one flat list:
//   1) posts from people you follow get a strong, near-guaranteed boost
//   2) trending discussions (hot score: engagement that decays with age)
//   3) high-quality answers (well-answered questions rank above empty ones)
//   4) new discoveries (a small "freshness" nudge so brand-new posts aren't
//      buried under older, already-popular ones before they get a chance)
function forYouScore(q) {
  let score = hotScore(q) * 10;               // trending discussions (base signal)
  score += Math.min(q.answersCount || 0, 10) * 3; // high-quality answers: more discussion = more signal
  if (isFollowedAuthor(q.authorId)) score += 500;  // followed users: surfaced first, like a friend's post
  if (isNearbyPost(q)) score += 60;                // people near you: local posts surface sooner
  if (ageInHours(q.createdAt) < 6) score += 25;    // new discoveries: give fresh posts room to be seen
  score += Math.min(tagAffinityScore(q), 400);     // learns from what you interact with, via hashtags
  return score;
}
// Small "why you're seeing this" pill for the For You feed, mirroring the
// context Facebook shows under a post ("Because you follow X").
function feedReason(q) {
  if (isFollowedAuthor(q.authorId)) return { label: "Following", icon: "" };
  if (isNearbyPost(q)) return { label: "Near you", icon: "" };
  if (tagAffinityScore(q) > 0 && q.tags && q.tags.length) return { label: "#" + q.tags[0], icon: "" };
  if ((q.answersCount || 0) >= 5) return { label: "Great discussion", icon: "" };
  if (ageInHours(q.createdAt) < 6) return { label: "New discovery", icon: "" };
  const signal = questionSignal(q);
  if (signal && signal.tier === "hot") return { label: "Trending", icon: "" };
  return null;
}
// The "For You" order is frozen for the current feed session instead of being
// recomputed on every render. Without this, following/unfollowing someone (or
// even just a vote count ticking up) instantly re-scores the whole list and
// posts jump around under the reader's thumb mid-scroll. Real feeds (Twitter,
// Threads, Instagram) don't do that — they settle an order when the feed loads
// and only reshuffle on an explicit refresh or when genuinely new posts arrive.
let forYouOrderSignature = null;
function computeForYouOrder(list) {
  // forYouScore() sets each post's WEIGHT rather than its fixed rank — see
  // weightedShuffle(). Posts already opened this session (trackViewOnce /
  // viewedThisSession) get their weight cut sharply so a re-settle surfaces
  // what's new first instead of showing the same already-read post again;
  // it isn't removed outright, so a genuinely great post can still resurface.
  const ordered = weightedShuffle(list, (q) => {
    const base = forYouScore(q) + 1;
    return viewedThisSession.has(q.id) ? base * 0.12 : base;
  });
  state.forYouOrderIds = ordered.map((q) => q.id);
  forYouOrderSignature = list.map((q) => q.id).sort().join(",");
}
// Call this to intentionally re-settle the "For You" order — on a deliberate
// navigation into the tab (not a passive re-render triggered by a follow
// toggle or a vote), so new follows/posts are reflected the next time the
// reader actually chooses to look at the feed again.
function refreshForYouOrder() { forYouOrderSignature = null; }
function sortQuestions(list, mode) {
  if (mode === "foryou") {
    const signature = list.map((q) => q.id).sort().join(",");
    if (signature !== forYouOrderSignature) computeForYouOrder(list);
    const byId = new Map(list.map((q) => [q.id, q]));
    return state.forYouOrderIds.map((id) => byId.get(id)).filter(Boolean);
  }
  if (mode === "following") {
    // Twitter/Threads-style "Following" tab: only posts from people you follow,
    // newest engagement first — no algorithmic surfacing of strangers' posts.
    const onlyFollowed = list.filter((q) => isFollowedAuthor(q.authorId));
    const scored = onlyFollowed.map((q) => ({ q, score: hotScore(q) }));
    scored.sort((a, b) => b.score - a.score);
    return scored.map((s) => s.q);
  }
  const scored = list.map((q) => ({ q, score: mode === "top" ? topScore(q) : mode === "new" ? (q.createdAt && q.createdAt.toMillis ? q.createdAt.toMillis() : 0) : hotScore(q) }));
  scored.sort((a, b) => b.score - a.score);
  return scored.map((s) => s.q);
}
// The "ideal" list per the active tab/search right now — same computation
// filteredQuestions() used to return directly. Kept separate so the committed-
// feed logic below can compare against it without triggering it itself.
function idealFeedList() {
  let list = state.questions;
  const term = state.searchTerm.trim().toLowerCase();
  if (term) {
    // "#coffee" (from a hashtag pill or typed directly) filters to an exact
    // tag match; any other search term still matches tags too, alongside the
    // existing title/body text search, so typing "coffee" finds #coffee posts.
    if (term.startsWith("#")) {
      const tag = term.slice(1);
      list = list.filter((q) => (q.tags || []).includes(tag));
    } else {
      list = list.filter((q) =>
        (q.title || "").toLowerCase().includes(term) ||
        (q.body || "").toLowerCase().includes(term) ||
        (q.tags || []).some((t) => t.includes(term))
      );
    }
  }
  return sortQuestions(list, state.sortMode);
}

// ---------------- feed stability: frozen "committed" order + New-posts pill ----------------
// Firestore's live listener can fire at any moment — a new post, an upvote
// anywhere on the page, a deleted post — but the feed the reader is currently
// looking at should never reorder or have posts spliced into it while they're
// mid-scroll; that's what actually caused the old "posts jump when a post
// loads" bug (a brand-new post landing at the top, or the For You ranking
// re-settling, instantly reshuffled the whole visible list). Instead:
//   - stat changes (points/answers) on posts already committed still update live
//   - a post disappearing (deleted) is dropped from the committed list right away
//   - a genuinely new post is HELD OUT and counted, surfaced as a "New posts"
//     pill, and only spliced in when the reader taps it (or they're already
//     sitting at the very top, where merging in fresh posts doesn't move
//     anything they're looking at)
let committedFeedIds = null;      // ids, in order, currently rendered in the feed
let committedFeedSortMode = null; // the tab+search key committedFeedIds was built for
let pendingNewCount = 0;          // new posts known to exist but withheld from view

function committedFeedKey() {
  return state.sortMode + "|" + state.searchTerm.trim().toLowerCase();
}
// Re-settles the committed feed to exactly match the ideal order right now —
// used on first load and whenever the tab or search term changes (a deliberate
// navigation, not a passive background update).
function resetCommittedFeed() {
  committedFeedIds = idealFeedList().map((q) => q.id);
  committedFeedSortMode = committedFeedKey();
  pendingNewCount = 0;
}
// Called from the live listener with each fresh snapshot. Returns true if the
// committed list itself changed (so the caller knows a full feed-DOM patch is
// needed); false means only stats on already-visible posts may have changed.
function reconcileCommittedFeed() {
  if (!committedFeedIds || committedFeedSortMode !== committedFeedKey()) {
    resetCommittedFeed();
    return true;
  }
  const idealIds = idealFeedList().map((q) => q.id);
  const idealSet = new Set(idealIds);
  const before = committedFeedIds;
  const kept = before.filter((id) => idealSet.has(id));
  let changed = kept.length !== before.length; // some post(s) got deleted
  const keptSet = new Set(kept);
  const newIds = idealIds.filter((id) => !keptSet.has(id));
  committedFeedIds = kept;
  if (newIds.length) {
    const atTop = window.scrollY <= 40; // nothing on screen to disturb — just adopt it
    if (atTop) {
      committedFeedIds = idealIds;
      pendingNewCount = 0;
      changed = true;
    } else {
      pendingNewCount += newIds.length;
    }
  }
  return changed;
}
// The list actually rendered: committed ids, refreshed with live doc data (so
// points/answers/etc. stay current) but never reordered or grown/shrunk except
// through resetCommittedFeed()/reconcileCommittedFeed() above.
function committedFeedList() {
  if (!committedFeedIds || committedFeedSortMode !== committedFeedKey()) resetCommittedFeed();
  const byId = new Map(state.questions.map((q) => [q.id, q]));
  return committedFeedIds.map((id) => byId.get(id)).filter(Boolean);
}
// Reader tapped the "New posts" pill: adopt the latest order and hop to the top.
function mergeNewPosts() {
  resetCommittedFeed();
  if (state.screen === "home" && document.querySelector(".mn-home")) renderFeedOnly();
  else updateNewPostsPill();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
window.mergeNewPosts = mergeNewPosts;
// Toggles the pill's visibility/count via direct DOM writes (no re-render) so
// a background listener tick never has to touch anything else on the page.
function updateNewPostsPill() {
  const pill = document.getElementById("mn-feed-newpost-pill");
  if (!pill) return;
  pill.classList.toggle("mn-feed-newpost-pill-visible", pendingNewCount > 0);
  const label = pill.querySelector(".mn-feed-newpost-label");
  if (label) label.textContent = `${pendingNewCount} new post${pendingNewCount === 1 ? "" : "s"}`;
}
function filteredQuestions() {
  return committedFeedList();
}

    ? `<div id="mn-imagetok-sentinel" class="mn-imagetok-sentinel">${questionsLoadingMore ? `<span class="mn-feed-spinner"></span>` : ""}</div>`
    : imageTokEndHtml();
  return `<div class="mn-imagetok-scroll" id="mn-imagetok-scroll">
    ${reels.map((r, i) => imageTokItemHtml(r, i)).join("")}
    ${itSentinel}
  </div>`;
}

function imageTokItemHtml(r, i) {
  const q = r.q;
  const caption = stripUrlsForFeed(q.body) || q.title || "";
  const authorNameEsc = escapeHtml(q.authorName || "").replace(/'/g, "\\'");
  return `
    <div class="mn-imagetok-item" data-imagetok-id="${q.id}">
      <div class="mn-imagetok-media">
        <img class="mn-imagetok-img" src="${escapeHtml(r.image)}" alt=""
             loading="${i < 2 ? "eager" : "lazy"}" decoding="async"
             onload="this.classList.add('mn-loaded')"
             onerror="mediaLoadError(this, '${escapeJsString(r.image)}')" />
      </div>
      <button class="mn-imagetok-back" onclick="setSortMode('foryou')" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="mn-imagetok-caption" onclick="openDetail('${q.id}', 'home')" role="button" tabindex="0" aria-label="Open post">
        <div class="mn-imagetok-author" onclick="openUserProfile('${q.authorId || ""}', '${authorNameEsc}', event)">
          ${avatarHtml(q.authorName, q.authorId, q.authorPhoto)}
          <span class="mn-imagetok-name">${escapeHtml(q.authorName || "")}</span>
        </div>
        ${caption ? `<p class="mn-imagetok-text">${escapeHtml(caption)}</p>` : ""}
      </div>
    </div>`;
}

// ---------------- profile stats (Facebook-Insights-style) ----------------
// One aggregate row of totals (views / upvotes / comments / shares), a
// per-post breakdown of the same four numbers, and a short list of
// account-growth tips computed from the person's own data — mirrors how
// Facebook's Professional Dashboard summarizes reach, then breaks it down
// per post, then nudges the person toward specific actions.
function renderProfileStats(myQuestions, p) {
  const posts = myQuestions || [];
  const totals = posts.reduce((acc, q) => {
    acc.views += q.views || 0;
    acc.upvotes += q.points || 0;
    acc.comments += q.answersCount || 0;
    acc.shares += q.sharesCount || 0;
    return acc;
  }, { views: 0, upvotes: 0, comments: 0, shares: 0 });
  const followerCount = p.followersCount || 0;

  const summaryCards = `
    <div class="mn-stats-grid">
      <div class="mn-stats-card"><span class="mn-stats-card-icon mn-stats-card-icon-blue">${iconEye()}</span><span class="mn-stats-card-num">${totals.views}</span><span class="mn-stats-card-label">Views</span></div>
      <div class="mn-stats-card"><span class="mn-stats-card-icon mn-stats-card-icon-green">${iconUpvoteSmall()}</span><span class="mn-stats-card-num">${totals.upvotes}</span><span class="mn-stats-card-label">Upvotes</span></div>
      <div class="mn-stats-card"><span class="mn-stats-card-icon mn-stats-card-icon-yellow">${iconCommentSmall()}</span><span class="mn-stats-card-num">${totals.comments}</span><span class="mn-stats-card-label">Comments</span></div>
      <div class="mn-stats-card"><span class="mn-stats-card-icon mn-stats-card-icon-red">${iconShare()}</span><span class="mn-stats-card-num">${totals.shares}</span><span class="mn-stats-card-label">Shares</span></div>
    </div>
    <div class="mn-stats-followers-row">
      <span>${iconUsersSmall()}</span>
      <span><strong>${followerCount}</strong> follower${followerCount === 1 ? "" : "s"} reached by your posts</span>
    </div>
  `;

  if (posts.length === 0) {
    return `
      <div class="mn-stats">
        ${summaryCards}
        <div class="mn-empty"><p class="mn-empty-title">No stats yet</p><p class="mn-empty-sub">Once you post, your views, upvotes, comments, and shares show up here.</p></div>
      </div>
    `;
  }

  const showAllPosts = !!state.profileStatsOpen;
  const visiblePosts = showAllPosts ? posts : posts.slice(0, 3);
  const postRows = visiblePosts.map((q) => `
    <div class="mn-stats-postrow" onclick="openDetail('${q.id}','profile')">
      <p class="mn-stats-postrow-title">${escapeHtml(q.title)}</p>
      <div class="mn-stats-postrow-nums">
        <span title="Views">${iconEye()}${q.views || 0}</span>
        <span title="Upvotes">${iconUpvoteSmall()}${q.points || 0}</span>
        <span title="Comments">${iconCommentSmall()}${q.answersCount || 0}</span>
        <span title="Shares">${iconShare()}${q.sharesCount || 0}</span>
      </div>
    </div>
  `).join("");

  const toggleRow = posts.length > 3 ? `
    <button class="mn-stats-seemore" onclick="toggleProfileStats()">${showAllPosts ? "Show less" : `See all ${posts.length} posts`}</button>
  ` : "";

  return `
    <div class="mn-stats">
      ${summaryCards}
      <div class="mn-stats-section-label">Post performance</div>
      <div class="mn-stats-postlist">${postRows}</div>
      ${toggleRow}
      ${recommendationsHtml(posts, p, totals)}
    </div>
  `;
}

// Smart, Facebook-Insights-style suggestions computed from the person's own
// numbers — not generic copy. Shows at most 3 so it stays a quick scan.
function recommendationsHtml(posts, p, totals) {
  const tips = [];
  const followerCount = p.followersCount || 0;
  const unanswered = posts.filter((q) => (q.answersCount || 0) === 0).length;
  const engagementRate = totals.views > 0 ? (totals.upvotes + totals.comments) / totals.views : null;
  const topPost = posts.reduce((best, q) => {
    const score = (q.points || 0) + (q.answersCount || 0) + (q.sharesCount || 0);
    return !best || score > best.score ? { q, score } : best;
  }, null);

  if (followerCount < 10) {
    tips.push({ icon: iconUsersSmall(), text: "Share your profile to reach more people and grow your followers.", action: `<button class="mn-tip-action" onclick="shareProfile()">Share profile</button>` });
  }
  if (unanswered > 0) {
    tips.push({ icon: iconBulb(), text: `${unanswered} of your post${unanswered === 1 ? "" : "s"} ${unanswered === 1 ? "has" : "have"} no answers yet — add more detail so people can help faster.` });
  }
  if (topPost && topPost.score > 0) {
    tips.push({ icon: iconTrendUp(), text: `"${topPost.q.title.length > 40 ? topPost.q.title.slice(0, 40) + "…" : topPost.q.title}" is your best-performing post — share it again to reach new people.`, action: `<button class="mn-tip-action" onclick="openShare('${topPost.q.id}','${escapeHtml(topPost.q.title).replace(/'/g, "\\'")}')">Share it</button>` });
  }
  if (engagementRate !== null && engagementRate < 0.15) {
    tips.push({ icon: iconBulb(), text: "Your engagement rate is low relative to views — try posting when more people are active, or ask more specific questions." });
  }
  if (posts.length < 3) {
    tips.push({ icon: iconTrendUp(), text: "Post a few more questions — active accounts get discovered and followed faster." });
  }

  const shown = tips.slice(0, 3);
  if (shown.length === 0) return "";

  return `
    <div class="mn-stats-section-label">Grow your account</div>
    <div class="mn-tips-list">
      ${shown.map((t) => `
        <div class="mn-tip-item">
          <span class="mn-tip-icon">${t.icon}</span>
          <span class="mn-tip-text">${t.text}</span>
          ${t.action || ""}
        </div>
      `).join("")}
    </div>
  `;
}

let dismissedSuggestions = [];

function dismissSuggestedUser(uid, ev) {

// The module itself: title + horizontal-scroll strip. Returns "" when there's
// no one left worth suggesting, so callers can skip splicing it into the feed.
function suggestModuleHtml() {
  const users = suggestedUsers(10).filter((u) => !dismissedSuggestions.includes(u.id));
  if (users.length === 0) return "";
  return `

// Splices the suggestion module into the post list Facebook-style: a few
// posts in (so it doesn't shove content below the fold), not at the very top.
// Left as a single insertion — repeating it every N posts (Facebook's usual
// behavior on a long scroll) is an easy follow-up once the pool of suggested
// people is large enough to avoid repeats.
function feedListHtml(list) {
  const cards = list.map((q) => questionCardHtml(q));
  const originalLength = cards.length;
  const module = suggestModuleHtml();
  const reels = ""; // Reels disabled — skip computation entirely
  const inserts = [];
  if (module) inserts.push({ at: Math.min(4, originalLength), html: module });
  if (reels) inserts.push({ at: Math.min(Math.floor(originalLength / 2), originalLength), html: reels });

  // Insert highest index first so an earlier splice doesn't shift a later target position.
  inserts.sort((a, b) => b.at - a.at).forEach((ins) => cards.splice(ins.at, 0, ins.html));
  return `<div class="mn-feed">${cards.join("")}</div>`;
}

// ---------------- Discover: best videos / images / word posts ----------------
// Ranks posts by real engagement (views + upvotes + answers) rather than
// recency. Each rail reuses getPostMedia() — the exact same resolver the
// normal feed card and Reels already use — so a post lands in "Best Videos"
// or "Best Images" only if the feed would actually render that media for it.
// Capped at 8 per rail so each row stays a quick, scannable scroll.
function rankedPosts(filterFn, count) {
  const pool = state.questions.filter(filterFn);
  const scored = pool.map((q) => ({
    q,
    score: (q.views || 0) + (q.points || 0) * 3 + (q.answersCount || 0) * 2,
  }));
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, count || 8).map((s) => s.q);
}
function bestVideoPosts(count) {
  return rankedPosts((q) => getPostMedia(q).some((m) => m.type === "video"), count);
}
function bestImagePosts(count) {
  return rankedPosts((q) => getPostMedia(q).some((m) => m.type === "image"), count);
}
// "Word posts" = posts with no image/video attached — pure text questions/answers.
function bestWordPosts(count) {
  return rankedPosts((q) => getPostMedia(q).length === 0, count);
}

async function loadChallengesList(force) {
  if (state.challengesLoaded && !force) return;
  try {
    const snap = await getDocs(query(collection(db, "challenges"), orderBy("createdAt", "desc"), limit(60)));
    state.challenges = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) { console.error(e); }
  state.challengesLoaded = true;
  render();
}
let challengesLeaderboardPeriod = "weekly";
let challengesLeaderboardLoading = false;
async function loadChallengesLeaderboard(period) {
  if (period) challengesLeaderboardPeriod = period;
  challengesLeaderboardLoading = true;
  render();
  const now = new Date();
  const cutoff = new Date(now);
  if (challengesLeaderboardPeriod === "daily") cutoff.setHours(now.getHours() - 24);
  else if (challengesLeaderboardPeriod === "weekly") cutoff.setDate(now.getDate() - 7);
  else cutoff.setMonth(now.getMonth() - 1);
  try {
    const snap = await getDocs(query(collection(db, "challengeAttempts"), where("createdAt", ">=", cutoff), orderBy("createdAt", "desc"), limit(500)));
    const byUser = {};
    snap.docs.forEach((d) => {
      const a = d.data();
      if (!byUser[a.uid]) byUser[a.uid] = { id: a.uid, name: a.userName, photoURL: a.photoURL, score: 0 };
      byUser[a.uid].score += a.score || 0;
    });
    state.challengesLeaderboard = Object.values(byUser).sort((a, b) => b.score - a.score).slice(0, 20);
    state.challengesLeaderboard.forEach((u) => { state.photoCache[u.id] = u.photoURL || ""; });
  } catch (e) { console.error(e); }
  challengesLeaderboardLoading = false;
  render();
}
function renderChallenges() {
  if (state.challengeCreateOpen) return renderChallengeForm();
  const tab = state.challengesTab;
  if (tab === "leaderboard") return renderChallengesLeaderboard();
  if (tab === "stats") return renderChallengeStats();
  const list = filteredChallenges();

function svgLineChart(items) {

const CHALLENGE_TIER_NAMES = ["Bronze", "Silver", "Gold", "Platinum", "Emerald", "Sapphire", "Amethyst", "Diamond"];
const CHALLENGE_TIER_COLORS = [
  "linear-gradient(135deg,#cd7f32,#8a5a2b)", "linear-gradient(135deg,#d7d7d7,#9a9a9a)",
  "linear-gradient(135deg,#ffd766,#e8a93b)", "linear-gradient(135deg,#cfd8dc,#78909c)",
  "linear-gradient(135deg,#34d399,#059669)", "linear-gradient(135deg,#60a5fa,#2563eb)",
  "linear-gradient(135deg,#c084fc,#7c3aed)", "linear-gradient(135deg,#67e8f9,#0891b2)",

function challengeMilestoneAt(i) {
  const base = [1, 3, 5, 10, 25, 50, 100, 250, 500, 1000];
  if (i < base.length) return base[i];
  let last = base[base.length - 1];
  for (let k = base.length; k <= i; k++) last *= 2;

}
function challengeTierLabel(i) {
  const name = CHALLENGE_TIER_NAMES[i % CHALLENGE_TIER_NAMES.length];

  return cycle > 0 ? `${name} ${cycle + 1}` : name;
}
function challengeBadgeRowHtml(icon, label, value) {
  let unlocked = 0;
  while (challengeMilestoneAt(unlocked) <= value && unlocked < 200) unlocked++;
  const showCount = Math.min(unlocked + 1, unlocked + 1); // unlocked badges + 1 upcoming
  const items = [];
  for (let i = 0; i < unlocked; i++) items.push({ i, locked: false });

function collectAchievedBadges(made, attempted, score) {
  const cats = [
    { icon: "🏆", label: "Creator", value: made },
    { icon: "🎯", label: "Player", value: attempted },
    { icon: "⭐", label: "Score", value: score },
  ];
  const earned = [];
  cats.forEach((cat) => {
    let i = 0;
    while (challengeMilestoneAt(i) <= cat.value && i < 200) {
      earned.push({ icon: cat.icon, cat: cat.label, tier: challengeTierLabel(i), color: CHALLENGE_TIER_COLORS[i % CHALLENGE_TIER_COLORS.length], rank: i });
      i++;
    }
  });
  return earned.sort((a, b) => b.rank - a.rank);
}
function achievedBadgesHtml(made, attempted, score) {

}

async function loadChallengeStats(period) {

  try {
    const now = new Date();
    const cutoff = new Date(now);
    if (challengeStatsPeriod === "today") cutoff.setHours(now.getHours() - 24);
    else if (challengeStatsPeriod === "7d") cutoff.setDate(now.getDate() - 7);
    else cutoff.setDate(now.getDate() - 28);
    const madeSnap = await getCountFromServer(query(collection(db, "challenges"), where("ownerId", "==", uid)));
    const mineSnap = await getDocs(query(collection(db, "challengeAttempts"), where("uid", "==", uid), where("createdAt", ">=", cutoff)));
    const totalSnap = await getCountFromServer(query(collection(db, "challengeAttempts"), where("createdAt", ">=", cutoff)));

function openChallengePlay(id) {

  const challenge = (state.challenges || []).find((c) => c.id === id);
  if (!challenge || !challenge.questions || !challenge.questions.length) { showToast("This challenge has no questions yet", "error"); return; }
  if ((challenge.attemptedBy || []).includes(state.user.uid) && challenge.ownerId !== state.user.uid) {
    showToast("You've already played this challenge", "error");
    return;
  }
  stopChallengeTimers();
  state.challengePlay = {
    challenge, index: 0, picked: null, score: 0, finished: false,
    answers: new Array(challenge.questions.length).fill(null),
    secondsLeft: challenge.questions[0].timeLimit ? Math.round(challenge.questions[0].timeLimit * 60) : null,
    totalSecondsLeft: challenge.totalTimeLimit ? Math.round(challenge.totalTimeLimit * 60) : null,
  };

function stopChallengeTimers() {

function startQuestionTimer() {

  state.challengeQTimer = setInterval(() => {
    const pp = state.challengePlay;
    if (!pp || pp.finished) { clearInterval(state.challengeQTimer); return; }
    pp.secondsLeft -= 1;
    if (pp.secondsLeft <= 0) { clearInterval(state.challengeQTimer); state.challengeQTimer = null; selectChallengeAnswer(-1); return; }
    render();
  }, 1000);
}
function startTotalTimer() {

  state.challengeTotalTimer = setInterval(() => {
    const pp = state.challengePlay;
    if (!pp || pp.finished) { clearInterval(state.challengeTotalTimer); return; }

    render();
  }, 1000);

  const q = p.challenge.questions[p.index];
  p.picked = oi;

// Collapses consecutive notifications that point at the same target (same
// type + same post/answer/reply) into one row, Instagram/Threads-style:
// "X and 16 others upvoted your post." Only groups upvotes — follows,
// answers, replies and admin broadcasts stay one-per-row since each of
// those carries its own distinct content worth seeing individually.
function groupNotifications(list) {
  const groupable = new Set(["follow", "answer", "reply", "upvote_question", "upvote_answer", "upvote_reply"]);
  const out = [];
  const seenAt = new Map(); // key -> index in `out`
  for (const n of list) {
    if (!groupable.has(n.type)) { out.push(n); continue; }
    const targetKey = n.type + ":" + (n.questionId || "") + ":" + (n.answerId || "") + ":" + (n.replyId || "");
    if (seenAt.has(targetKey)) {
      const group = out[seenAt.get(targetKey)];
      group._count = (group._count || 1) + 1;
      group._names = (group._names || [group.fromUserName]).concat(n.fromUserName);
      group.read = group.read && n.read; // stays unread if any contributor is unread
      // keep the newest timestamp/avatar showing at the top of the group
      if (notifSortMillis(n.createdAt) > notifSortMillis(group.createdAt)) {
        group.createdAt = n.createdAt; group.fromUserId = n.fromUserId;
        group.fromUserName = n.fromUserName; group.fromUserPhoto = n.fromUserPhoto;
      }
    } else {
      seenAt.set(targetKey, out.length);
      out.push({ ...n });
    }
  }
  return out;
}

// No reactions, no stickers, no forward — commenting is the only interaction

function renderChannelDetail() {
  const c = state.activeChannel;
  if (!state.channelPostsLoaded && !c) {
    return `<p class="mn-empty-sub" style="text-align:center;padding:30px 0;">Loading channel...</p>`;
  }
  if (!c) {
    return `<div class="mn-empty"><p class="mn-empty-title">Channel not found</p><p class="mn-empty-sub">It may have been deleted, or the link is wrong.</p></div>`;
  }
  const isOwner = state.user && c.ownerId === state.user.uid;
  const subscribed = isSubscribedChannel(c);
  const allPosts = state.channelPosts || [];
  // Posts newer than the cutoff captured when this channel was opened this
  // visit (see openChannel). Owners always see their own full feed — the
  // Unread/All split only makes sense for someone catching up on updates.
  const cutoff = state.channelUnreadCutoff || 0;
  const unreadPosts = allPosts.filter((p) => notifSortMillis(p.createdAt) > cutoff);
  const showUnreadTabs = !isOwner && allPosts.length > 0;
  const filterMode = showUnreadTabs ? (state.channelFeedFilter === "all" ? "all" : "unread") : "all";
  const posts = filterMode === "unread" ? unreadPosts : allPosts;
  const filterBar = showUnreadTabs ? `
    <div class="mn-channel-filterbar" role="tablist">
      <button class="mn-channel-filter-chip ${filterMode === "unread" ? "mn-channel-filter-chip-active" : ""}" onclick="setChannelFeedFilter('unread')" role="tab" aria-selected="${filterMode === "unread"}">
        Unread${unreadPosts.length ? ` <span class="mn-channel-filter-count">${unreadPosts.length}</span>` : ""}
      </button>
      <button class="mn-channel-filter-chip ${filterMode === "all" ? "mn-channel-filter-chip-active" : ""}" onclick="setChannelFeedFilter('all')" role="tab" aria-selected="${filterMode === "all"}">All</button>
    </div>
  ` : "";
  // Everything a big centered hero used to show (name, avatar, subscriber
  // count) already lives in the slim top header — this strip only adds the
  // one thing the header can't fit: the description + who started it. The
  // feed itself starts right underneath, WhatsApp-Channel-style.
  const aboutStrip = (c.description || c.ownerName) ? `
    <div class="mn-channel-topstrip">
      ${c.description ? `<p class="mn-channel-topstrip-desc">${escapeHtml(c.description)}</p>` : ""}
      <p class="mn-channel-topstrip-owner">Started by ${escapeHtml(c.ownerName || "someone")}${c.category ? " · " + escapeHtml(c.category) : ""}</p>
    </div>
  ` : "";
  // Non-subscribers see a join prompt; subscribers go straight into the feed
  // (nothing left to act on); the owner gets the "Write an update" bar.
  const joinRow = !subscribed && !isOwner ? `
    <div class="mn-channel-join-row">
      <div class="mn-channel-join-row-text">
        <span class="mn-channel-join-row-title">Join this channel</span>
        <span class="mn-channel-join-row-sub">${c.subscriberCount || 0} subscriber${(c.subscriberCount || 0) === 1 ? "" : "s"} · get new updates here</span>
      </div>
      <button class="mn-postbtn mn-channel-hero-subbtn" onclick="toggleSubscribeChannel('${c.id}', event)">Subscribe</button>
    </div>
  ` : "";
  const emptyHtml = allPosts.length === 0
    ? `<div class="mn-empty"><p class="mn-empty-title">No posts yet</p><p class="mn-empty-sub">${isOwner ? "Share something with your subscribers." : "Check back soon."}</p></div>`
    : `<div class="mn-empty">
        <p class="mn-empty-title">You're all caught up</p>
        <p class="mn-empty-sub">No new updates since your last visit.</p>
        <button class="mn-channel-catchup-btn" onclick="setChannelFeedFilter('all')">View all posts</button>
      </div>`;
  const liveNew = (state.channelLiveNewIds || []).length;
const livePill = liveNew > 0 ? `<button class="mn-channel-livepill" onclick="dismissChannelLivePill()">${liveNew} new update${liveNew === 1 ? "" : "s"} just posted</button>` : "";
return `
    <div class="mn-channel-detail">
      ${aboutStrip}
      ${livePill}
      ${filterBar}
      <div class="mn-channel-feed">
        ${posts.length === 0 ? emptyHtml : posts.map((p, i) => {
          const isFirstNew = filterMode === "all" && i > 0 && notifSortMillis(p.createdAt) > cutoff && notifSortMillis(posts[i - 1].createdAt) <= cutoff;
          return (isFirstNew ? `<div class="mn-channel-newdivider">New updates</div>` : "") + channelPostCardHtml(p, c);
        }).join("")}
        ${posts.length > 0 ? donationBannerHtml(c) : ""}
      </div>
      ${joinRow}
    </div>
  `;
}

let swipeState = null;
function initChatSwipeToReply() {
  const root = document.getElementById("root");
  root.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(".mn-chat-bubble-row");
    if (!row || state.screen !== "chat") return;
    swipeState = { row, startX: e.clientX, startY: e.clientY, dx: 0, id: e.pointerId };
    row.setPointerCapture(e.pointerId);
  });
  root.addEventListener("pointermove", (e) => {
    if (!swipeState || swipeState.id !== e.pointerId) return;
    const dx = e.clientX - swipeState.startX;
    const dy = e.clientY - swipeState.startY;
    if (Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)) return;
    if (dx <= 0) return;
    swipeState.dx = Math.min(dx, 70);
    const bubble = swipeState.row.querySelector(".mn-chat-bubble");
    bubble.style.transform = `translateX(${swipeState.dx}px)`;
    swipeState.row.setAttribute("data-swipe-active", swipeState.dx > 44 ? "1" : "0");
  });
  const endSwipe = (e) => {
    if (!swipeState || swipeState.id !== e.pointerId) return;
    const { row, dx } = swipeState;
    const bubble = row.querySelector(".mn-chat-bubble");
    bubble.style.transform = "";
    row.removeAttribute("data-swipe-active");
    if (dx > 44) setReplyTarget(row.getAttribute("data-mid"));
    swipeState = null;
  };
  root.addEventListener("pointerup", endSwipe);
  root.addEventListener("pointercancel", endSwipe);
}

function renderChat() {
  if (!state.user) return `<div class="mn-empty"><p class="mn-empty-title">Sign in to chat</p></div>`;
  const other = state.activeChatUser;
  if (!other) return `<p class="mn-empty-sub" style="text-align:center;padding:40px 0;">Loading...</p>`;
  const msgs = state.chatMessages || [];
  if (!state.chatMessagesLoaded) return `<p class="mn-empty-sub" style="text-align:center;padding:24px 0;">Loading...</p>`;
  if (!msgs.length) {
    return `<div class="mn-empty" style="padding:40px 20px;">

      <p class="mn-empty-sub">Say hello — start the conversation.</p>

  }
  return `<div class="mn-chat-messages">${groupGiftMessages(msgs).map((m) => {
    const mid = m.gifts ? m.gifts[0].id : m.id;
    const divider = mid === state.unreadDividerId ? unreadDividerHtml() : "";
    return divider + (m.gifts ? giftGroupHtml(m.gifts) : chatBubbleHtml(m));
  }).join("")}</div>`;

function unreadDividerHtml() {
  return `<div class="mn-unread-divider"><span>Unread messages</span></div>`;
}
function groupGiftMessages(msgs) {
  const out = []; let i = 0;
  while (i < msgs.length) {
    const m = msgs[i];
    if (m.type === "gift") {
      const run = [m]; let j = i + 1;
      while (j < msgs.length && msgs[j].type === "gift" && msgs[j].senderId === m.senderId) { run.push(msgs[j]); j++; }
      out.push(run.length > 1 ? { gifts: run } : m);
      i = j;
    } else { out.push(m); i++; }
  }
  return out;
}
function giftGroupHtml(gifts) {

  const senderName = mine ? "You" : escapeHtml(gifts[0].senderName || other?.username || "Someone");
  const last = gifts[gifts.length - 1];
  const total = gifts.reduce((sum, g) => sum + (g.giftAmount || 0), 0);
  const shown = gifts.slice(0, 5);
  const extra = gifts.length - shown.length;
  const icons = shown.map(() => `<span class="mn-gift-group-icon">🎁</span>`).join("")

// Renders an embedded catbox.moe attachment inside a chat bubble, based on

function chatMediaHtml(url, type) {

async function submitCoinVerify() {
  const pkg = COIN_PACKAGES.find((p) => p.id === state.buyCoinsForm.packageId);
  const msg = state.buyCoinsForm.proofMessage.trim();
  if (!state.user || !pkg || !msg || state.buyCoinsBusy) return;
  state.buyCoinsBusy = true; render();
  try {
    await addDoc(collection(db, "coinRequests"), {
      userId: state.user.uid,
      userName: (state.profile && state.profile.username) || "",
      coins: pkg.coins,
      amountFrw: pkg.frw,
      packageLabel: pkg.label,
      proofMessage: msg,
      status: "pending",
      coinsAwarded: null,
      createdAt: serverTimestamp(),
      reviewedAt: null,
    });
    state.buyCoinsBusy = false;
    setState({ buyCoinsStep: "done" });
  } catch (e) {
    state.buyCoinsBusy = false;
    render();
    showToast("Couldn't submit — check your connection and try again.");
  }
}

function loadMyCoinRequests() {
  if (!state.user) return;
  if (coinRequestsUnsub) coinRequestsUnsub();
  const qy = query(collection(db, "coinRequests"), where("userId", "==", state.user.uid), orderBy("createdAt", "desc"), limit(20));
  coinRequestsUnsub = onSnapshot(qy, (snap) => {
    state.myCoinRequests = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.myCoinRequestsLoaded = true;
    render();
  });
}

  if (coinRequestsUnsub) { coinRequestsUnsub(); coinRequestsUnsub = null; }

}

      ${errs.dob ? `<span class="mn-field-error">${escapeHtml(errs.dob)}</span>` : `<span class="mn-field-hint">Must be 13 or older</span>`}
    </div>
    <div class="mn-field" style="margin-bottom:0;">
      <label>Region</label>
      <div class="mn-input-wrap">
        <span class="mn-input-icon">${iconPinSmall()}</span>
        <button type="button" class="mn-select-trigger ${errs.region ? "mn-input-error" : ""}" onclick="openRegionPicker()">
          <span class="${f.region ? "" : "mn-select-trigger-placeholder"}">${f.region ? escapeHtml(f.region) : "Select your region"}</span>
          <span class="mn-select-chevron">${iconChevronDownSmall()}</span>
        </button>
      </div>
      ${errs.region ? `<span class="mn-field-error">${escapeHtml(errs.region)}</span>` : ""}
    </div>
  `;

  // ---- section 2: "Login details" — email, password, confirm ----
  const step2Fields = `
    <div class="mn-field">
      <label>Email</label>
      <div class="mn-input-wrap">
        <span class="mn-input-icon">${iconMailSmall()}</span>
        <input class="mn-input mn-input-has-icon ${errs.email ? "mn-input-error" : ""}" type="email" placeholder="you@example.com" value="${escapeHtml(f.email)}" oninput="setAuthField('email', this.value)" />
      </div>
      ${errs.email ? `<span class="mn-field-error">${escapeHtml(errs.email)}</span>` : ""}
    </div>
    <div class="mn-field">
      <label>Password</label>
      <div class="mn-input-wrap mn-pw-wrap">
        <span class="mn-input-icon">${iconLockSmall()}</span>
        <input class="mn-input mn-input-has-icon mn-input-has-pwtoggle ${errs.password ? "mn-input-error" : ""}" type="${pwType}" placeholder="Create a password" value="${escapeHtml(f.password)}" oninput="setAuthField('password', this.value)" />
        <button type="button" class="mn-pw-toggle" onclick="toggleAuthPwVisibility('password')" title="${state.showPassword ? "Hide password" : "Show password"}">${state.showPassword ? iconEyeOff() : iconEye()}</button>
      </div>
      ${errs.password ? `<span class="mn-field-error">${escapeHtml(errs.password)}</span>` : `<span class="mn-field-hint">At least 6 characters</span>`}
    </div>
    <div class="mn-field" style="margin-bottom:0;">
      <label>Confirm password</label>
      <div class="mn-input-wrap mn-pw-wrap">
        <span class="mn-input-icon">${iconLockSmall()}</span>
        <input class="mn-input mn-input-has-icon mn-input-has-pwtoggle ${errs.confirmPassword ? "mn-input-error" : ""}" type="${cpwType}" placeholder="Re-enter your password" value="${escapeHtml(f.confirmPassword)}" oninput="setAuthField('confirmPassword', this.value)" />
        <button type="button" class="mn-pw-toggle" onclick="toggleAuthPwVisibility('confirmPassword')" title="${state.showConfirmPassword ? "Hide password" : "Show password"}">${state.showConfirmPassword ? iconEyeOff() : iconEye()}</button>
      </div>
      ${errs.confirmPassword ? `<span class="mn-field-error">${escapeHtml(errs.confirmPassword)}</span>` : ""}
    </div>
  `;

  const signInFields = `
    <div class="mn-field">
      <label>Email</label>
      <div class="mn-input-wrap">
        <span class="mn-input-icon">${iconMailSmall()}</span>
        <input class="mn-input mn-input-has-icon ${errs.email ? "mn-input-error" : ""}" type="email" placeholder="you@example.com" value="${escapeHtml(f.email)}" oninput="setAuthField('email', this.value)" />
      </div>
      ${errs.email ? `<span class="mn-field-error">${escapeHtml(errs.email)}</span>` : ""}
    </div>
    <div class="mn-field" style="margin-bottom:0;">
      <label>Password</label>
      <div class="mn-input-wrap mn-pw-wrap">
        <span class="mn-input-icon">${iconLockSmall()}</span>
        <input class="mn-input mn-input-has-icon mn-input-has-pwtoggle ${errs.password ? "mn-input-error" : ""}" type="${pwType}" placeholder="Your password" value="${escapeHtml(f.password)}" oninput="setAuthField('password', this.value)" />
        <button type="button" class="mn-pw-toggle" onclick="toggleAuthPwVisibility('password')" title="${state.showPassword ? "Hide password" : "Show password"}">${state.showPassword ? iconEyeOff() : iconEye()}</button>
      </div>
      ${errs.password ? `<span class="mn-field-error">${escapeHtml(errs.password)}</span>` : ""}
    </div>
  `;

  const stepsHtml = isSignUp ? `
    <div class="mn-auth-steps">
      <div class="mn-auth-step ${step === 1 ? "mn-auth-step-active" : "mn-auth-step-done"}">
        <div class="mn-auth-step-row"><span class="mn-auth-step-dot">${step > 1 ? iconOk() : "1"}</span></div>
        <span class="mn-auth-step-label">About you</span>
      </div>
      <span class="mn-auth-step-line ${step > 1 ? "mn-auth-step-line-done" : ""}"></span>
      <div class="mn-auth-step ${step === 2 ? "mn-auth-step-active" : ""}">
        <div class="mn-auth-step-row"><span class="mn-auth-step-dot">2</span></div>
        <span class="mn-auth-step-label">Login details</span>
      </div>
    </div>
  ` : "";

  const bodyHtml = !isSignUp ? signInFields : (step === 1 ? step1Fields : step2Fields);

  const actionsHtml = !isSignUp ? `
    <button class="mn-primary-btn mn-auth-submit" ${state.authBusy ? "disabled" : ""} onclick="submitSignIn()">
      ${state.authBusy ? `<span class="mn-spinner"></span><span>Please wait...</span>` : "Sign in"}
    </button>
  ` : step === 1 ? `
    <button class="mn-primary-btn mn-auth-submit" onclick="goToAuthStep2()">Continue</button>
  ` : `
    <div class="mn-auth-actions">
      <button type="button" class="mn-auth-btn-back" ${state.authBusy ? "disabled" : ""} onclick="goToAuthStep1()">Back</button>
      <button class="mn-primary-btn mn-auth-submit" ${state.authBusy ? "disabled" : ""} onclick="submitSignUp()">
        ${state.authBusy ? `<span class="mn-spinner"></span><span>Please wait...</span>` : "Create account"}
      </button>
    </div>
  `;

  return `
    <div class="mn-auth-overlay${animClass}" onclick="if(event.target===this) closeAuthModal()">
      <div class="mn-auth-sheet${animClass}">
        <div class="mn-auth-handle"></div>
        <div class="mn-auth-top"><div class="mn-brand-text"><span class="mn-wordmark">MENYA</span><span class="mn-tagline">Ask. Share. Learn.</span></div></div>

        <div class="mn-tabs">
          <button class="mn-tab ${!isSignUp ? "mn-tab-active" : ""}" onclick="setAuthTab('signin')">Sign in</button>
          <button class="mn-tab ${isSignUp ? "mn-tab-active" : ""}" onclick="setAuthTab('signup')">Sign up</button>
        </div>

        <p class="mn-auth-title">${isSignUp ? (step === 1 ? "Tell us about you" : "Set up your login") : "Welcome back"}</p>
        <p class="mn-auth-sub">${isSignUp ? (step === 1 ? "Step 1 of 2 — this is how the community will know you." : "Step 2 of 2 — how you'll sign back in.") : "Sign in to keep asking and answering."}</p>

        ${stepsHtml}

        <div class="mn-auth-body">${bodyHtml}</div>

        ${state.authError ? `<div class="mn-auth-error">${iconWarn()}<span>${escapeHtml(state.authError)}</span></div>` : ""}

        ${actionsHtml}
        ${isSignUp && step === 2 ? `<p class="mn-auth-terms">By creating an account, you agree to be respectful and follow Menya's community guidelines.</p>` : ""}
        <button class="mn-auth-close" onclick="closeAuthModal()">Cancel</button>
      </div>
    </div>
  `;
}

const TITLES = { home: "Home", create: "New post", profile: "Profile", discover: "Discover" };

function headerHtml() {
  if (state.screen === "detail") {
    const q = findQuestionById(state.detailId);
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeDetail()" title="Back">${iconBack()}</button>
        <span class="mn-detail-header-title">${q ? escapeHtml(q.title) : "Question"}</span>
      </div>
      <div class="mn-header-right">
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      </div>
    `;
  }
  if (state.screen === "userProfile") {
    const p = state.viewedUser;
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeUserProfile()" title="Back">${iconBack()}</button>
        <span class="mn-detail-header-title">${p ? escapeHtml(p.username || "Profile") : "Profile"}</span>
      </div>
      <div class="mn-header-right">
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      </div>
    `;
  }
  if (state.screen === "notifications") {
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeNotifications()" title="Back">${iconBack()}</button>
        <span class="mn-detail-header-title">Notifications</span>
      </div>
      <div class="mn-header-right">
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      </div>
    `;
  }
  if (state.screen === "channels") {
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeChannelsScreen()" title="Back">${iconBack()}</button>
        <span class="mn-detail-header-title">Channels</span>
      </div>
      <div class="mn-header-right">
      
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      </div>
    `;
  }
  if (state.screen === "channelDetail") {
    const c = state.activeChannel;
    const nameEsc = c ? escapeHtml(c.name || "").replace(/'/g, "\\'") : "";
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeChannel()" title="Back">${iconBack()}</button>
        ${c ? (c.ownerId === (state.user && state.user.uid)
  ? `<button class="mn-header-avatar-btn" onclick="openChannelAvatarEdit()" title="Edit channel photo">${avatarHtml(c.name, "chan_" + c.id, c.avatarUrl)}</button>`
  : avatarHtml(c.name, "chan_" + c.id, c.avatarUrl)) : ""}
        <div class="mn-detail-header-titlewrap">
          <span class="mn-detail-header-title">${c ? escapeHtml(c.name || "Channel") : "Channel"}</span>
          ${c ? `<span class="mn-detail-header-sub">${formatFollowerCount(c.subscriberCount || 0)} subscriber${(c.subscriberCount || 0) === 1 ? "" : "s"}</span>` : ""}
        </div>
      </div>
      <div class="mn-header-right">
        ${c ? `<button class="mn-iconbtn" onclick="shareChannel('${c.id}', '${nameEsc}', event)" title="Share">${iconShare()}</button>` : ""}
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      </div>
    `;
  }
  if (state.screen === "channelPostDetail") {
    const c = state.activeChannel;
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeChannelPostDetail()" title="Back">${iconBack()}</button>
        ${c ? avatarHtml(c.name, "chan_" + c.id, c.avatarUrl) : ""}
        <div class="mn-detail-header-titlewrap">
          <span class="mn-detail-header-title">${c ? escapeHtml(c.name || "Channel") : "Post"}</span>
          ${c ? `<span class="mn-detail-header-sub">${formatFollowerCount(c.subscriberCount || 0)} subscriber${(c.subscriberCount || 0) === 1 ? "" : "s"}</span>` : ""}
        </div>
      </div>
      <div class="mn-header-right">
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      </div>
    `;
  }
  if (state.screen === "messages") {
    return `
      <div class="mn-detail-header">
        <button class="mn-iconbtn" onclick="closeMessages()" title="Back">${iconBack()}</button>
        <span class="mn-detail-header-title mn-msg-header-title">Messages</span>
      </div>
      <div class="mn-header-right">
        <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
        <button class="mn-iconbtn" onclick="openNewChat()" title="New message">${iconPencil()}</button>
      </div>
    `;
  }
  if (state.screen === "chat") {
    const other = state.activeChatUser;
    const nameEsc = other ? escapeHtml(other.username || "").replace(/'/g, "\\'") : "";
    return `
      <div class="mn-detail-header mn-chat-header" ${other ? `onclick="openUserProfile('${other.id}', '${nameEsc}', event)"` : ""}>
        <button class="mn-iconbtn" onclick="closeChat(); event.stopPropagation();" title="Back">${iconBack()}</button>
        ${other ? avatarHtml(other.username, other.id, other.photoURL) : ""}
        <span class="mn-detail-header-title">${other ? escapeHtml(other.username || "User") : "Chat"}</span>
      </div>
    `;
  }
  return `
    <div class="mn-brand">
      <div class="mn-brand-text"><span class="mn-wordmark">MENYA</span><span class="mn-tagline">Ask. Share. Learn.</span></div>
    </div>
    <div class="mn-header-right">
      ${state.user ? `
        <button class="mn-iconbtn mn-messages-btn" onclick="openMessages()" title="Messages">
          ${iconChat()}
          ${state.chatsUnread > 0 ? `<span class="mn-notif-count">${state.chatsUnread > 9 ? "9+" : state.chatsUnread}</span>` : ""}
        </button>
        <button class="mn-iconbtn mn-notif-btn" onclick="openNotifications()" title="Notifications">
          ${iconBell()}
          ${state.notifUnread > 0 ? `<span class="mn-notif-count">${state.notifUnread > 9 ? "9+" : state.notifUnread}</span>` : ""}
        </button>
      ` : ""}
      <button class="mn-iconbtn ${state.screen === "channels" || state.screen === "channelDetail" || state.screen === "channelPostDetail" ? "mn-iconbtn-active" : ""}" onclick="openChannelsScreen()" title="Channels">${iconMegaphone()}</button>
      <button class="mn-iconbtn mn-header-discover-btn ${state.screen === "discover" ? "mn-iconbtn-active" : ""}" onclick="selectScreen('discover')" title="Discover creators">${iconCompass(state.screen === "discover")}</button>
      <button class="mn-iconbtn" onclick="toggleTheme()" title="Toggle theme">${state.theme === "dark" ? iconSun() : iconMoon()}</button>
      ${state.screen === "profile" && state.user ? `<button class="mn-iconbtn mn-iconbtn-signout" onclick="confirmSignOut()" title="Sign out">${iconLogout()}</button>` : ""}
      ${state.user ? "" : `<button class="mn-signin-link" onclick="openAuthModal('signin')">Sign in</button>`}
    </div>
  `;
}

// Jumps to Home with a given feed mode ("foryou" | "following") — used by the
// sidebar's quick-access shortcuts instead of the old subject/category list.

  if (!el) return;
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
}
