<script>
  window.addEventListener("load", () => {
    setTimeout(() => {
      const loaded = [...document.fonts].some(f => f.family.includes("Inter") && f.status === "loaded");
      if (!loaded && !sessionStorage.getItem("mn-font-retry")) {
        sessionStorage.setItem("mn-font-retry", "1");
        const l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&v=2";
        document.head.appendChild(l);
      }
    }, 2000);
  });
</script>
<style>
* { box-sizing: border-box; }
/* ---- copy/selection deterrent ---- */
html, body, .mn-app { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; } /* keep typing usable */
img, video { -webkit-user-drag: none; user-drag: none; pointer-events: auto; }
html, body { margin: 0; padding: 0; background: #EEF0F2; overflow-x: hidden; }
body[data-theme="dark"] { background: #000000; }

.mn-shell {
  /* ---- light theme (default) ---- */
  --bg-outer: #EEF0F2;
  --paper: #F6F7F8;
  --paper-raised: #FFFFFF;
  --paper-line: rgba(20,23,28,0.045);
  --border: #E6E8EB;
  --border-strong: #D3D7DC;
  --red: #D8342A;      --red-soft: #FBEAE9;
  --green: #16794F;    --green-soft: #E4F3EC;
  --blue: #1668A3;     --blue-soft: #E6F1FA;
  --yellow: #C1790C;   --yellow-soft: #FCEFD9;  --yellow-ink: #8A5A0A;
  --ink: #191B1F;
  --ink-soft: #61666D;
  /* Was #9199A3 — under ~2.7:1 contrast against the paper/paper-raised
     backgrounds (fails WCAG AA for normal text), which is why timestamps,
     placeholder text like "Write an update", and subscriber counts were
     hard to read in light mode. #6B7280 keeps the same "quiet/secondary"
     role but lands around 4.5:1. */
  --ink-faint: #6B7280;
  --shadow-sm: 0 1px 2px rgba(20,23,28,0.06);
  --shadow-md: 0 10px 28px rgba(20,23,28,0.12), 0 2px 6px rgba(20,23,28,0.05);
  --overlay: rgba(17,19,23,0.55);
  background: var(--bg-outer);
  /* Locks native controls (select dropdowns, date pickers, scrollbars) to this
     theme instead of the OS setting. Without this, the <meta color-scheme>
     tag lets the browser paint those controls dark whenever the device is in
     dark mode — even while the app itself is set to light — which is why
     dropdown/date-picker text was going invisible (white-on-white) in light mode. */
  color-scheme: light;
}

.mn-shell[data-theme="dark"] {
  color-scheme: dark;
  /* true-black canvas + a slightly-raised surface for header/composer/sheets,
     mirrors the Threads dark palette instead of a flat dark-gray wash */
  --bg-outer: #000000;
  --paper: #000000;
  --paper-raised: #181818;
  --paper-line: rgba(255,255,255,0.05);
  --border: #262626;
  --border-strong: #3A3A3A;
  --red: #F2555B;      --red-soft: rgba(242,85,91,0.16);
 --green: #34C77E;    --green-soft: rgba(52,199,126,0.07);
  --blue: #6DB4E8;     --blue-soft: rgba(109,180,232,0.16);
  --yellow: #E8AC4D;   --yellow-soft: rgba(232,172,77,0.16); --yellow-ink: #E8AC4D;
  --ink: #F5F5F5;
  --ink-soft: #A8A8A8;
  --ink-faint: #6E6E6E;
  --shadow-sm: 0 1px 0 rgba(255,255,255,0.02);
  --shadow-md: 0 14px 32px rgba(0,0,0,0.6);
  --overlay: rgba(0,0,0,0.72);
}

.mn-shell :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 3px; }
.mn-shell button, .mn-shell input, .mn-shell textarea { font-family: inherit; }

.mn-app {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--paper);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color 0.2s ease, color 0.2s ease;
}

/* ---------------- header ---------------- */
.mn-header {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
width: 100%; max-width: 480px; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 13px 16px; min-height: 58px;
  background: color-mix(in srgb, var(--paper-raised) 94%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.mn-shell[data-screen="chat"] .mn-main {
  padding-top: 74px;
  padding-bottom: 84px;
}
.mn-shell[data-screen="chat"] .mn-main {
  padding-top: 74px;
  padding-bottom: 84px;
  min-height: 100vh;
}
.mn-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mn-brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.mn-wordmark { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.03em; }
.mn-tagline { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
.mn-header-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.mn-iconbtn {
  display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 999px; border: 1px solid transparent; background: var(--paper-line);
  color: var(--ink-soft); cursor: pointer; padding: 0; transition: background-color .15s, color .15s, border-color .15s;
}
.mn-iconbtn:hover { color: var(--ink); background: var(--border); }
.mn-iconbtn-signout { color: var(--red); }
.mn-iconbtn-signout:hover { color: var(--red); background: var(--red-soft); }
.mn-iconbtn-active { color: var(--green); background: var(--green-soft); }
.mn-iconbtn:active { transform: scale(0.94); }
.mn-header-avatar-btn { background: none; border: none; padding: 0; cursor: pointer; flex: 0 0 auto; }

/* ---------------- notifications: bell + unread badge ---------------- */
.mn-notif-btn { position: relative; }
.mn-notif-count {
  position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--red); color: #fff; font-family: 'Inter', sans-serif;
  font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
  box-shadow: 0 0 0 2px var(--paper-raised);
}
.mn-notif-count-sidebar { position: static; margin-left: auto; box-shadow: none; }

/* ---------------- notifications: plain list, no cards ---------------- */
.mn-notif-list { display: flex; flex-direction: column; }
.mn-notif-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 4px; border-bottom: 1px solid var(--paper-line);
  cursor: pointer; transition: background-color .15s ease;
}
.mn-notif-list .mn-notif-row:first-child { padding-top: 6px; }
.mn-notif-list .mn-notif-row:last-child { border-bottom: none; }
.mn-notif-row:hover { background: var(--paper-line); }
.mn-notif-row:active { background: var(--border); }
.mn-notif-row-unread { background: var(--paper-line); }
.mn-notif-row-unread:hover { background: var(--border); }

.mn-notif-avatar-wrap { position: relative; flex: 0 0 auto; }
.mn-notif-avatar-wrap .mn-avatar { width: 38px; height: 38px; }
.mn-admin-avatar {
  background: linear-gradient(155deg, var(--green) 0%, #0F4A3B 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
.mn-shell[data-theme="dark"] .mn-admin-avatar {
  background: linear-gradient(155deg, var(--green) 0%, #06231A 100%);
}
.mn-admin-avatar-mark {
  display: block;
  line-height: 1;
  font-size: 60%;
  transform: translateY(1px); /* optical centering — emoji sit slightly high by default */
}
.mn-notif-badge {
  position: absolute; bottom: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 0 0 2px var(--paper-raised);
}
.mn-notif-follow { background: var(--green); }
.mn-notif-upvote { background: var(--red); }
.mn-notif-chat { background: var(--blue); }
.mn-notif-admin { background: #fff; box-shadow: 0 0 0 1px var(--border); }

/* ---------------- notifications: category tabs ---------------- */
.mn-notif-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 12px 2px; margin-bottom: 4px;
  border-bottom: 1px solid var(--paper-line); scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.mn-notif-tabs::-webkit-scrollbar { display: none; }
.mn-notif-tab {
  flex: 0 0 auto; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px;
  color: var(--ink-soft); background: var(--paper-line); border: none; border-radius: 999px;
  padding: 7px 13px; cursor: pointer; transition: background-color .15s, color .15s, transform .1s;
  white-space: nowrap;
}
.mn-notif-tab:active { transform: scale(0.96); }
.mn-notif-tab-active { background: var(--green); color: #fff; }

.mn-notif-main { flex: 1 1 auto; min-width: 0; }
.mn-notif-text { margin: 0; font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.4; color: var(--ink); }
.mn-notif-text strong { font-weight: 700; }
.mn-notif-preview {
  margin: 3px 0 0 0; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.4;
  color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.mn-notif-side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 1px; }
.mn-notif-unread-dot { color: var(--green); width: 7px; height: 7px; }
.mn-empty-notif svg { color: var(--ink-faint); margin-bottom: 10px; }

.mn-signin-link {
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; color: #fff;
  background: var(--green); border: none; border-radius: 999px; padding: 8px 16px; cursor: pointer;
  white-space: nowrap; transition: opacity .15s, transform .1s;
}
.mn-shell[data-theme="dark"] .mn-channel-row .mn-follow-btn-active { color: var(--ink-soft); }
.mn-signin-link:active { opacity: 0.85; transform: scale(0.97); }

.mn-detail-header { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.mn-detail-header-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* two-line channel header, like a WhatsApp channel's title bar: bold name on
   top, follower count underneath in place of an "online/typing" status line */
.mn-detail-header-titlewrap { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; gap: 1px; }
.mn-detail-header-titlewrap .mn-detail-header-title { font-weight: 700; font-size: 15px; }
.mn-detail-header-sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mn-main { padding: 74px 16px 124px 16px; }

/* ---------------- search + chips ---------------- */
.mn-search { position: relative; margin-bottom: 14px; }
.mn-search input {
  width: 100%; font-size: 16px;
  padding: 13px 16px 13px 42px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--paper-raised); color: var(--ink); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s;
}
.mn-search input:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--paper-line); }
.mn-search input::placeholder { color: var(--ink-faint); }
.mn-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
.mn-search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; font-size: 12px; }

.mn-chiprow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-bottom: 16px; }
.mn-chiprow::-webkit-scrollbar { display: none; }
.mn-chiprow-wrap { flex-wrap: wrap; overflow: visible; }
.mn-chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
  font-size: 13px; font-weight: 600;
  padding: 3px 6px 3px 14px; border-radius: 999px; border: 1px solid transparent;
  background: var(--paper-line); color: var(--ink-soft); transition: background-color .15s, color .15s, border-color .15s;
}
.mn-chip-label { background: none; border: none; font: inherit; color: inherit; cursor: pointer; padding: 4px 0; }
.mn-chip-star { background: none; border: none; cursor: pointer; padding: 3px 6px; font-size: 13px; color: var(--ink-faint); line-height: 1; }
.mn-chip-star-active { color: var(--yellow); }
.mn-chip-active { background: var(--green); border-color: var(--green); color: #fff; }
.mn-chip:not(.mn-chip-active):hover { background: var(--border); color: var(--ink); }
.mn-chip-solo { padding: 8px 14px; cursor: pointer; }

/* ---------------- feed — Threads-style rows: generous padding, minimal
   chrome, only what a reader actually needs (who, when, what, follow) ---------------- */
.mn-feed { display: flex; flex-direction: column; }
/* Infinite-scroll sentinel at the bottom of the feed — see observeFeedSentinel() */
.mn-feed-sentinel { display: flex; align-items: center; justify-content: center; padding: 18px 0; min-height: 40px; }
.mn-feed-spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--ink-soft); animation: mn-spin .6s linear infinite; }

/* "New posts" pill — floats below the header once fresh posts arrive while the
   reader is scrolled down. Tapping it is the ONLY thing that ever inserts new
   posts into the feed the reader is currently looking at; see
   reconcileCommittedFeed()/mergeNewPosts() in the script below for why. */
.mn-feed-newpost-pill {
  position: fixed; left: 50%; top: 66px; z-index: 4;
  transform: translate(-50%, -14px) scale(0.94);
  display: flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: 999px;
  background: var(--green); color: #fff;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
  box-shadow: var(--shadow-md); border: none; cursor: pointer;
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.mn-feed-newpost-pill-visible { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
.mn-feed-newpost-pill svg { display: block; }
.mn-feed-newpost-pill:active { transform: translate(-50%, 0) scale(0.96); }

.mn-post {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 18px 12px; border-bottom: 1px solid var(--paper-line);
  cursor: pointer; transition: background-color .2s cubic-bezier(.2,.7,.3,1);
  border-radius: 12px; margin: 0 -12px;
}
.mn-feed .mn-post:first-child { padding-top: 14px; }
.mn-feed .mn-post:last-child { border-bottom: none; }
.mn-post:hover { background: var(--paper-line); }
.mn-post:active { background: var(--border); transition-duration: .05s; }

.mn-post-avatar-col { flex: 0 0 auto; padding-top: 1px; }
.mn-post-avatar-col .mn-avatar { width: 40px; height: 40px; }
.mn-post-main { flex: 1 1 auto; min-width: 0; }

.mn-post-headrow { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; margin-bottom: 3px; min-height: 22px; }
.mn-post-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
.mn-post-dot { color: var(--ink-faint); font-size: 13px; flex: 0 0 auto; line-height: 1; }
.mn-time { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-faint); flex: 0 0 auto; }
.mn-post-headspacer { flex: 1 1 auto; min-width: 4px; }
.mn-post-meta { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

.mn-tag { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.01em; white-space: nowrap; }

/* ---------------- hashtags: post pills + composer hint ---------------- */
.mn-hashtags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mn-hashtag {
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--blue);
  background: var(--blue-soft); border: none; border-radius: 999px; padding: 4px 11px;
  cursor: pointer; line-height: 1.3; transition: background-color .15s, transform .1s;
}
.mn-hashtag:hover { background: color-mix(in srgb, var(--blue-soft) 60%, var(--blue) 12%); }
.mn-hashtag:active { transform: scale(0.95); }
.mn-compose-hint { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-faint); margin: 6px 2px 0; }
.mn-badge { display: inline-flex; align-items: center; gap: 4px; font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700; padding: 3.5px 8px; border-radius: 999px; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }
.mn-badge-hot { background: var(--yellow-soft); color: var(--yellow-ink); }
.mn-badge-unanswered { background: var(--red-soft); color: var(--red); }
.mn-badge-new { background: var(--blue-soft); color: var(--blue); }
.mn-linechart-area { opacity: 0; fill: var(--green); animation: mnAreaFade .8s ease .3s forwards; }
.mn-linechart-path { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: mnLineDraw 1s ease forwards; }
.mn-linechart-dot { fill: var(--paper); stroke: var(--green); stroke-width: 3; opacity: 0; transform-origin: center; animation: mnDotPop .35s ease forwards; animation-delay: var(--d, 0s); }
.mn-linechart-val { font-size: 13px; font-weight: 800; fill: var(--ink); opacity: 0; animation: mnDotPop .35s ease forwards; animation-delay: var(--d, 0s); }
.mn-linechart-label { font-size: 11px; fill: var(--ink-faint); font-weight: 600; }
@keyframes mnLineDraw { to { stroke-dashoffset: 0; } }
@keyframes mnAreaFade { to { opacity: .14; } }
@keyframes mnDotPop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
.mn-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex: 0 0 auto; }

.mn-post-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.5; margin: 1px 0 4px 0; letter-spacing: -0.01em; color: var(--ink); }
.mn-post-desc {
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--ink-soft);
  margin: 0 0 10px 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  /* Preserve the line breaks/paragraphs the author actually typed (matches
     .mn-detail-body / .mn-comment-body below). Without this, every blank
     line and paragraph break in a post gets collapsed and the whole thing
     shows up in the feed as one run-on paragraph. */
  white-space: pre-wrap;
}
.mn-post-desc.mn-post-desc-expanded { -webkit-line-clamp: unset !important; overflow: visible; }
.mn-read-more {
  display: block; background: none; border: none; padding: 0; margin: -6px 0 10px 0;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--ink-faint); cursor: pointer;
}
.mn-read-more:hover { color: var(--ink-soft); }

.mn-post-actions { display: flex; align-items: center; gap: 4px; margin: 2px 0 0 -12px; }
.mn-stat {
  display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 8px 12px; border-radius: 999px;
  position: relative; transition: background-color .15s ease, color .15s ease, transform .12s cubic-bezier(.34,1.56,.64,1);
}
.mn-stat:hover { background: var(--paper-line); color: var(--ink); }
.mn-stat:active { transform: scale(0.88); }
.mn-stat-upvote { color: var(--ink-soft); }
/* Upvoted state is just the arrow + count switching color — no filled pill,
   border, or shadow. Tapping shouldn't put a "card"/cover over the button,
   only recolor it (the svg arrow uses currentColor, so this alone recolors it). */
.mn-stat-upvoted {
  color: var(--yellow-ink);
  font-weight: 700;
}
.mn-stat-hot { color: var(--yellow-ink); font-weight: 800; }
.mn-stat-needs { color: var(--red); font-weight: 700; }

.mn-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(155deg, var(--border), var(--paper-line)); color: var(--ink-faint);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  flex: 0 0 auto; box-shadow: inset 0 0 0 1px var(--paper-line);
}
.mn-avatar svg { display: block; }
.mn-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }

.mn-photo-edit-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.mn-photo-edit-preview.mn-avatar { width: 56px; height: 56px; font-size: 20px; flex: 0 0 auto; }
.mn-photo-edit-status { font-size: 11.5px; color: var(--red); margin: 6px 0 0 0; min-height: 14px; }
.mn-photo-edit-hint { font-size: 11.5px; color: var(--ink-faint); margin: 4px 0 0 0; line-height: 1.4; }

.mn-empty { text-align: center; padding: 56px 20px; }
.mn-empty svg { color: var(--ink-faint); margin-bottom: 10px; }
.mn-empty-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; margin: 0 0 4px 0; }
.mn-empty-sub { font-size: 13px; color: var(--ink-soft); margin: 0; }

.mn-section-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.01em; color: var(--ink-soft); margin: 20px 0 9px 0; }
.mn-section-label:first-child { margin-top: 0; }

.mn-followed-mark { color: var(--green); font-size: 11px; line-height: 1; }
.mn-reason-pill {
  font-size: 10.5px; font-weight: 600; color: var(--green); background: var(--green-soft);
  padding: 3px 8px; border-radius: 999px; letter-spacing: 0.01em; white-space: nowrap;
}
.mn-follow-btn {
  flex: 0 0 auto; margin-left: 4px; font-size: 12px; font-weight: 700; font-family: 'Inter', sans-serif;
  color: var(--green); background: var(--green-soft); border: 1px solid transparent; border-radius: 999px;
  padding: 5px 12px; cursor: pointer; transition: background-color .15s, color .15s, border-color .15s;
  letter-spacing: 0.01em;
}
.mn-follow-btn-active { color: var(--ink-soft); background: transparent; border-color: var(--border-strong); }
.mn-follow-btn:active { transform: scale(0.95); }
/* Solid pill variant used on channel rows (Explore/Discover/My channels),
   matching WhatsApp's filled green "Follow" button in the Channels list. */
.mn-channel-row .mn-follow-btn {
  color: #fff; background: var(--green); border-color: transparent; padding: 7px 18px; font-size: 13px;
}
.mn-shell[data-theme="dark"] .mn-channel-row .mn-follow-btn { color: #06231A; }
.mn-shell[data-theme="dark"] .mn-channel-row .mn-follow-btn-active { color: var(--ink-soft); }
.mn-channel-row .mn-follow-btn-active {
  color: var(--ink-soft); background: var(--paper-line); border-color: transparent;
}

/* ---------------- "People you may know" feed module — Facebook-style
   horizontal card carousel spliced into the feed (see feedListHtml) ---------------- */
.mn-suggest-module { padding: 6px 0 16px; margin: 4px -12px 4px; border-bottom: 8px solid var(--bg-outer); }
.mn-suggest-module-head { display: flex; align-items: center; gap: 6px; padding: 0 12px 12px; }
.mn-suggest-module-title { display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14.5px; color: var(--ink); }
.mn-suggest-module-title svg { color: var(--ink-soft); }
.mn-suggest-scroll {
  display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 4px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.mn-suggest-scroll::-webkit-scrollbar { display: none; }
.mn-suggest-card {
  flex: 0 0 134px; background: var(--paper-raised); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; position: relative; box-shadow: var(--shadow-sm);
  cursor: pointer; transition: transform .15s cubic-bezier(.2,.7,.3,1);
}
.mn-suggest-card:active { transform: scale(0.97); }
.mn-suggest-card-dismiss {
  position: absolute; top: 6px; right: 6px; z-index: 2; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(17,19,23,0.55); color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.mn-suggest-card-dismiss:active { transform: scale(0.9); }
.mn-suggest-card-photo {
  height: 130px; display: block;
  background: linear-gradient(155deg, var(--border), var(--paper-line));
}
.mn-suggest-card-photo .mn-avatar {
  width: 100%; height: 100%; border-radius: 0; box-shadow: none;
}
.mn-suggest-card-photo .mn-avatar svg { width: 46px; height: 46px; }
.mn-suggest-card-body { padding: 9px 9px 10px; }
.mn-suggest-card-name {
  display: block; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px;
}
.mn-suggest-card-tagline {
  display: block; font-size: 11px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; margin-bottom: 8px;
}
.mn-suggest-card-btn { display: block; width: 100%; margin-left: 0; text-align: center; padding: 6px 0; }



/* ---------------- inputs ---------------- */
.mn-field { margin-bottom: 14px; }
.mn-field label { display: block; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
.mn-input, .mn-textarea {
  width: 100%; font-size: 14.5px; color: var(--ink);
  background: var(--paper-raised); border: 1px solid var(--border); border-radius: 12px; padding: 12px; resize: none;
  transition: border-color .15s, box-shadow .15s;
}
.mn-input:focus, .mn-textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.mn-input::placeholder, .mn-textarea::placeholder { color: var(--ink-faint); }

.mn-postbtn, .mn-primary-btn {
  width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 999px;
  background: var(--green); color: #fff; font-family: 'Inter', sans-serif;
  font-weight: 700; font-size: 15px; cursor: pointer; transition: opacity 0.15s ease, transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.mn-shell[data-theme="dark"] .mn-postbtn, .mn-shell[data-theme="dark"] .mn-primary-btn { color: #06231A; }
.mn-postbtn:disabled, .mn-primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.mn-postbtn:not(:disabled):active, .mn-primary-btn:not(:disabled):active { transform: scale(0.985); }

.mn-hint-box { display: flex; gap: 10px; align-items: flex-start; background: var(--green-soft); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--green); line-height: 1.5; margin-bottom: 4px; }
.mn-hint-box svg { flex: 0 0 auto; margin-top: 1px; }

/* ---------------- gate ---------------- */
.mn-gate { text-align: center; padding: 64px 24px; }
.mn-gate-icon {
  width: 52px; height: 52px; border-radius: 50%; background: var(--paper-line); color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto;
}
.mn-gate-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; margin: 0 0 6px 0; }
.mn-gate-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 22px 0; line-height: 1.5; }
.mn-gate-btns { display: flex; gap: 10px; justify-content: center; }
.mn-gate-btns button { flex: 1; max-width: 140px; padding: 11px; border-radius: 999px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.mn-gate-btn-primary { background: var(--green); color: #fff; border: none; }
.mn-shell[data-theme="dark"] .mn-gate-btn-primary { color: #06231A; }
.mn-gate-btn-ghost { background: none; color: var(--ink); border: 1px solid var(--border-strong); }

/* ---------------- profile (flat, Substack-style — no boxed card wrapper) ---------------- */
.mn-profile { padding-top: 2px; }
.mn-profile-toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.mn-profile-headinfo { min-width: 0; }
.mn-profile-head .mn-avatar,
.mn-profile-avatar-wrap .mn-avatar { width: 60px; height: 60px; font-size: 21px; flex: 0 0 auto; box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--green-soft); }
.mn-profile-avatar-wrap { position: relative; }
.mn-profile-avatar-wrap.mn-rank-1 .mn-avatar { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px #C6900E; }
.mn-profile-avatar-wrap.mn-rank-2 .mn-avatar { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px #9AA1A8; }
.mn-profile-avatar-wrap.mn-rank-3 .mn-avatar { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px #B06A2E; }
.mn-profile-avatar-medal {
  position: absolute; bottom: -3px; right: -3px; width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
  font-weight: 700; font-size: 10.5px; color: #fff; box-shadow: 0 0 0 3px var(--paper);
}
.mn-profile-avatar-medal-1 { background: linear-gradient(145deg,#F4C550,#C6900E); }
.mn-profile-avatar-medal-2 { background: linear-gradient(145deg,#D7DBDF,#9AA1A8); }
.mn-profile-avatar-medal-3 { background: linear-gradient(145deg,#E3A467,#B06A2E); }
.mn-profile-name { font-family: 'Inter', sans-serif; font-size: 21px; font-weight: 700; margin: 0; line-height: 1.2; }
.mn-profile-sub { font-size: 13px; color: var(--ink-soft); margin: 3px 0 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-profile-payout {
  display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 12px; font-weight: 600;
  color: var(--green); background: var(--green-soft); border-radius: 10px; padding: 8px 11px; line-height: 1.4;
}
.mn-profile-payout svg { flex: 0 0 auto; }
.mn-profile-bio { max-width: 100%; margin: 12px 0 0 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); text-align: left; }
.mn-profile-meta { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.mn-profile-meta-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.mn-profile-meta-row svg { flex: 0 0 auto; color: var(--ink-faint); }

/* stats live inline as plain text — no boxed stat card, always visible, zero taps needed */
.mn-profile-statline { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 12px 0 0 0; font-size: 13px; color: var(--ink-soft); }
.mn-profile-statline strong { color: var(--ink); font-family: 'Inter', sans-serif; font-weight: 700; }
.mn-profile-statline-dot { color: var(--ink-faint); font-size: 11px; }

.mn-profile-actions { display: flex; gap: 8px; margin-top: 16px; }
.mn-profile-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13.5px; padding: 9px; border-radius: 8px;
  border: 1px solid transparent; cursor: pointer; transition: opacity .15s, transform .1s, background-color .15s, border-color .15s;
}
.mn-profile-btn:active { transform: scale(0.97); }
.mn-profile-btn-primary { background: var(--green); color: #fff; }
.mn-profile-btn-primary:hover { opacity: 0.92; }
.mn-shell[data-theme="dark"] .mn-profile-btn-primary { color: #06231A; }
.mn-profile-btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--ink); }
.mn-profile-btn-ghost:hover { background: var(--paper-line); }

.mn-topics-section { margin: 18px 0 0 0; max-width: 100%; }
.mn-topics-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 8px; }
.mn-topics-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }
.mn-topic-chip { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; color: var(--green); background: var(--green-soft); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.mn-topics-empty { font-size: 12.5px; color: var(--ink-faint); }
.mn-cstats { display: flex; gap: 10px; margin: 4px 0 16px 0; }
.mn-cstat { flex: 1; background: var(--paper-line); border-radius: 12px; padding: 12px 10px; text-align: center; }
.mn-cstat-num { font-size: 19px; font-weight: 800; color: var(--ink); font-family: 'Inter', sans-serif; }
.mn-cstat-label { font-size: 11px; color: var(--ink-faint); font-weight: 600; margin-top: 2px; }

/* underline tabs — replaces the segmented pill control, reads as active/editorial rather than boxed */
.mn-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); margin: 22px 0 2px 0; }
.mn-tab { position: relative; border: none; background: none; padding: 10px 1px; font-size: 13.5px; font-weight: 600; color: var(--ink-faint); cursor: pointer; transition: color .15s; }
.mn-tab:hover { color: var(--ink-soft); }
.mn-tab-active { color: var(--ink); }
.mn-gift-tabs { gap: 14px; margin: 4px 0 4px; justify-content: space-between; }
.mn-gift-tabs .mn-tab:disabled { opacity: .35; cursor: not-allowed; }
.mn-tab-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.mn-hometabs { gap: 26px; margin: 0 0 4px 0; }
.mn-segment { display: flex; background: var(--paper-line); border-radius: 10px; padding: 3px; gap: 2px; margin: 12px 0 16px 0; position: relative; }
.mn-segment-btn { flex: 1; border: none; background: none; padding: 8px 0; font-size: 13px; font-weight: 700; color: var(--ink-faint); border-radius: 8px; cursor: pointer; position: relative; z-index: 1; transition: color .2s ease; }
.mn-segment-btn-active { color: var(--ink); }
.mn-segment-thumb { position: absolute; top: 3px; bottom: 3px; width: calc(33.333% - 2px); background: var(--paper); border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .25s cubic-bezier(.4,0,.2,1); z-index: 0; }
.mn-leaderboard-list { transition: opacity .18s ease; }
.mn-leaderboard-list-loading { opacity: 0; }

/* ---------------- profile stats (Facebook-Insights-style) ---------------- */
.mn-stats { padding-top: 14px; }
.mn-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mn-stats-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  background: var(--paper-raised); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
}
.mn-stats-card-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.mn-stats-card-icon-blue { background: var(--blue-soft); color: var(--blue); }
.mn-stats-card-icon-green { background: var(--green-soft); color: var(--green); }
.mn-stats-card-icon-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.mn-stats-card-icon-red { background: var(--red-soft); color: var(--red); }
.mn-stats-card-num { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1; }
.mn-stats-card-label { font-size: 12px; color: var(--ink-soft); }

.mn-stats-followers-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 12px;
  background: var(--green-soft); color: var(--green); border-radius: 10px; font-size: 12.5px;
}
.mn-stats-followers-row strong { font-family: 'Inter', sans-serif; }

.mn-stats-section-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 22px 0 10px 0; }

.mn-stats-postlist { display: flex; flex-direction: column; }
.mn-stats-postrow { padding: 12px 2px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background-color .15s; }
.mn-stats-postrow:hover { background: var(--paper-line); }
.mn-stats-postrow-title { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 8px 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.mn-stats-postrow-nums { display: flex; gap: 16px; }
.mn-stats-postrow-nums span { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.mn-stats-postrow-nums svg { flex: 0 0 auto; color: var(--ink-faint); }

.mn-stats-seemore { display: block; width: 100%; text-align: center; background: none; border: none; padding: 12px 0; color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; }

.mn-tips-list { display: flex; flex-direction: column; gap: 8px; }
.mn-tip-item {
  display: flex; align-items: flex-start; gap: 10px; background: var(--paper-raised);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px;
}
.mn-tip-icon { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: var(--yellow-soft); color: var(--yellow-ink); display: flex; align-items: center; justify-content: center; }
.mn-tip-text { flex: 1; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
.mn-tip-action { flex: 0 0 auto; background: none; border: 1px solid var(--border-strong); color: var(--ink); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; cursor: pointer; align-self: center; }
.mn-tip-action:hover { background: var(--paper-line); }

/* flat, divided list rows — replaces boxed history cards, matches an editorial post list */
.mn-history-item { display: flex; align-items: center; gap: 10px; padding: 14px 2px; background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; cursor: pointer; margin-bottom: 0; text-align: left; width: 100%; transition: background-color .15s; }
.mn-history-item:hover { background: var(--paper-line); }
.mn-history-item:active { opacity: 0.85; }
.mn-history-main { flex: 1; min-width: 0; }
.mn-history-title { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; margin: 0 0 4px 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mn-history-body { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 5px 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.mn-history-meta { display: flex; align-items: center; gap: 8px; }
.mn-history-chev { flex: 0 0 auto; color: var(--ink-faint); }

.mn-editform { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }

/* ---------------- answer / detail view — same flat language as the feed ---------------- */
.mn-detail-post { padding: 8px 0 20px 0; }
.mn-detail-headrow { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.mn-detail-headcol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding-top: 1px; }
.mn-detail-nameline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mn-detail-tagline { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: 0 0 auto; }
.mn-detail-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35; letter-spacing: -0.015em; margin: 16px 0 10px 0; color: var(--ink); }
.mn-detail-body { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; line-height: 1.65; color: var(--ink-soft); margin: 0 0 16px 0; white-space: pre-wrap; }

/* ---------------- YouTube embed (16:9, click-to-play, no autoplay) ---------------- */
.mn-yt-embed {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  margin: 8px 0 12px 0;
  background: #0b0b0c;
  cursor: pointer;
  border: 1px solid var(--border);
}
.mn-yt-embed-static { -webkit-tap-highlight-color: transparent; }
.mn-yt-thumb { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.mn-yt-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 58px; height: 58px; border-radius: 50%;
  background: rgba(17,19,23,0.62); border: 2px solid rgba(255,255,255,0.9);
  display: flex; align-items: center; justify-content: center;
  color: #fff; pointer-events: none; transition: background-color .15s, transform .15s;
}
.mn-yt-embed:hover .mn-yt-play { background: rgba(216,52,42,0.88); }
.mn-yt-embed:active .mn-yt-play { transform: translate(-50%, -50%) scale(0.94); }
.mn-yt-badge {
  position: absolute; left: 10px; bottom: 10px; padding: 3px 8px; border-radius: 5px;
  background: rgba(17,19,23,0.68); color: #fff; font-family: 'Inter', sans-serif;
  font-weight: 600; font-size: 11px; letter-spacing: 0.02em; pointer-events: none;
}
.mn-yt-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.mn-yt-pip-btn {
  position: absolute; top: 8px; right: 8px; z-index: 2; width: 30px; height: 30px;

  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
/* Shorts get a vertical 9:16 player, capped in width so it doesn't dominate the feed */
.mn-yt-embed-vertical { aspect-ratio: 9 / 16; max-width: 300px; margin-left: auto; margin-right: auto; }
.mn-detail-actions-row { display: flex; align-items: center; gap: 2px; margin: 4px 0 2px -10px; }

/* ---------------- Spotify embed ---------------- */
.mn-spotify-embed { margin: 8px 0 12px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #121212; }
.mn-spotify-embed iframe { width: 100%; border: 0; display: block; }
.mn-spotify-embed-compact iframe { height: 152px; }
.mn-spotify-embed-wide iframe { height: 352px; }

/* ---------------- Facebook embed (video/reel + post/photo) ---------------- */
.mn-fb-embed { margin: 8px 0 12px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #0b0b0c; }
.mn-fb-embed iframe { width: 100%; border: 0; display: block; }
.mn-fb-video-embed iframe { aspect-ratio: 16 / 9; height: auto; }
.mn-fb-reel-embed iframe { aspect-ratio: 9 / 16; max-width: 300px; margin: 0 auto; height: auto; }
.mn-fb-reel-embed { background: #0b0b0c; max-width: 300px; margin-left: auto; margin-right: auto; }
.mn-fb-post-embed { background: var(--paper-raised); }
.mn-fb-post-embed iframe { min-height: 320px; }

/* ---------------- Wikipedia preview card ---------------- */
.mn-wiki-card {
  display: flex; gap: 12px; margin: 8px 0 12px 0; padding: 12px; text-decoration: none; color: inherit;
  border: 1px solid var(--border); border-radius: 14px; background: var(--paper-raised);
  transition: background-color .15s, border-color .15s;
}
.mn-wiki-card-banner { flex-direction: column; gap: 0; padding: 0; overflow: hidden; }
.mn-wiki-card-banner-img-wrap { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--paper-line); }
.mn-wiki-card-banner-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mn-wiki-card-banner .mn-wiki-card-body { padding: 12px; }
.mn-wiki-card:hover { background: var(--paper-line); border-color: var(--border-strong); }
.mn-wiki-card-img { flex: 0 0 auto; width: 76px; height: 76px; border-radius: 10px; object-fit: cover; background: var(--paper-line); }
.mn-wiki-card-img-fallback { display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; color: var(--ink-faint); }
.mn-wiki-card-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mn-wiki-card-kicker { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.03em; color: var(--ink-faint); text-transform: uppercase; }
.mn-wiki-card-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-wiki-card-extract { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mn-wiki-card-btn { margin-top: 2px; display: inline-flex; align-items: center; gap: 3px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; color: var(--blue); }
.mn-wiki-card-loading { pointer-events: none; }
.mn-wiki-skel { background: linear-gradient(90deg, var(--paper-line) 25%, var(--border) 37%, var(--paper-line) 63%); background-size: 400% 100%; animation: mn-wiki-shimmer 1.4s ease infinite; border-radius: 6px; }
.mn-wiki-card-img.mn-wiki-skel { border-radius: 10px; }
.mn-wiki-skel-line { height: 10px; margin: 5px 0; }
@keyframes mn-wiki-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ---------------- responsive image embed ---------------- */
.mn-img-embed { margin: 8px 0 12px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--paper-line); width: 100%; aspect-ratio: 16 / 9; }
.mn-img-embed img { display: block; width: 100%; height: 100%; object-fit: contain; margin: 0 auto; cursor: zoom-in; image-rendering: -webkit-optimize-contrast; }
.mn-video-embed video { display: block; width: 100%; height: auto; background: #000; cursor: default; }
.mn-video-embed-yt { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
.mn-yt-facade { position: absolute; inset: 0; cursor: pointer; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
.mn-yt-facade-play { width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; }
.mn-yt-facade-play svg { margin-left: 3px; }
.mn-yt-open-link {
  position: absolute; bottom: 8px; right: 8px; z-index: 2; display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.65); color: #fff;
  font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; text-decoration: none;
}
.mn-video-embed-invalid { padding: 16px; text-align: center; font-size: 13px; color: var(--ink-faint); background: var(--paper-line); border-radius: 14px; }

.mn-media-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 100%; color: var(--sub); font-family: 'Inter', sans-serif; font-size: 12.5px; }
.mn-reels-image-wrap .mn-media-fallback { color: rgba(255,255,255,0.75); }
.mn-reels-fallback-next { margin-top: 4px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 999px; padding: 6px 14px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; }

/* ---------------- PDF document card ---------------- */
.mn-pdf-card {
  display: flex; align-items: center; gap: 10px; margin: 8px 0 12px 0; padding: 11px 12px;
  border: 1px solid var(--border); border-radius: 12px; background: var(--paper-raised);
  text-decoration: none; color: inherit; transition: background-color .15s, border-color .15s;
}
.mn-pdf-card:hover { background: var(--paper-line); border-color: var(--border-strong); }
.mn-pdf-card-icon { flex: 0 0 auto; display: flex; color: var(--ink-soft); }
.mn-pdf-card-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mn-pdf-card-name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-pdf-card-meta { font-size: 12px; color: var(--ink-faint); }
.mn-pdf-card-btn { flex: 0 0 auto; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; color: var(--blue); }

/* ---------------- create: composer + link tab ---------------- */
.mn-createtabs { margin: 14px 0 12px 0; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.mn-createtabs::-webkit-scrollbar { display: none; }
.mn-createtabs .mn-tab { flex: 0 0 auto; white-space: nowrap; }
.mn-createtabs { margin: 14px 0 12px 0; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.mn-createtabs::-webkit-scrollbar { display: none; }
.mn-createtabs .mn-tab { flex: 0 0 auto; white-space: nowrap; }

.mn-badges-cat { margin: 22px 0 6px 0; }
.mn-stat-periodrow { display: flex; gap: 8px; margin: 10px 0 16px 0; }
.mn-stat-pill { border: none; background: var(--paper-line); color: var(--ink-soft); font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.mn-stat-pill-active { background: var(--green-soft); color: var(--green); }
.mn-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mn-stat-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.mn-stat-card-label { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; margin-bottom: 8px; }
.mn-stat-card-value { font-size: 22px; font-weight: 800; color: var(--ink); }
.mn-badges-cat-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 10px; }
.mn-badges-row { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 10px 2px; scrollbar-width: none; }
.mn-badges-row::-webkit-scrollbar { display: none; }
.mn-badge { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; }
.mn-badge-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 3px 10px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.5); }
.mn-badge-circle-locked { background: var(--paper-line) !important; box-shadow: none; border: 2px dashed var(--border); filter: grayscale(1); opacity: .55; }
.mn-badge-name { font-size: 10.5px; font-weight: 700; color: var(--ink); margin-top: 6px; text-align: center; }
.mn-badge-progress { font-size: 9.5px; color: var(--ink-faint); font-weight: 600; margin-top: 1px; }
.mn-achv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin: 6px 0 4px 0; }
.mn-achv-item { display: flex; flex-direction: column; align-items: center; }
.mn-achv-empty { text-align: center; padding: 28px 12px; color: var(--ink-faint); font-size: 13px; }
.mn-compose-textarea {
  font-size: 17px; line-height: 1.55; padding: 4px 2px; min-height: 120px;
  background: transparent; border: none; border-radius: 0; overflow: hidden;
}
.mn-compose-textarea:focus { border: none; box-shadow: none; }
.mn-linkinput-row {
  display: flex; align-items: center; gap: 8px; background: var(--paper-raised);
  border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; margin-bottom: 4px;
  transition: border-color .15s, box-shadow .15s;
}
.mn-linkinput-row:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.mn-linkinput-icon { flex: 0 0 auto; display: flex; color: var(--ink-faint); }
.mn-linkinput { border: none; background: none; padding: 12px 0; }
.mn-linkinput:focus { border: none; box-shadow: none; }
.mn-linkinput-hint { font-size: 12px; color: var(--ink-faint); margin: 6px 2px 2px 2px; }
.mn-uploadbtn { display:inline-flex; align-items:center; gap:6px; margin:8px 0; padding:8px 14px; border-radius:999px; border:1px solid var(--border-strong); background:var(--paper-line); color:var(--ink); font-size:13px; font-weight:600; text-decoration:none; }
.mn-uploadguide { margin: 8px 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--paper-line); }
.mn-uploadguide-title { margin: 0 0 4px 0; font-size: 13px; font-weight: 600; color: var(--ink); }
.mn-uploadguide-steps { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
.mn-linkinput-clear { border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:14px; padding:4px; flex:0 0 auto; }
.mn-link-card {
  display: flex; align-items: center; gap: 10px; margin: 8px 0 12px 0; padding: 11px 12px;
  border: 1px solid var(--border); border-radius: 12px; background: var(--paper-raised);
  text-decoration: none; color: inherit; transition: background-color .15s, border-color .15s;
}
.mn-link-card:hover { background: var(--paper-line); border-color: var(--border-strong); }
.mn-link-card-icon { flex: 0 0 auto; display: flex; color: var(--ink-soft); }
.mn-link-card-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mn-link-card-domain { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; color: var(--ink); }
.mn-link-card-url { font-size: 12px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-link-card-chev { flex: 0 0 auto; display: flex; color: var(--ink-faint); }

.mn-answers-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 4px 0; }
.mn-answers-head svg { color: var(--ink-faint); }
.mn-answers-count { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; }

.mn-answers-divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 2px 0; color: var(--ink-faint); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.mn-answers-divider::before, .mn-answers-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.mn-asked-by { color: var(--ink-faint); font-weight: 400; margin-right: 2px; }

.mn-comments { display: flex; flex-direction: column; }
.mn-comment { padding: 14px 0; border-bottom: 1px solid var(--border); }
.mn-comment:last-child { border-bottom: none; }
.mn-comment-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mn-comment-author { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink); font-weight: 600; }
.mn-comment-author .mn-avatar { width: 22px; height: 22px; font-size: 9.5px; }
.mn-comment-body { font-size: 13.5px; line-height: 1.6; color: var(--ink); margin: 0 0 6px 28px; white-space: pre-wrap; }
.mn-comment-upvoted { color: var(--yellow-ink); }

/* Reply / Like / Quote action row, styled to feel like Threads */
.mn-answer-actions { display: flex; align-items: center; gap: 4px; margin-left: 28px; flex-wrap: wrap; }
.mn-action-btn {
  background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11.5px;
  color: var(--ink-soft); display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 999px;
  position: relative; transition: color .18s, background-color .18s, transform .1s;
}
.mn-action-btn:hover { background: var(--paper-line); }
.mn-action-btn:active { transform: scale(0.92); }
.mn-view-replies-btn {
  background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11.5px;
  color: var(--blue); padding: 5px 9px; border-radius: 999px; margin-left: 2px;
}
.mn-view-replies-btn:hover { background: var(--blue-soft); }

/* threaded discussion under an answer */
.mn-thread { margin: 6px 0 0 28px; padding-left: 14px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
.mn-reply { padding: 10px 0; }
.mn-reply .mn-comment-body { margin-left: 26px; }
.mn-reply .mn-answer-actions { margin-left: 26px; }
.mn-reply .mn-comment-author .mn-avatar { width: 19px; height: 19px; font-size: 8.5px; }
.mn-reply-mention { color: var(--blue); font-weight: 600; }

.mn-reply-box { margin: 8px 0 4px 26px; display: flex; flex-direction: column; gap: 6px; }
.mn-replying-to { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.mn-replying-to button { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 12px; padding: 0; }
.mn-reply-box textarea { font-size: 13px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--paper-raised); color: var(--ink); resize: none; max-height: 70px; }
.mn-reply-send { align-self: flex-end; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; padding: 6px 14px; border-radius: 999px; background: var(--green); color: #fff; border: none; cursor: pointer; }
.mn-shell[data-theme="dark"] .mn-reply-send { color: #06231A; }
.mn-reply-send:disabled { opacity: 0.35; }

/* quote block — an embedded, condensed reference to the quoted answer/reply */
.mn-quote-block { margin: 0 0 10px 28px; padding: 8px 10px; border-left: 3px solid var(--border-strong); background: var(--paper-line); border-radius: 6px; }
.mn-quote-author { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.mn-quote-body { margin: 2px 0 0 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); white-space: pre-wrap; }
.mn-quote-block-composer { margin: 0; flex: 1; }

.mn-composer-bar {
  position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: color-mix(in srgb, var(--paper) 95%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)) 16px; z-index: 6;
}
.mn-composer-bar-col { display: flex; flex-direction: column; gap: 8px; }
.mn-composer-row { display: flex; gap: 8px; align-items: flex-end; }
.mn-composer-quote { display: flex; align-items: flex-start; gap: 8px; }
.mn-quote-cancel { flex: 0 0 auto; background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 13px; padding: 4px; }
.mn-composer-bar textarea {
  flex: 1; font-size: 13.5px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--paper-raised); color: var(--ink); resize: none; max-height: 80px;
}
.mn-composer-send {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 999px; background: var(--green); border: none;
  color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.mn-shell[data-theme="dark"] .mn-composer-send { color: #06231A; }
.mn-composer-send:disabled { opacity: 0.35; }
.mn-chat-send { background: var(--green); width: 42px; height: 42px; color: #fff; }

/* ---------------- chat pill (WhatsApp-style grouped input) ---------------- */
.mn-chat-pill {
  flex: 1; display: flex; align-items: center; gap: 2px;
  background: var(--paper-raised);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 4px 4px 10px;
  box-shadow: var(--shadow-sm);
}
.mn-chat-pill textarea {
  flex: 1; border: none; background: transparent; box-shadow: none;
  padding: 8px 4px; max-height: 80px; resize: none;
  font-size: 13.5px; color: var(--ink);
}
.mn-chat-pill textarea:focus { outline: none; }
.mn-chat-pill .mn-composer-attach { width: 30px; height: 30px; flex: 0 0 auto; }

.mn-shell[data-screen="chat"] .mn-composer-bar.mn-chat-composer {
  background: transparent; backdrop-filter: none; border-top: none;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)) 10px;
}

/* ---------------- nav ---------------- */

/* ---------------- nav ----------------
   4 destinations max (Miller's Law), evenly spaced across the thumb zone
   (Fitts's Law + mobile thumb-reach), each tap target ≥44px, the create
   action raised and visually distinct since it's the one primary action
   (hierarchy), and the whole bar following the familiar bottom-tab-bar
   pattern most apps already use (Jakob's Law). */
.mn-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr);
  align-items: center; justify-items: center;
  background: color-mix(in srgb, var(--paper-raised) 95%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)) 8px; z-index: 20;
  box-shadow: 0 -10px 26px rgba(20,23,28,0.07);
}
.mn-nav { grid-template-columns: repeat(5, 1fr); }
.mn-shell[data-screen="chat"] .mn-nav {
  display: none;
}
.mn-shell[data-screen="channelDetail"] .mn-nav,
.mn-shell[data-screen="channelPostDetail"] .mn-nav {
  display: none;
}
.mn-shell[data-screen="chat"] .mn-composer-bar.mn-chat-composer {
  bottom: 0;
}
.mn-navbtn {
  background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-faint); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px;
  width: 100%; min-height: 48px; padding: 6px 4px; border-radius: 14px; position: relative;
  transition: color .2s ease, background-color .2s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
}
.mn-navbtn svg { transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.mn-navbtn:active { transform: scale(0.92); }
.mn-navbtn-active { color: var(--green); background: var(--green-soft); }
.mn-navbtn-active svg { transform: scale(1.06); }
.mn-navbtn > span:not(.mn-fab) { display: none; }
.mn-navbtn { gap: 0; }
.mn-navbtn svg { width: 26px; height: 26px; }
.mn-navbtn-create { margin-top: 0; }
.mn-navbtn-create .mn-fab {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--paper-line); color: var(--ink);
  border: none; box-shadow: none;
}
.mn-navbtn-create.mn-navbtn-active .mn-fab,
.mn-navbtn-create:hover .mn-fab { background: var(--border); }
.mn-navbtn-create { color: var(--ink); margin-top: -20px; background: none !important; }
.mn-fab {
  width: 46px; height: 46px; border-radius: 50%; background: var(--green); color: #fff;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md);
  border: 3px solid var(--paper-raised);
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}

/* ---------------- toast ---------------- */
.mn-toast {
  position: fixed; top: calc(58px + env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  background: var(--paper-raised); color: var(--ink); font-size: 13px; font-weight: 500;
  padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-md);
  z-index: 110; animation: mn-toast-in 0.22s cubic-bezier(.2,.8,.3,1.2); max-width: 88%; text-align: left;
}
.mn-toast svg { flex: 0 0 auto; color: var(--green); }
@keyframes mn-toast-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.mn-toast-out { animation: mn-toast-out 0.18s ease forwards; }
@keyframes mn-toast-out { to { opacity: 0; transform: translate(-50%, -8px); } }

/* ---------------- micro-interactions ---------------- */
@keyframes mn-pop {
  0% { transform: scale(1); }
  35% { transform: scale(1.3); }
  65% { transform: scale(0.94); }
  100% { transform: scale(1); }
}
.mn-pop-anim { animation: mn-pop .42s cubic-bezier(.34,1.56,.64,1); }

@keyframes mn-float-up {
  0% { transform: translate(-50%, 2px) scale(0.75); opacity: 0; }
  22% { transform: translate(-50%, -6px) scale(1.08); opacity: 1; }
  100% { transform: translate(-50%, -24px) scale(1); opacity: 0; }
}
.mn-plusone {
  position: absolute; left: 50%; top: -4px; transform: translate(-50%, 0);
  font-family: 'Inter', sans-serif; font-weight: 800; fognt-size: 11.5px; color: var(--yellow-ink);
  pointer-events: none; animation: mn-float-up .62s ease-out forwards; z-index: 3; white-space: nowrap;
}
.mn-count { display: inline-block; transition: color .2s ease, transform .2s ease; }

@keyframes mn-star-pop {
  0% { transform: scale(1) rotate(0deg); }
  40% { transform: scale(1.5) rotate(-14deg); }
  70% { transform: scale(0.88) rotate(8deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.mn-chip-star { transition: color .18s; }
.mn-chip-star-anim { animation: mn-star-pop .45s ease; }

@keyframes mn-check-pop {
  0% { transform: scale(0.4); opacity: 0; }
  55% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.mn-btn-checkicon { display: inline-flex; animation: mn-check-pop .32s ease; }

@keyframes mn-spin { to { transform: rotate(360deg); } }
.mn-spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); border-top-color: #fff; animation: mn-spin .6s linear infinite; display: inline-block; }
.mn-shell[data-theme="dark"] .mn-spinner { border-color: rgba(6,35,26,0.4); border-top-color: #06231A; }

.mn-navbtn-create:active .mn-fab { transform: scale(0.88); }

/* ---------------- auth sheet (opens like the share sheet: slides up from the bottom) ---------------- */
@keyframes mn-fade-in { from { opacity: 0; } to { opacity: 1; } }
.mn-auth-overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 30; backdrop-filter: blur(3px); }
.mn-auth-overlay.mn-anim-in { animation: mn-fade-in .15s ease; }
.mn-auth-sheet {
  position: relative; width: 100%; max-width: 480px;
  max-height: min(90vh, 720px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-radius: 22px 22px 0 0; box-shadow: var(--shadow-md);
  padding: 10px 22px calc(24px + env(safe-area-inset-bottom, 0px)) 22px;
  background:
    radial-gradient(120% 140px at 50% 0%, var(--green-soft) 0%, transparent 70%),
    var(--paper);
}
.mn-auth-sheet.mn-anim-in { animation: mn-sheet-up .24s cubic-bezier(.2,.8,.3,1.05); }
.mn-auth-sheet::-webkit-scrollbar { width: 6px; }
.mn-auth-sheet::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.mn-auth-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border-strong); margin: 4px auto 16px auto; }

.mn-auth-top { display: flex; justify-content: center; margin-bottom: 12px; }
.mn-auth-badge {
  width: 46px; height: 46px; border-radius: 14px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; color: #fff;
  background: linear-gradient(155deg, var(--green) 0%, #0F4A3B 100%);
  box-shadow: 0 10px 20px -8px rgba(22,121,79,0.55);
}
.mn-shell[data-theme="dark"] .mn-auth-badge { box-shadow: 0 10px 20px -8px rgba(75,191,140,0.35); }

.mn-auth-sheet .mn-tabs { margin-bottom: 16px; }
.mn-auth-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 19px; text-align: center; margin: 0 0 4px 0; }
.mn-auth-sub { font-size: 12.5px; color: var(--ink-soft); text-align: center; line-height: 1.5; margin: 0 0 18px 0; }

/* step indicator for the 2-part sign-up flow */
.mn-auth-steps { display: flex; align-items: flex-start; justify-content: center; gap: 6px; margin-bottom: 20px; }
.mn-auth-step { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; }
.mn-auth-step-row { display: flex; align-items: center; }
.mn-auth-step-dot {
  width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: 'Inter', sans-serif;
  background: var(--paper-line); color: var(--ink-faint); border: 1px solid var(--border);
  transition: background-color .2s, color .2s, border-color .2s;
}
.mn-auth-step-label { font-size: 10.5px; font-weight: 600; color: var(--ink-faint); text-align: center; transition: color .2s; }
.mn-auth-step-active .mn-auth-step-dot { background: var(--green); color: #fff; border-color: var(--green); }
.mn-shell[data-theme="dark"] .mn-auth-step-active .mn-auth-step-dot { color: #06231A; }
.mn-auth-step-active .mn-auth-step-label { color: var(--ink); }
.mn-auth-step-done .mn-auth-step-dot { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.mn-auth-step-line { width: 40px; height: 2px; background: var(--border); border-radius: 2px; margin-top: 11px; }
.mn-auth-step-line-done { background: var(--green); }

.mn-auth-body { display: flex; flex-direction: column; gap: 14px; }
.mn-auth-body .mn-field { margin-bottom: 0; }

.mn-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mn-field-hint { display: block; margin-top: 6px; font-size: 11px; color: var(--ink-faint); }
.mn-field-error { display: block; margin-top: 6px; font-size: 11.5px; color: var(--red); font-weight: 500; }

.mn-input-wrap { position: relative; display: flex; align-items: center; }
.mn-input-icon { position: absolute; left: 12px; display: flex; color: var(--ink-faint); pointer-events: none; }
.mn-input-has-icon { padding-left: 36px; }
.mn-input-has-pwtoggle { padding-right: 42px; }
.mn-select.mn-input { cursor: pointer; }
.mn-input-error { border-color: var(--red) !important; box-shadow: 0 0 0 3px var(--red-soft) !important; }
.mn-pw-wrap .mn-pw-toggle {
  position: absolute; right: 4px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: var(--ink-faint); cursor: pointer; border-radius: 8px; transition: color .15s, background-color .15s;
}
.mn-pw-wrap .mn-pw-toggle:hover { color: var(--ink); background: var(--paper-line); }

.mn-auth-error { display: flex; gap: 8px; align-items: flex-start; background: var(--red-soft); color: var(--red); font-size: 12px; line-height: 1.5; padding: 10px 12px; border-radius: 8px; margin-top: 14px; }
.mn-auth-error svg { flex: 0 0 auto; margin-top: 1px; }

.mn-auth-actions { display: flex; gap: 10px; margin-top: 18px; }
.mn-auth-actions .mn-primary-btn, .mn-auth-actions .mn-auth-submit { margin-top: 0; flex: 1; }
.mn-auth-btn-back {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 0 18px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--paper-raised);
  color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; transition: background-color .15s, transform .1s;
}
.mn-auth-btn-back:hover { background: var(--paper-line); }
.mn-auth-btn-back:active { transform: scale(0.97); }

.mn-auth-submit {
  margin-top: 18px; width: 100%;
  background: linear-gradient(135deg, var(--green) 0%, color-mix(in srgb, var(--green) 62%, black) 100%);
  box-shadow: 0 12px 22px -10px color-mix(in srgb, var(--green) 65%, transparent);
}
.mn-auth-terms { font-size: 11px; color: var(--ink-faint); text-align: center; line-height: 1.5; margin: 12px 0 0 0; }
.mn-auth-close { display: block; margin: 14px auto 0 auto; background: none; border: none; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; padding: 4px; }

@media (max-width: 360px) {
  .mn-field-grid { grid-template-columns: 1fr; }
  .mn-auth-step { width: 66px; }
  .mn-auth-step-line { width: 24px; }
}

/* ---------------- share sheet ---------------- */
.mn-sheet-overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 35; }
.mn-sheet-overlay.mn-anim-in { animation: mn-fade-in .15s ease; }
.mn-sheet {
  width: 100%; max-width: 480px; background: var(--paper); border-radius: 20px 20px 0 0;

.mn-sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border-strong); margin: 4px auto 14px auto; }

/* ---------------- Reels: tray (lives inside Home only) ---------------- */
.mn-reels-tray { padding: 2px 16px 16px 16px; margin-bottom: 4px; border-bottom: 1px solid var(--paper-line); }
.mn-reels-tray-head { display: flex; align-items: center; margin-bottom: 10px; }

.mn-select-trigger {

  background: var(--paper-raised); border: 1px solid var(--border); border-radius: 12px;

.mn-select-chevron { color: var(--ink-faint); display: flex; flex: 0 0 auto; transition: transform .15s; }
.mn-select-trigger-open .mn-select-chevron { transform: rotate(180deg); }
.mn-option-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
