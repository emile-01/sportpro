/* ---------------- desktop shell / sidebar ---------------- */
.mn-sidebar { display: none; }

/* Below the desktop breakpoint, Discover already lives in the bottom tab bar —
   hiding it here avoids offering the same destination two ways (consistency). */
@media (max-width: 959.98px) {
  .mn-header-discover-btn { display: none; }
}

@media (min-width: 960px) {
  html, body { background: var(--bg-outer, #EEF0F2); }
  body[data-theme="dark"] { background: #000000; }

  .mn-shell {
    display: flex; align-items: flex-start; justify-content: center;
    gap: 28px; min-height: 100vh; padding: 28px 24px;
  }

  .mn-sidebar {
    display: flex; flex-direction: column; gap: 4px;
    width: 248px; flex: 0 0 248px; position: sticky; top: 28px;
    background: var(--paper-raised); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px 14px; box-shadow: var(--shadow-sm); max-height: calc(100vh - 56px); overflow-y: auto;
  }
  .mn-sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px 10px; }
  .mn-sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .mn-sidebar-link {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: 12px; border: none; background: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; color: var(--ink-soft);
    position: relative; transition: background-color .18s ease, color .18s ease, transform .12s ease;
  }
  .mn-sidebar-link svg { transition: transform .18s cubic-bezier(.34,1.56,.64,1); flex: 0 0 auto; }
  .mn-sidebar-link:hover { background: var(--paper-line); color: var(--ink); }
  .mn-sidebar-link:active { transform: scale(0.98); }
  .mn-sidebar-link-active { color: var(--green); background: var(--green-soft); }
  .mn-sidebar-link-active svg { transform: scale(1.08); }
  .mn-sidebar-link-active::before {
    content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; border-radius: 999px; background: var(--green);
  }
  .mn-sidebar-link-primary { background: var(--green); color: #fff; margin: 6px 0 10px 0; box-shadow: 0 6px 16px rgba(22,121,79,0.22); }
  .mn-sidebar-link-primary:hover { background: var(--green); color: #fff; opacity: .92; transform: translateY(-1px); }
  .mn-sidebar-section-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); padding: 14px 12px 6px 12px; }
  .mn-sidebar-categories { display: flex; flex-direction: column; gap: 1px; flex: 1; }
  .mn-sidebar-cat {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
    padding: 8px 12px; border-radius: 9px; border: none; background: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; color: var(--ink-soft);
    transition: background-color .15s, color .15s;
  }
  .mn-sidebar-cat:hover { background: var(--paper-line); color: var(--ink); }
  .mn-sidebar-cat-active { color: var(--green); font-weight: 700; }
  .mn-sidebar-cat-count { font-size: 11px; color: var(--ink-faint); font-weight: 600; }
  .mn-sidebar-foot { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .mn-sidebar-foot-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .mn-sidebar-user { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 6px 8px; border-radius: 11px; }
  .mn-sidebar-user span { font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mn-sidebar-signout { background: none; border: 1px solid var(--border-strong); color: var(--red); font-size: 11.5px; font-weight: 600; border-radius: 8px; padding: 6px 9px; cursor: pointer; flex: 0 0 auto; }

  /* main content becomes a floating card instead of an edge-to-edge mobile screen */
  .mn-app {
    max-width: 640px; width: 640px; margin: 0; min-height: 0;
    border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .mn-header { border-radius: 18px 18px 0 0; }
  /* the branded top bar is now in the sidebar — only show the header on desktop for the detail (back button) view */
  .mn-header:not(.mn-header-detail) { display: none; }
  .mn-main { padding: 20px 22px 28px 22px; }

  .mn-nav { display: none; } /* replaced by sidebar nav */

  .mn-composer-bar {
    position: sticky; left: auto; bottom: 0; transform: none; width: 100%; max-width: none;
    border-radius: 0 0 18px 18px; padding: 12px 22px;
  }

  .mn-post { padding: 20px 14px; gap: 14px; margin: 0 -14px; }
  .mn-post-avatar-col .mn-avatar { width: 44px; height: 44px; }
  .mn-post-title { font-size: 16.5px; }
  .mn-post-desc { -webkit-line-clamp: 4; }
}

@media (min-width: 1240px) {
  .mn-app { max-width: 720px; width: 720px; }
}

/* ---------------- discover screen ---------------- */
/* base (always-on) versions of a few rail-only classes, since Discover reuses
   them in the main column at every viewport width, not just the >=1320px rail */
.mn-panel-empty { font-size: 12px; color: var(--ink-faint); line-height: 1.5; margin: 0; }
.mn-panel-list { display: flex; flex-direction: column; gap: 2px; }
.mn-trend-row {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  background: none; border: none; cursor: pointer; padding: 9px 8px; border-radius: 9px;
  font-family: 'Inter', sans-serif; transition: background-color .15s;
}
.mn-trend-row:hover { background: var(--paper-line); }
.mn-trend-rank { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; color: var(--ink-faint); width: 14px; flex: 0 0 auto; }
.mn-trend-label { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.mn-trend-score { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; flex: 0 0 auto; }
.mn-discover-intro { font-size: 13px; color: var(--ink-soft); margin: 0 0 18px 0; line-height: 1.5; }
.mn-discover-section { margin-bottom: 24px; }
.mn-discover-title {
  display: flex; align-items: center; gap: 7px; margin: 0 0 10px 0;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink);
}
.mn-discover-title svg { color: var(--yellow-ink); flex: 0 0 auto; }
.mn-discover-title-link { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--green); background: none; border: none; cursor: pointer; padding: 4px 2px; font-family: 'Inter', sans-serif; }

/* ---------------- horizontal rails (Discover: best videos/images/word posts/contributors) ---------------- */
.mn-hrail {
  display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch; padding-bottom: 2px; margin: 0 -2px;
}
.mn-hrail::-webkit-scrollbar { display: none; }
.mn-hrail-item {
  flex: 0 0 auto; width: 78vw; max-width: 300px; scroll-snap-align: start;
  border-right: 1px solid var(--paper-line); padding: 0 14px 0 2px; margin-right: 2px;
}
.mn-hrail-item:last-child { border-right: none; }
.mn-hrail-item .mn-post { margin: 0; padding: 0; border-bottom: none; border-radius: 0; height: 100%; }
.mn-hrail-item .mn-post:hover, .mn-hrail-item .mn-post:active { background: none; }
.mn-hrail-creators { gap: 0; }
.mn-hrail-item-creator { width: auto; padding: 0 14px 0 2px; }
.mn-creator-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px; width: 92px;
  background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; padding: 2px 0;
}
.mn-creator-tile-avatar-wrap { position: relative; }
.mn-creator-tile .mn-avatar { width: 56px; height: 56px; font-size: 19px; }
.mn-creator-tile-medal {
  position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 10px; color: #fff; box-shadow: 0 0 0 2px var(--paper);
}
.mn-creator-tile-name { font-size: 12.5px; font-weight: 700; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-creator-tile-followers { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-faint); }
.mn-follow-btn-tile { margin-top: 2px; padding: 5px 12px; font-size: 11.5px; }

/* follow callout — flat tinted banner, not a boxed card, matches the pill/badge language used elsewhere */
.mn-follow-banner {
  display: flex; align-items: flex-start; gap: 10px; background: var(--green-soft);
  border-radius: 14px; padding: 12px 13px; margin-bottom: 14px;
}
.mn-follow-banner-icon { flex: 0 0 auto; color: var(--green); margin-top: 1px; }
.mn-follow-banner-text { font-size: 12.5px; line-height: 1.5; color: var(--green); }
.mn-follow-banner-text strong { font-weight: 700; }
.mn-follow-banner-text a { color: inherit; text-decoration: underline; font-weight: 700; }

/* ---------------- "thanks to our users" note ---------------- */
.mn-thanks-banner {
  margin: 22px 0 6px 0; text-align: center; padding: 20px 16px; border-radius: 16px;
  background: linear-gradient(155deg, var(--green-soft), transparent); border: 1px dashed var(--border-strong);
}
.mn-thanks-mark { display: inline-block; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: var(--green); margin-bottom: 6px; }
.mn-thanks-text { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.6; color: var(--ink); max-width: 340px; margin-inline: auto; }
.mn-thanks-text strong { color: var(--green); }
.mn-panel-thanks { margin: 4px 4px 0 4px; font-size: 11.5px; line-height: 1.5; color: var(--ink-faint); text-align: center; }

/* clickable author targets across posts/comments/lists open a full profile */
.mn-post-avatar-col, .mn-post-name, .mn-comment-author, .mn-contributor-row { cursor: pointer; }

/* creator + trending + MVA rows all share the .mn-post rhythm: flush rows on
   the page background, separated by a hairline, no card box/shadow */
.mn-creator-list { display: flex; flex-direction: column; }
.mn-creator-row {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: none; border: none; border-bottom: 1px solid var(--paper-line); border-radius: 10px;

.mn-discover-list { display: flex; flex-direction: column; }

.mn-mva-list { display: flex; flex-direction: column; }

  .mn-trend-label { flex: 1; font-size: 13px; font-weight: 600; color: var(--ink); }
  .mn-trend-score { font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 2px 7px; border-radius: 999px; flex: 0 0 auto; }
  .mn-contributor-row { display: flex; align-items: center; gap: 9px; padding: 7px 6px; }
  .mn-contributor-row .mn-avatar { width: 24px; height: 24px; font-size: 10px; }
  .mn-contributor-rank { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; color: var(--ink-faint); width: 13px; flex: 0 0 auto; text-align: center; }
  .mn-contributor-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mn-contributor-points { font-size: 11px; font-weight: 700; color: var(--yellow-ink); background: var(--yellow-soft); padding: 2px 7px; border-radius: 999px; flex: 0 0 auto; }
  .mn-suggest-row { display: flex; align-items: center; gap: 9px; padding: 8px 6px; border-radius: 10px; transition: background-color .15s; cursor: pointer; }
  .mn-suggest-row:hover { background: var(--paper-line); }
  .mn-suggest-row .mn-avatar { width: 30px; height: 30px; font-size: 12px; flex: 0 0 auto; }
  .mn-suggest-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mn-suggest-name { font-size: 13px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mn-suggest-tagline { font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mn-panel-promo { border-bottom-style: dashed; }
}

/* ---------------- boot skeleton (shown before app JS/data is ready) ---------------- */
.mn-boot-logo, .mn-boot-line, .mn-boot-card {
  background: linear-gradient(90deg, var(--paper-line) 25%, var(--border) 37%, var(--paper-line) 63%);
  background-size: 400% 100%; animation: mn-shimmer 1.4s ease infinite; border-radius: 8px;
}
.mn-boot-logo { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; }
.mn-sidebar .mn-boot-logo { margin-right: 10px; }
/* Sized to approximate the average real feed card (avatar row + title +
   3-line body + action row) so swapping the skeleton for live data doesn't
   suddenly change the page height and yank the feed/scroll position — that
   mismatch (92px skeleton vs. a much taller real card) was the "posts jump
   when the page finishes loading" bug. */
.mn-boot-card { height: 190px; border-radius: 12px; margin-bottom: 10px; }
.mn-boot-card-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
@keyframes mn-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

@media (prefers-reduced-motion: reduce) { .mn-app * { animation: none !important; transition: none !important; } }

/* ---------------- direct messages (mini messenger) ---------------- */
.mn-messages-btn { position: relative; }
.mn-msg-header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
.mn-msg-search { margin: 2px 0 14px 0; }
.mn-newchat-btn {

}

}

/* pill-style tabs: Inbox / Unread / Communities / Requests */
.mn-msg-tabs { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px 0; overflow-x: auto; scrollbar-width: none; }
.mn-msg-tabs::-webkit-scrollbar { display: none; }
.mn-msg-tab {

  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: 0.01em; color: var(--ink);
  cursor: pointer; transition: background-color .15s, color .15s;
}
.mn-msg-tab:hover { background: var(--paper-line); }
.mn-msg-tab-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.mn-chat-list { display: flex; flex-direction: column; }
.mn-chat-list .mn-chat-row:first-child { padding-top: 6px; }
.mn-chat-row {

}

.mn-chat-row-avatar-wrap { position: relative; flex: 0 0 auto; }
.mn-chat-row .mn-avatar { width: 50px; height: 50px; flex: 0 0 auto; box-shadow: 0 0 0 2px var(--paper); }
.mn-chat-row-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  white-space: nowrap; flex: 1 1 auto; min-width: 0;
}

.mn-chat-row-unread .mn-chat-row-time { color: var(--ink); font-weight: 600; }
.mn-chat-row-badge, .mn-chat-count { position: static; box-shadow: none; flex: 0 0 auto; }

/* new-message sheet */
.mn-newchat-input {
  width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; margin: 4px 0 12px 0;
  border-radius: 10px; border: 1px solid var(--border); background: var(--paper-raised); color: var(--ink);
}
.mn-newchat-input:focus { outline: none; border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--paper-line); }
.mn-newchat-results { max-height: 46vh; overflow-y: auto; margin-bottom: 8px; }

/* ---------------- New chat: full-screen picker (WhatsApp-style) ----------------
   Replaces the old small bottom sheet with a dedicated full-screen list: a
   back-button header, a pill search bar, a pinned "Message yourself" row,
   then every other person as one big, high-contrast row (avatar, name,
   subtitle) with a selection circle on the right — same visual language as
   the rest of the app (same tokens/colors), just given proper hierarchy. */
.mn-newchat-screen {
  position: fixed; inset: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 35;
  background: var(--paper); display: flex; flex-direction: column;
  animation: mn-newchat-slide-in .2s cubic-bezier(.2,.8,.3,1.05);
}
@keyframes mn-newchat-slide-in { from { transform: translate(-50%, 14px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.mn-newchat-header {
  display: flex; align-items: center; gap: 14px; flex: 0 0 auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px 16px;
  border-bottom: 1px solid var(--border);
}
.mn-newchat-header-title { flex: 1; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; color: var(--ink); }
.mn-newchat-header-back {
  width: 36px; height: 36px; border-radius: 999px; border: none; background: none;
  color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: 0 0 auto;
}
.mn-newchat-header-back:hover { background: var(--paper-line); }
.mn-newchat-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px)) 16px; }
.mn-newchat-search-wrap { position: relative; margin-bottom: 6px; }
.mn-newchat-search-wrap input {
  width: 100%; font-size: 14.5px; padding: 12px 14px 12px 40px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--paper-raised); color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.mn-newchat-search-wrap input:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--paper-line); outline: none; }
.mn-newchat-search-wrap input::placeholder { color: var(--ink-faint); }
.mn-newchat-search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }

.mn-newchat-self-row {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: none; border: none; border-bottom: 1px solid var(--paper-line); cursor: pointer;
  padding: 13px 4px; margin-bottom: 2px;
}
.mn-newchat-self-row .mn-avatar { width: 46px; height: 46px; }
.mn-newchat-self-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mn-newchat-self-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-newchat-self-sub { font-size: 12.5px; color: var(--ink-faint); }

.mn-newchat-list { display: flex; flex-direction: column; }
.mn-newchat-row {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: none; border: none; border-bottom: 1px solid var(--paper-line); cursor: pointer;
  padding: 12px 4px; transition: background-color .15s ease;
}
.mn-newchat-list > *:last-child { border-bottom: none; }
.mn-newchat-row:hover { background: var(--paper-line); }
.mn-newchat-row:active { background: var(--border); }
.mn-newchat-row .mn-avatar { width: 46px; height: 46px; flex: 0 0 auto; }
.mn-newchat-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mn-newchat-row-name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-newchat-row-sub { font-size: 12.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-newchat-row-radio {
  flex: 0 0 auto; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--border-strong);
}

/* message icon quick-action, used next to Follow in people rows */
.mn-msg-iconbtn {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.mn-msg-iconbtn:hover { color: var(--ink); background: var(--paper-line); }
.mn-msg-iconbtn:active { transform: scale(0.94); }

/* chat header (back button + other person's avatar/name, tap to view profile) */
.mn-chat-header { gap: 10px; box-shadow: none; position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px); }
.mn-chat-header .mn-avatar { width: 28px; height: 28px; font-size: 12px; flex: 0 0 auto; }

/* chat thread — WhatsApp-style wallpaper + bubbles */
.mn-chat-messages {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: 10px 8px 84px 8px; margin: 0 -16px;
  min-height: calc(100vh - 180px);
  background-color: #0B141A;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 1.6px, transparent 1.6px),
    radial-gradient(circle at 68% 42%, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1.4px, transparent 1.4px),
    radial-gradient(circle at 38% 78%, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1.5px, transparent 1.5px),
    radial-gradient(circle at 88% 85%, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1.3px, transparent 1.3px);
  background-size: 140px 140px, 160px 160px, 130px 130px, 170px 170px;
}
.mn-shell:not([data-theme="dark"]) .mn-chat-messages {
  background-color: #E5DDD5;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(0,0,0,0.03) 0, rgba(0,0,0,0.03) 1.6px, transparent 1.6px),
    radial-gradient(circle at 68% 42%, rgba(0,0,0,0.025) 0, rgba(0,0,0,0.025) 1.4px, transparent 1.4px),
    radial-gradient(circle at 38% 78%, rgba(0,0,0,0.025) 0, rgba(0,0,0,0.025) 1.5px, transparent 1.5px),
    radial-gradient(circle at 88% 85%, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 1.3px, transparent 1.3px);
  background-size: 140px 140px, 160px 160px, 130px 130px, 170px 170px;
}
/* paint the same wallpaper on .mn-main itself so there's no bare black
   gap below short conversations or around the fixed header/composer */
.mn-shell[data-screen="chat"] .mn-main {
  background-color: #0B141A;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 1.6px, transparent 1.6px),
    radial-gradient(circle at 68% 42%, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1.4px, transparent 1.4px),
    radial-gradient(circle at 38% 78%, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1.5px, transparent 1.5px),
    radial-gradient(circle at 88% 85%, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1.3px, transparent 1.3px);
  background-size: 140px 140px, 160px 160px, 130px 130px, 170px 170px;
}
.mn-shell:not([data-theme="dark"])[data-screen="chat"] .mn-main {
  background-color: #E5DDD5;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(0,0,0,0.03) 0, rgba(0,0,0,0.03) 1.6px, transparent 1.6px),
    radial-gradient(circle at 68% 42%, rgba(0,0,0,0.025) 0, rgba(0,0,0,0.025) 1.4px, transparent 1.4px),
    radial-gradient(circle at 38% 78%, rgba(0,0,0,0.025) 0, rgba(0,0,0,0.025) 1.5px, transparent 1.5px),
    radial-gradient(circle at 88% 85%, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 1.3px, transparent 1.3px);
  background-size: 140px 140px, 160px 160px, 130px 130px, 170px 170px;
}
.mn-shell[data-screen="chat"] .mn-main { animation: mnChatIn .22s cubic-bezier(.32,.72,0,1); }
@keyframes mnChatIn {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: translateX(0); }
}
.mn-chat-bubble-row { display: flex; justify-content: flex-start; padding: 1px 10px; scroll-margin-bottom: 84px; animation: mnBubbleIn .18s ease-out; }
@keyframes mnBubbleIn {

  to   { opacity: 1; transform: translateY(0); }
}
.mn-chat-bubble-row-mine { justify-content: flex-end; }
.mn-chat-bubble {
  max-width: 75%; padding: 6px 9px 8px 9px; margin: 2px 0; border-radius: 7.5px 7.5px 7.5px 2px;
  background: var(--paper-raised); box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
}
.mn-chat-bubble-mine {

}
.mn-shell[data-theme="dark"] .mn-chat-bubble { background: #202C33; box-shadow: none; }

.mn-chat-bubble p { margin: 0; font-family: 'Inter', sans-serif; font-size: 14.2px; line-height: 19px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.mn-shell[data-theme="dark"] .mn-chat-bubble p,
.mn-shell[data-theme="dark"] .mn-chat-bubble-mine p { color: #E9EDEF; }
.mn-chat-bubble-mine p { color: var(--ink); }
.mn-chat-bubble-time { display: block; margin-top: 2px; font-size: 11px; color: var(--ink-faint); text-align: right; opacity: 0.75; letter-spacing: 0.01em; }
.mn-chat-bubble-mine .mn-chat-bubble-time { color: var(--ink-faint); }
.mn-unread-divider { display: flex; align-items: center; gap: 10px; margin: 10px 10px 4px; }
.mn-unread-divider::before, .mn-unread-divider::after { content: ""; flex: 1; height: 1px; background: var(--red, #e63946); opacity: 0.5; }
.mn-unread-divider span { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 700; color: var(--red, #e63946); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
/* swipe-to-reply */
.mn-chat-bubble-row { position: relative; touch-action: pan-y; }
.mn-chat-bubble { transition: transform .15s ease; }
.mn-chat-swipe-icon {
  position: absolute; top: 50%; left: 6px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--paper-line); color: var(--ink-faint);
  display: flex; align-items: center; justify-content: center;
  transform: translateY(-50%) scale(.5); opacity: 0;
  transition: opacity .15s ease, transform .15s ease; pointer-events: none;
}
.mn-chat-bubble-row-mine .mn-chat-swipe-icon { left: auto; right: 6px; }
.mn-chat-bubble-row[data-swipe-active="1"] .mn-chat-swipe-icon { opacity: 1; transform: translateY(-50%) scale(1); }
.mn-gift-card-row { padding: 2px 10px; }

  position: absolute; bottom: 8px; width: 12px; height: 12px;

}

.mn-chat-bubble-row:not(.mn-chat-bubble-row-mine) .mn-gift-card-tail { left: -5px; transform: rotate(45deg); }
.mn-gift-card-title { margin: 0; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink); }

.mn-gift-card-amount span { font-size: 11px; font-weight: 600; opacity: .7; margin-left: 2px; }

.mn-gift-group-card {

  background: var(--blue-soft); box-shadow: var(--shadow-sm); cursor: pointer; text-align: left;
}
.mn-gift-group-total { margin: 0 0 4px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; color: var(--ink); }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, updateProfile, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, collectionGroup, addDoc,
  query, orderBy, onSnapshot, serverTimestamp, increment, arrayUnion, arrayRemove,
  where, getDocs, limit, startAfter, getCountFromServer, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAnalytics, logEvent, isSupported as analyticsIsSupported, setUserId
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

/* ============================================================
   MENYA — Q&A for Rwandan schools, backed by Firebase.

   FIRESTORE SETUP (Firebase console):
   1. Build > Authentication > Sign-in method > enable Email/Password.
   2. Build > Firestore Database > Create database (Native mode).
   3. Firestore > Rules, paste:

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /users/{userId} {
         allow read: if true;
         allow write: if request.auth != null &&
           (request.auth.uid == userId || request.auth.uid == "REPLACE_WITH_ADMIN_UID");
         match /notifications/{notifId} {
           // Anyone signed in can WRITE a notification into another user's inbox
           // (that's how "so-and-so followed/upvoted/answered you" gets delivered),
           // but only the inbox owner can ever READ or mark their own read.
           allow read, update: if request.auth != null && request.auth.uid == userId;
           allow create: if request.auth != null;
         }
       }
       // A single global inbox that admin.html writes into to broadcast an
       // announcement to every user at once (new features, downtime notices,
       // "come discover" pushes, etc). Everyone can read it live; only the
       // admin account can write to it. Replace REPLACE_WITH_ADMIN_UID below
       // with the Firebase Auth uid of whichever account signs in on
       // admin.html, so randoms can't post fake announcements.
       match /broadcasts/{broadcastId} {
         allow read: if true;
         allow write: if request.auth != null && request.auth.uid == "REPLACE_WITH_ADMIN_UID";
       }
       match /coinRequests/{reqId} {
         allow read: if request.auth != null &&
           (request.auth.uid == resource.data.userId || request.auth.uid == "REPLACE_WITH_ADMIN_UID");
         allow create: if request.auth != null &&
           request.auth.uid == request.resource.data.userId &&
           request.resource.data.status == "pending";
         allow update: if request.auth != null && request.auth.uid == "REPLACE_WITH_ADMIN_UID";
       }
       match /withdrawRequests/{reqId} {
         allow read: if request.auth != null &&
           (request.auth.uid == resource.data.userId || request.auth.uid == "REPLACE_WITH_ADMIN_UID");
         allow create: if request.auth != null &&
           request.auth.uid == request.resource.data.userId &&
           request.resource.data.status == "pending";
         allow update: if request.auth != null && request.auth.uid == "REPLACE_WITH_ADMIN_UID";
       }
       // Direct messages: a chat doc is only ever readable/writable by its two
       // participants. chatId is always the two uids sorted and joined with
       // "_", so either side can deterministically compute it and there's
       // never a duplicate conversation between the same pair of people.
       // Channels: WhatsApp-style broadcast channels. Anyone can read (so a
       // shared channel link opens for signed-out visitors too); only the
       // owner can edit the channel itself, but any signed-in user can
       // subscribe (they're only ever allowed to touch subscriberIds/
       // subscriberCount on someone else's channel). Posts can only be
       // created by the channel's owner.
       match /channels/{channelId} {
         allow read: if true;
         allow create: if request.auth != null && request.auth.uid == request.resource.data.ownerId;
         allow update: if request.auth != null && (
           request.auth.uid == resource.data.ownerId ||
           request.resource.data.diff(resource.data).affectedKeys().hasOnly(["subscriberIds", "subscriberCount"])
         );
         allow delete: if request.auth != null && request.auth.uid == resource.data.ownerId;
         match /posts/{postId} {
           allow read: if true;
           allow create: if request.auth != null
                       && request.auth.uid == get(/databases/$(database)/documents/channels/$(channelId)).data.ownerId;
           allow update: if request.auth != null; // poll votes + like toggles by any signed-in subscriber
           allow delete: if request.auth != null
                       && request.auth.uid == get(/databases/$(database)/documents/channels/$(channelId)).data.ownerId;
         }
       }
       match /chats/{chatId} {
         allow read: if request.auth != null && request.auth.uid in resource.data.participants;
         allow create: if request.auth != null && request.auth.uid in request.resource.data.participants;
         allow update: if request.auth != null && request.auth.uid in resource.data.participants
                       && request.auth.uid in request.resource.data.participants;
         match /messages/{messageId} {
           allow read: if request.auth != null
                       && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.participants;
           allow create: if request.auth != null
                       && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.participants
                       && request.resource.data.senderId == request.auth.uid;
         }
       }
       match /questions/{questionId} {
         allow read: if true;
         allow create: if request.auth != null;
         allow update: if request.auth != null;
         match /answers/{answerId} {
           allow read: if true;
           allow create: if request.auth != null;
           allow update: if request.auth != null;
           match /replies/{replyId} {
             allow read: if true;
             allow create: if request.auth != null;
             allow update: if request.auth != null;
           }
         }
       }
     }
   }

   4. "My Answers" on the profile screen runs a collectionGroup query
      over every answers subcollection nested under questions. The first time you
      run it, Firestore's error message in the console will contain a
      direct link to auto-create the required index — click it once
      and the query works from then on. (This is normal for
      collectionGroup queries and only needs to be done once.)

   Data model:
     users/{uid}          { username, email, bio, place, region  // region is captured once at
                                              // sign-up (REGIONS list) and never changes — it's
                                              // the location signal that powers "people near you"
                                              // and the region boost in the For You feed,
                             totalQuestions,
                             totalAnswers, totalPoints,
                             followedUsers[]  // uids of people this user follows —
                                              // powers the "For You" social feed ranking }
     questions/{id}        { title, body, authorId, authorName, authorRegion // denormalized
                              // copy of the author's sign-up region, so the feed can boost/tag
                              // posts from the reader's own region without an extra read per post
                              , createdAt, answersCount, points, upvoterIds[] }
     questions/{id}/answers/{id} { body, authorId, authorName, createdAt,
                                    points, upvoterIds[], questionId, questionTitle,
                                    repliesCount, quotedFrom?: { authorName, body } // set when the answer quotes another answer/reply }
     questions/{id}/answers/{id}/replies/{id} { body, authorId, authorName, createdAt,
                                    points, upvoterIds[], replyingToName?,
                                    quotedFrom?: { authorName, body } }
     users/{uid}/notifications/{id} { type: 'follow'|'upvote_question'|'upvote_answer'|
                                    'upvote_reply'|'answer'|'reply', fromUserId, fromUserName,
                                    questionId?, answerId?, replyId?, preview?, createdAt, read }
                                    // one doc per activity, written straight into the
                                    // RECIPIENT's own subcollection and streamed live —
                                    // this is what powers the bell icon + Notifications screen.
     chats/{chatId}         { participants: [uidA, uidB],  // chatId = [uidA, uidB].sort().join("_")
                              participantNames: { uid: username }, participantPhotos: { uid: photoURL },
                              lastMessage, lastMessageAt, lastSenderId,
                              ["unread_" + uid]: number  // one counter per participant, reset to 0 by the
                                                          // reader when they open the chat }
                                    // written lazily — the doc (and the conversation) only comes into
                                    // existence the moment the first message is actually sent.
     chats/{chatId}/messages/{id} { text, senderId, senderName, createdAt }
     channels/{id}          { name, description, avatarUrl, category, ownerId, ownerName,
                              createdAt, lastPostAt, subscriberCount, postsCount,
                              subscriberIds[]  // uids subscribed — same arrayUnion/arrayRemove
                                               // pattern as questions.upvoterIds }
     channels/{id}/posts/{id} { type: 'text'|'image'|'video'|'audio'|'poll', body, mediaUrl?,
                              poll?: { options: [{ id, text, votes }], voterIds[] },
                              authorId, authorName, authorPhoto, createdAt,
                              likeCount, likerIds[] }
                                    // Every image/video/audio attached to a channel post is
                                    // uploaded straight to catbox.moe (anonymous, keyless
                                    // public API) from the browser — see uploadFileToCatbox() —
                                    // and only the returned https://files.catbox.moe/... link
                                    // is ever stored on the post doc.
     broadcasts/{id}        { title, body, link?, createdAt }
     coinRequests/{id}     { userId, userName, coins, amountFrw, packageLabel,
                              proofMessage,          // the SMS/confirmation text the user pasted
                              status: 'pending'|'approved'|'rejected',
                              coinsAwarded,           // set by admin on approval — lets admin award
                                                       // a different amount than requested if the
                                                       // sent money didn't match a clean package
                              createdAt, reviewedAt }
                                    // Written by the user when they submit payment proof.
                                    // Reviewed manually by the admin (Firebase Console or
                                    // admin.html): set status + coinsAwarded, then increment
                                    // users/{uid}.coins by coinsAwarded. No cloud function —
                                    // it's two manual writes, same pattern as broadcasts.
                                    // written by admin.html (a separate, admin-only page you
                                    // build against this same Firebase project) to push one
                                    // announcement to every signed-in user's Notifications screen
                                    // at once. Shows up tagged "Admin" alongside personal
                                    // notifications, sorted in with everything else by time.
                                    // Read/unread for these is tracked locally per-device
                                    // (localStorage), since it's one shared doc read by everyone
                                    // rather than a per-user inbox doc.

   NOTE: because this uses ES module imports, open it through a local
   server (e.g. `npx serve`, VS Code Live Server, or Firebase Hosting) —
   double-clicking the file (file://) will block the Firebase imports.
   ============================================================ */

  if (blockCombo || e.key === "F12" || (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k))) {

// ---------------- analytics ----------------
// getAnalytics() throws in environments without it (ad-blockers, some
// in-app browsers, SSR-like contexts), so we feature-detect first and
// keep a single safe trackEvent() wrapper the rest of the app calls —
// nothing else needs to know whether analytics actually loaded.
let analytics = null;
analyticsIsSupported().then((ok) => {
  if (ok) analytics = getAnalytics(fbApp);
}).catch(() => { /* analytics unavailable — app works fine without it */ });

function trackEvent(name, params) {
  if (!analytics) return;
  try { logEvent(analytics, name, params || {}); } catch (e) { /* ignore */ }
}

// ---------------- helpers ----------------
function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
// Strips raw URLs (http/https/www links and bare youtube.com / youtu.be links) out of
// post text before it's shown on the main feed card. Links like YouTube ones already get
// their own embed/thumbnail (see youtubeEmbedHtml), so the raw link text is just clutter —
// this keeps the feed preview clean without changing the underlying stored post body.
function stripUrlsForFeed(text) {
  if (!text) return "";
  return String(text)
    .replace(/\bhttps?:\/\/\S+/gi, "")
    .replace(/\bwww\.\S+/gi, "")
    .replace(/\b(?:youtube\.com|youtu\.be|m\.youtube\.com)\/\S+/gi, "")
    .replace(/[ \t]{2,}/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}
// ---------------- hashtags ----------------
// Pulls #tags out of a post's text (Instagram/Threads/Twitter style): letters,
// numbers and underscores, 2-30 chars, lowercased and de-duplicated so
// "#Coffee" and "#coffee" count as the same tag for sorting/discovery.
function extractHashtags(text) {
  if (!text) return [];
  const matches = String(text).match(/#([A-Za-z0-9_]{2,30})/g) || [];
  const seen = [];
  for (const m of matches) {
    const tag = m.slice(1).toLowerCase();
    if (!seen.includes(tag)) seen.push(tag);
  }
  return seen.slice(0, 10); // cap so one post can't spam dozens of tags
}
// Clickable pill row for a post's hashtags — tapping one filters the feed to
// that tag (openTagFeed) and, for the person tapping, counts as showing
// interest in that topic (see recordTagInterest) so the "For You" feed can
// learn from what they engage with, not just what they post.
function hashtagPillsHtml(tags) {
  if (!tags || !tags.length) return "";
  return `<div class="mn-hashtags">${tags.map((t) => `<button class="mn-hashtag" onclick="openTagFeed('${t}', event)">#${escapeHtml(t)}</button>`).join("")}</div>`;
}

// ---------------- interest tracking (for hashtag-based "For You" ranking) ----------------
// A lightweight, on-device tally of which hashtags this person actually
// engages with — opening a post, upvoting, answering, or tapping a hashtag
// itself. This is what lets the feed "learn from what he interacts with":
// forYouScore() below gives a boost to posts whose tags overlap with the
// reader's top interests. Stored in localStorage (not Firestore) since it's
// just a personalization signal, not data the app needs to sync anywhere.
let tagInterest = {};
try { tagInterest = JSON.parse(localStorage.getItem("mn_tag_interest") || "{}"); } catch (e) { tagInterest = {}; }
function recordTagInterest(tags, weight) {
  if (!tags || !tags.length) return;
  tags.forEach((t) => { tagInterest[t] = (tagInterest[t] || 0) + weight; });
  try { localStorage.setItem("mn_tag_interest", JSON.stringify(tagInterest)); } catch (e) { /* ignore */ }
}
// How much a post's tags line up with what this person tends to engage with —
// used purely as a scoring boost, never to hide/filter posts outright.
function tagAffinityScore(q) {
  if (!q.tags || !q.tags.length) return 0;
  return q.tags.reduce((sum, t) => sum + (tagInterest[t] || 0), 0);
}
// Jumping into a tag (feed filter) — from a hashtag pill or the search bar —
// counts as a stronger signal of interest than a passive view.
function openTagFeed(tag, ev) {
  if (ev) ev.stopPropagation();
  recordTagInterest([tag], 4);
  setState({ screen: "home", searchTerm: "#" + tag });
  resetCommittedFeed();
  trackEvent("select_content", { content_type: "hashtag", item_id: tag });
}

// ---------------- YouTube embed helpers ----------------
// Finds the first YouTube link inside a block of text and returns its 11-char video ID (or null).
function extractYouTubeId(text) {
  if (!text) return null;
  const re = /(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i;
  const match = String(text).match(re);
  return match ? match[1] : null;
}
// Renders a lazy, click-to-play 16:9 YouTube embed for any YouTube link found in `text`.
// Nothing loads or plays until the user taps it — see playYouTubeEmbed().
function ytEmbedHtmlById(id) {
  return `
    <div class="mn-yt-embed mn-yt-embed-static" data-yt-id="${id}" onclick="playYouTubeEmbed(this, event)" role="button" tabindex="0" aria-label="Play YouTube video" onkeydown="if(event.key==='Enter'||event.key===' '){playYouTubeEmbed(this, event);}">
      <img class="mn-yt-thumb" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="YouTube video thumbnail" loading="lazy" />
      <span class="mn-yt-play" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
      </span>

      </button>

}
function youtubeEmbedHtml(text) {
  const id = extractYouTubeId(text);
  if (!id) return "";
  return ytEmbedHtmlById(id);
}
// ---------------- generic link-embed helpers (Create > Link tab) ----------------
// Loose "looks like a link" check — good enough for a client-side preview,
// not a full URL validator (we never fetch the link, just format it).
function isValidLinkInput(text) {
  if (!text) return false;
  return /^[^\s]+\.[a-z]{2,}([/?#][^\s]*)?$/i.test(String(text).trim().replace(/^https?:\/\//i, ""));
}
function getUrlDomain(url) {
  try {
    const href = /^https?:\/\//i.test(url) ? url : "https://" + url;
    return new URL(href).hostname.replace(/^www\./, "");
  } catch (e) {
    return String(url || "").trim();
  }
}
// Plain "domain + link" fallback card, used whenever a URL doesn't match any of the
// richer embed types below.
function linkCardHtml(url) {
  const trimmed = String(url).trim();
  const domain = getUrlDomain(trimmed);
  const href = /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
  return `
    <a class="mn-link-card" href="${href}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
      <span class="mn-link-card-icon">${iconLinkSmall()}</span>
      <span class="mn-link-card-body">
        <span class="mn-link-card-domain">${escapeHtml(domain)}</span>
        <span class="mn-link-card-url">${escapeHtml(trimmed)}</span>
      </span>
      <span class="mn-link-card-chev">${iconChevRight()}</span>
    </a>
  `;

// Renders a link the user attached (Create > Link tab, or q.linkUrl): tries every rich
// embed type first (YouTube, Spotify, Wikipedia, image, PDF), and falls back to a plain
// domain card if nothing matches.
function linkEmbedHtml(url) {
  if (!url) return "";
  const trimmed = String(url).trim();
  if (!trimmed) return "";
  const rich = mediaEmbedHtml(trimmed);
  if (rich) return rich;
  if (!isValidLinkInput(trimmed)) return "";
  return linkCardHtml(trimmed);
}

// ---------------- unified rich-media embed system ----------------
// Scans a block of free text (a post/answer body, or a single pasted link) for the first
// URL matching a known media type — YouTube video, YouTube Short, Spotify track/album/
// playlist, Wikipedia article, image, or PDF — and renders the matching embed. Returns
// "" if nothing recognizable is found (callers then just show the plain text as usual).
// Cache for embeds that need a network fetch to render fully (Wikipedia summaries, PDF
// page counts). Keyed by a type-prefixed cache key; value is `undefined` (never tried),
// `null` (fetch in flight), the fetched data, or `"error"` (fetch failed — fall back).
const mediaCache = {};
let imgDimCache = JSON.parse(localStorage.getItem("menya-imgdims") || "{}");
function probeImageDims(url) {
  if (imgDimCache[url] !== undefined) return;
  imgDimCache[url] = null;
  const im = new Image();
  im.onload = () => {
    imgDimCache[url] = { w: im.naturalWidth, h: im.naturalHeight };
    try { localStorage.setItem("menya-imgdims", JSON.stringify(imgDimCache)); } catch (e) {}
    document.querySelectorAll(".mn-img-embed[data-img-src]").forEach((el) => {
      if (el.dataset.imgSrc === url) el.style.aspectRatio = `${im.naturalWidth} / ${im.naturalHeight}`;
    });
  };
  im.onerror = () => { imgDimCache[url] = "error"; };
  im.src = url;
}
// Ensures the first feed page never paints with unknown media sizes: posts
// that already carry mediaWidth/mediaHeight (see postQuestion, patch #2)
// resolve instantly; older posts without them get probed and awaited here,
// capped by a timeout so one slow/dead URL can't block the whole feed.
function preloadFeedDims(questions, timeoutMs = 1500) {
  const toProbe = questions
    .filter(q => !(q.mediaWidth && q.mediaHeight))
    .map(q => extractImageUrl(q.body))
    .filter(url => url && imgDimCache[url] === undefined);
  if (!toProbe.length) return Promise.resolve();
  const probes = toProbe.map(url => new Promise((resolve) => {
    const im = new Image();
    im.onload = () => { imgDimCache[url] = { w: im.naturalWidth, h: im.naturalHeight }; resolve(); };
    im.onerror = () => { imgDimCache[url] = "error"; resolve(); };
    im.src = url;
  }));
  return Promise.race([Promise.all(probes), new Promise(res => setTimeout(res, timeoutMs))]);
}

function isYouTubeShortUrl(text) {

function extractSpotify(text) {
  if (!text) return null;
  const m = String(text).match(/open\.spotify\.com\/(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/i);
  return m ? { type: m[1].toLowerCase(), id: m[2] } : null;
}

// posts/photos get the post plugin. Both use Facebook's public, key-free embed
// plugins (no login/app id needed) since MENYA has no Facebook API credentials. --
function isFacebookReelUrl(text) {
  return /facebook\.com\/(?:reel\/|[^\s\/]+\/reels\/)/i.test(String(text || ""));
}
function extractFacebookVideo(text) {
  if (!text) return null;
  const s = String(text);
  let m = s.match(/\bhttps?:\/\/fb\.watch\/[A-Za-z0-9_-]+\/?/i);
  if (m) return m[0];
  m = s.match(/\bhttps?:\/\/(?:www\.|web\.|m\.)?facebook\.com\/reel\/\d+[^\s<>"']*/i);
  if (m) return m[0];
  m = s.match(/\bhttps?:\/\/(?:www\.|web\.|m\.)?facebook\.com\/[^\s\/<>"']+\/reels\/\d+[^\s<>"']*/i);
  if (m) return m[0];
  m = s.match(/\bhttps?:\/\/(?:www\.|web\.|m\.)?facebook\.com\/watch\/?\?v=\d+[^\s<>"']*/i);
  if (m) return m[0];
  m = s.match(/\bhttps?:\/\/(?:www\.|web\.|m\.)?facebook\.com\/[^\s\/<>"']+\/videos\/\d+[^\s<>"']*/i);
  if (m) return m[0];
  return null;
}
function extractFacebookPost(text) {
  if (!text) return null;

function calcAge(dobStr) {
  if (!dobStr) return null;
  const dob = new Date(dobStr + "T00:00:00");
  if (isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age;
}

  if (!username.trim() || username.trim().length < 3) errors.username = "Use at least 3 characters.";
  if (!dob) {
    errors.dob = "Enter your date of birth.";
  } else {
    const age = calcAge(dob);
    if (age === null || age > 120 || dob > new Date().toISOString().split("T")[0]) errors.dob = "That date doesn't look right.";
    else if (age < 13) errors.dob = "You must be at least 13 years old.";
  }
  if (!region) errors.region = "Select your region.";
  if (!email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) errors.email = "Enter a valid email address.";
  if (!password || password.length < 6) errors.password = "Use at least 6 characters.";
  if (confirmPassword !== password || !confirmPassword) errors.confirmPassword = "Passwords don't match.";
  return errors;
}

    // Full swap only when the committed list itself changed; otherwise patch
    // just the point/answer counts on the cards already on screen so nothing
    // reflows, reorders, or reloads its media mid-scroll.
    if (feedChanged) renderFeedOnly();
    else patchFeedStatsOnly();
    updateNewPostsPill();
  } else if (state.screen === "detail" && document.querySelector(".mn-detail-post")) {
    updateDetailStatsOnly();
  } else if (commentsSheetMounted()) {
    updateDetailStatsOnly();
  } else {
    render();
  }
  // Reels sits as an overlay on top of Home and is intentionally left out of
  // renderFeedOnly()/render() above — rebuilding it here would destroy and
  // recreate the current <img>/<video>, restarting playback. Instead, patch
  // just the upvote count/state in place so numbers stay live without ever
  // touching the media element.
  if (state.reelsViewerOpen) updateReelsStatsOnly();
  maybeOpenSharedQuestion();
}, (err) => { console.error(err); });

// Fetches the next 20 older posts and appends them to the feed. This is a
// one-time getDocs() read (not a live listener) — only the first page needs
// to update in real time.
const LOAD_MORE_TIMEOUT_MS = 5000; // don't make the reader wait more than this for the next page
let loadMoreRequestId = 0;

async function loadMoreQuestions() {
  if (questionsLoadingMore || !questionsHasMore || !questionsLastVisible) return;
  questionsLoadingMore = true;
  setSentinelSpinner(true);
  const myRequestId = ++loadMoreRequestId;
  try {
    const nextRef = query(
      collection(db, "questions"),
      orderBy("createdAt", "desc"),
      startAfter(questionsLastVisible),
      limit(QUESTIONS_PAGE_SIZE)
    );
    const timeout = new Promise((resolve) => setTimeout(() => resolve("timeout"), LOAD_MORE_TIMEOUT_MS));
    const result = await Promise.race([getDocs(nextRef), timeout]);
    // Missed the 5s window, or a newer request already started since this one
    // fired — drop it here instead of letting it land later and pop posts in
    // after the reader has moved on (that's its own content shift).
    if (result === "timeout" || myRequestId !== loadMoreRequestId) return;
    const snap = result;
    const nextDocs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    // De-dupe against posts the live first page may have already streamed in.
    const seenIds = new Set(state.questions.map((q) => q.id));
    const freshDocs = nextDocs.filter((q) => !seenIds.has(q.id));
    state.questions = state.questions.concat(freshDocs);
    // Older posts loaded by scrolling to the bottom are appended straight
    // into the committed feed — this is expected, reader-initiated growth,
    // not a background change, so it never goes through the "New posts" pill.
    if (committedFeedIds) committedFeedIds = committedFeedIds.concat(freshDocs.map((q) => q.id));
    if (snap.docs.length) questionsLastVisible = snap.docs[snap.docs.length - 1];
    questionsHasMore = snap.docs.length === QUESTIONS_PAGE_SIZE;
  } catch (e) {
    console.error(e);
  } finally {
    questionsLoadingMore = false;
    appendLoadedQuestions();
  }
}

// Turns the sentinel's spinner on/off in place (no re-render at all), so
// reaching the bottom of the feed doesn't touch anything else on the page.
function setSentinelSpinner(on) {
  const sentinel = document.getElementById("mn-feed-sentinel");
  if (!sentinel) return;
  sentinel.innerHTML = on ? `<span class="mn-feed-spinner"></span>` : "";
}

// Appends the newly-loaded page of questions to the existing feed DOM instead
// of calling render() or rebuilding the whole feed container. This is what
// fixes the "page jumps/flickers while scrolling" issue: previously, every
// load-more triggered a full render() that destroyed and rebuilt the entire
// app (header, sidebar, all existing cards) mid-scroll. Now only the brand
// new cards are added to the bottom, and the scroll position is untouched.
function appendLoadedQuestions() {
  if (state.screen !== "home") return;
  const homeEl = document.querySelector(".mn-home");
  if (!homeEl) { render(); return; }

  if (state.sortMode === "imagetok") {
    const scrollEl = document.getElementById("mn-imagetok-scroll");
    if (!scrollEl) { render(); return; }
    const reels = getReelPosts();
    const existingIds = new Set(
      Array.from(scrollEl.querySelectorAll(".mn-imagetok-item")).map((el) => el.dataset.imagetokId)
    );
    const newHtml = reels
      .filter((r) => !existingIds.has(String(r.q.id)))
      .map((r, i) => imageTokItemHtml(r, existingIds.size + i))
      .join("");
    const sentinel = document.getElementById("mn-imagetok-sentinel");
    if (newHtml) {
      if (sentinel) sentinel.insertAdjacentHTML("beforebegin", newHtml);
      else scrollEl.insertAdjacentHTML("beforeend", newHtml);
    }
    if (questionsHasMore) {
      if (sentinel) sentinel.innerHTML = "";
    } else if (sentinel) {
      sentinel.outerHTML = imageTokEndHtml();
    }
    observeImageTokSentinel();
    observeImageTok();
    return;
  }

  const feedEl = homeEl.querySelector(".mn-feed");
  const sentinel = document.getElementById("mn-feed-sentinel");
  if (!feedEl || !sentinel) { render(); return; }

  const list = filteredQuestions();
  // Cards are identified by id="q-<id>" (set in questionCardHtml) — only
  // render the ones not already in the DOM.
  const existingIds = new Set(
    Array.from(feedEl.children).map((el) => el.id.replace(/^q-/, ""))
  );
  const newCardsHtml = list
    .filter((q) => !existingIds.has(String(q.id)))
    .map((q) => questionCardHtml(q))
    .join("");
  if (newCardsHtml) feedEl.insertAdjacentHTML("beforeend", newCardsHtml);

  if (questionsHasMore) {
    sentinel.innerHTML = "";
  } else {
    sentinel.remove();
  }
  observeFeedSentinel();
}
// Finds the id of the post sitting at the halfway point of the channel's
// current *unread* list — same cutoff logic used to build the Unread tab
// in renderChannelDetail(). Returns null if there's nothing to anchor to yet.
function getHalfwayPostId(channel) {
  const allPosts = state.channelPosts || [];
  const cutoff = state.channelUnreadCutoff || 0;
  const unreadPosts = allPosts.filter((p) => notifSortMillis(p.createdAt) > cutoff);
  const list = unreadPosts.length ? unreadPosts : allPosts;
  if (!list.length) return null;
  return list[Math.floor(list.length / 2)].id;
}
let donationPopupArmed = false;
let donationWatchChannelId = null;   // which channel already has an observer attached this visit
let donationHalfwayObserver = null;  // the IntersectionObserver watching the halfway post
async function armDonationScrollWatch(channel) {
  if (!channel || !channel.donationPhone) return;               // owner hasn't set up donations
  if (state.user && channel.ownerId === state.user.uid) return; // owners don't see their own popup
  if (donationWatchChannelId === channel.id) return;             // already attached this visit

  const today = new Date().toISOString().slice(0, 10);

  if (state.user) {
    const seenMap = (state.profile && state.profile.donationSeen) || {};
    if (seenMap[channel.id] === today) { donationWatchChannelId = channel.id; return; }
  } else {
    if (sessionStorage.getItem("mn_donate_seen_" + channel.id)) { donationWatchChannelId = channel.id; return; }
  }

  const targetId = getHalfwayPostId(channel);
  if (!targetId) return;
  const targetEl = document.getElementById("cp-" + targetId);
  if (!targetEl) return;

  donationWatchChannelId = channel.id;
  if (donationHalfwayObserver) donationHalfwayObserver.disconnect();
  donationHalfwayObserver = new IntersectionObserver((entries) => {
    if (!entries.some((e) => e.isIntersecting)) return;
    donationHalfwayObserver.disconnect();
    donationHalfwayObserver = null;

    if (state.user) {
      updateDoc(doc(db, "users", state.user.uid), { ["donationSeen." + channel.id]: today })
        .catch((e) => console.error("donationSeen write failed", e));
      state.profile = state.profile || {};
      state.profile.donationSeen = { ...(state.profile.donationSeen || {}), [channel.id]: today };
    } else {
      sessionStorage.setItem("mn_donate_seen_" + channel.id, "1");
    }

// Watches the sentinel element rendered at the bottom of the home feed and

// ---------------- impression-based view counting ----------------
// Counts a "view" as soon as a post sits meaningfully in the viewport

// so a later click on a post already seen in-feed won't double count.

    entries.forEach((entry) => {
      const id = entry.target.id.replace(/^q-/, "");
      if (!id) return;

  const region = state.profile.region;

  nearbyUsersLoadedFor = region;

    state.nearbyUsers = snap.docs

// Ranks individual questions by recent engagement (upvotes + answer activity) for the
// Discover screen's "Trending Questions" section. Falls back to all-time if nothing
// recent qualifies, so a quiet week doesn't leave the section empty.
function trendingQuestions(count) {
  const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
  const scored = state.questions.map((q) => {
    const ts = q.createdAt && q.createdAt.toMillis ? q.createdAt.toMillis() : 0;
    return { q, ts, score: (q.points || 0) * 2 + (q.answersCount || 0) };
  });
  let pool = scored.filter((s) => s.ts && s.ts >= cutoff);
  if (pool.length === 0) pool = scored;
  return pool.sort((a, b) => b.score - a.score).slice(0, count || 5).map((s) => s.q);
}

let sharedOpened = false;

function selectScreen(screen) {

// Following a person (not just a subject) is what turns this into a social feed:
// their new posts get boosted straight to the top of "For You", the way a
// followed friend's posts surface on Facebook/Instagram.
async function toggleFollowUser(authorId, authorName, ev) {
  if (ev) ev.stopPropagation();
  if (!state.user) { setState({ pendingScreen: "home", authModal: "signin" }); return; }
  if (authorId === state.user.uid) return;
  if (ev && ev.currentTarget) { popEl(ev.currentTarget); hapticTap(9); }
  const current = state.profile.followedUsers || [];
  const isFollowing = current.includes(authorId);
  const next = isFollowing ? current.filter((id) => id !== authorId) : [...current, authorId];
  state.profile.followedUsers = next;
  await updateDoc(doc(db, "users", state.user.uid), { followedUsers: next });
  // Keep a denormalized follower count on the followed person's own doc so
  // their profile screen can show "N followers" without everyone having to
  // query/count every follower's followedUsers array.
  updateDoc(doc(db, "users", authorId), { followersCount: increment(isFollowing ? -1 : 1) }).catch((e) => { /* ignore */ });
  render();
  trackEvent(isFollowing ? "unfollow_user" : "follow_user", { item_id: authorId });
  if (!isFollowing) createNotification(authorId, { type: "follow" });
  showToast(isFollowing ? "Unfollowed " + (authorName || "user") + "." : "You're now following " + (authorName || "this user") + ".");
}

// -- catbox.moe upload: anonymous, keyless, used for every image/video/audio
// attached to a channel post, and for a channel's own avatar. Returns the
// direct file URL (https://files.catbox.moe/xxxxx.ext) that gets stored on
// the doc — same kind of link people already paste by hand elsewhere in MENYA. --
const CATBOX_MAX_BYTES = 200 * 1024 * 1024; // catbox's own anonymous-upload ceiling
async function uploadFileToCatbox(file) {
  if (!file) throw new Error("No file selected.");
  if (file.size > CATBOX_MAX_BYTES) throw new Error("That file is too large (200MB max).");
  const body = new FormData();
  body.append("reqtype", "fileupload");
  body.append("fileToUpload", file);
  const res = await fetch("https://catbox.moe/user/api.php", { method: "POST", body });
  const text = (await res.text()).trim();
  if (!res.ok || !/^https?:\/\//.test(text)) throw new Error(text || "Upload failed — try again.");
  return text;
}

// -- Channels list (Discover tab default) --
async function loadChannelsList(force) {
  if (state.channelsLoaded && !force) return;
  try {
    const byId = new Map();
    const discoverSnap = await getDocs(query(collection(db, "channels"), orderBy("subscriberCount", "desc"), limit(60)));
    discoverSnap.docs.forEach((d) => byId.set(d.id, { id: d.id, ...d.data() }));
    // Also pull in every channel this user owns or subscribes to, even if it
    // didn't make the top-60 by subscriber count — otherwise "My channels"
    // could miss a smaller channel they just joined or created.
    if (state.user) {
      const [ownedSnap, subscribedSnap] = await Promise.all([
        getDocs(query(collection(db, "channels"), where("ownerId", "==", state.user.uid), limit(30))),
        getDocs(query(collection(db, "channels"), where("subscriberIds", "array-contains", state.user.uid), limit(30))),
      ]);
      ownedSnap.docs.forEach((d) => byId.set(d.id, { id: d.id, ...d.data() }));
      subscribedSnap.docs.forEach((d) => byId.set(d.id, { id: d.id, ...d.data() }));
    }
    state.channels = Array.from(byId.values()).sort((a, b) => (b.subscriberCount || 0) - (a.subscriberCount || 0));
  } catch (e) { console.error(e); }
  state.channelsLoaded = true;
  render();
}
async function purgeOldChannelPosts(channelId) {
  const cutoff = Timestamp.fromMillis(Date.now() - 7 * 24 * 60 * 60 * 1000);
  const oldQ = query(collection(db, "channels", channelId, "posts"), where("createdAt", "<", cutoff));
  const snap = await getDocs(oldQ);
  if (snap.empty) return;
  await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
  await updateDoc(doc(db, "channels", channelId), { postsCount: increment(-snap.size) });
}

// Compact "291" / "3.6K" / "3.6M" style count, matching how WhatsApp shows
// channel follower counts in the Explore list.
function formatFollowerCount(n) {
  n = Number(n) || 0;
  const trim = (v) => (Math.round(v * 10) / 10).toString();
  if (n >= 1000000) return trim(n / 1000000) + "M";
  if (n >= 1000) return trim(n / 1000) + "K";
  return String(n);
}
// Buckets the discover list into an "Explore channels" shelf (top overall)
// plus one shelf per distinct category, largest category first — mirrors the
// WhatsApp Channels tab's sectioned layout.
function groupChannelsForExplore(list) {
  const explore = list.slice(0, 4);
  const byCategory = {};
  list.forEach((c) => {
    const cat = (c.category || "").trim();
    if (!cat) return;
    (byCategory[cat] = byCategory[cat] || []).push(c);
  });
  const categories = Object.keys(byCategory).sort((a, b) => byCategory[b].length - byCategory[a].length);
  return { explore, categories, byCategory };
}

// -- Opening a single channel: live channel doc (subscriber count) + live posts feed --
function detachChannelListeners() {
  if (channelDocUnsub) { channelDocUnsub(); channelDocUnsub = null; }
  if (channelPostsUnsub) { channelPostsUnsub(); channelPostsUnsub = null; }
}
function openChannel(channelId, ev) {
  if (ev) ev.stopPropagation();
  if (!channelId) return;
  detachChannelListeners();
  donationWatchChannelId = null; // reset so the halfway watch re-arms fresh for this visit
  if (donationHalfwayObserver) { donationHalfwayObserver.disconnect(); donationHalfwayObserver = null; }
  trackEvent("screen_view", { screen_name: "channel_detail", item_id: channelId });
  // Snapshot "what's unread" as of the moment the channel is opened, BEFORE
  // marking it read below. This cutoff stays fixed for the rest of this
  // visit, so posts don't silently vanish from the Unread tab mid-scroll —
  // it only resets the next time the channel is opened fresh.
  const cutoff = getChannelLastRead(channelId);
  setState({
    screen: "channelDetail",
    channelFrom: (state.screen === "channelDetail") ? state.channelFrom : (state.screen === "channels" ? "channels" : state.screen),
    activeChannelId: channelId, activeChannel: (state.channels || []).find((c) => c.id === channelId) || null,
    channelPosts: [], channelPostsLoaded: false,
channelUnreadCutoff: cutoff, channelFeedFilter: "unread", channelLiveNewIds: [],
  });
  channelDocUnsub = onSnapshot(doc(db, "channels", channelId), (snap) => {
    if (!snap.exists()) { state.activeChannel = null; if (!state.channelComposerOpen) render(); return; }
    state.activeChannel = { id: snap.id, ...snap.data() };
    if (!state.channelComposerOpen) render();
  }, (err) => console.error(err));
  const pq = query(collection(db, "channels", channelId, "posts"), orderBy("createdAt", "asc"), limit(50));
let firstSnap = true;
channelPostsUnsub = onSnapshot(pq, (snap) => {
  const prevIds = new Set((state.channelPosts || []).map((p) => p.id));
  const nextPosts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  if (!firstSnap) {
    const freshlyArrived = nextPosts.filter((p) => !prevIds.has(p.id)).map((p) => p.id);
    if (freshlyArrived.length) state.channelLiveNewIds = [...state.channelLiveNewIds, ...freshlyArrived];
  }
  firstSnap = false;
  state.channelPosts = nextPosts;
  state.channelPostsLoaded = true;
  if (!state.channelComposerOpen) render();
}, (err) => { console.error(err); state.channelPostsLoaded = true; if (!state.channelComposerOpen) render(); });
  // This visit itself becomes the new baseline: whatever arrives after this
  // point is "unread" again only on the *next* open.
  markChannelReadNow(channelId);
  purgeOldChannelPosts(channelId).catch((e) => console.error("purgeOldChannelPosts failed", e));
  pushNav();
}

function bindLongPress(el, callback, ms = 500) {
  let timer = null;
  const start = (e) => { timer = setTimeout(() => callback(e), ms); };
  const cancel = () => { if (timer) clearTimeout(timer); };
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchmove", cancel);
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", cancel);
  el.addEventListener("mouseleave", cancel);
}
function bindChallengeLongPress() {

      shareChallenge(el.dataset.challengeId, el.dataset.challengeTitle);
    });
  });
}

// -- Subscribe / unsubscribe: same arrayUnion/arrayRemove + increment pattern as upvoteQuestion() --
async function toggleSubscribeChannel(channelId, ev) {
  if (ev) ev.stopPropagation();
  if (!state.user) { setState({ pendingScreen: state.screen, authModal: "signin" }); return; }
  const channel = state.activeChannel && state.activeChannel.id === channelId ? state.activeChannel : (state.channels || []).find((c) => c.id === channelId);
  if (!channel || channel.ownerId === state.user.uid) return;
  const subscribed = (channel.subscriberIds || []).includes(state.user.uid);
  if (ev && ev.currentTarget) { popEl(ev.currentTarget); hapticTap(9); }
  const nextIds = subscribed ? (channel.subscriberIds || []).filter((id) => id !== state.user.uid) : [...(channel.subscriberIds || []), state.user.uid];
  channel.subscriberIds = nextIds;
  channel.subscriberCount = (channel.subscriberCount || 0) + (subscribed ? -1 : 1);
  render();
  try {
    await updateDoc(doc(db, "channels", channelId), {
      subscriberIds: subscribed ? arrayRemove(state.user.uid) : arrayUnion(state.user.uid),
      subscriberCount: increment(subscribed ? -1 : 1),
    });
  } catch (e) { console.error(e); showToast("Couldn't update subscription — try again.", "error"); }
  trackEvent(subscribed ? "channel_unsubscribe" : "channel_subscribe", { item_id: channelId });
  showToast(subscribed ? "Unsubscribed from " + (channel.name || "channel") + "." : "Subscribed to " + (channel.name || "channel") + "!");
}

async function voteChannelPost(postId, dir, ev) {
  if (ev) ev.stopPropagation();
  if (!state.user) { setState({ pendingScreen: state.screen, authModal: "signin" }); return; }
  if (!state.activeChannel) return;
  const post = (state.channelPosts || []).find((p) => p.id === postId);
  if (!post) return;
  const uid = state.user.uid;
  const up = new Set(post.upvoterIds || []);
  const down = new Set(post.downvoterIds || []);
  const wasUp = up.has(uid), wasDown = down.has(uid);
  const patch = {};
  if (dir === "up") {
    if (wasUp) { up.delete(uid); patch.upvoteCount = increment(-1); patch.upvoterIds = arrayRemove(uid); }
    else { up.add(uid); patch.upvoteCount = increment(1); patch.upvoterIds = arrayUnion(uid);
      if (wasDown) { down.delete(uid); patch.downvoteCount = increment(-1); patch.downvoterIds = arrayRemove(uid); } }
  } else {
    if (wasDown) { down.delete(uid); patch.downvoteCount = increment(-1); patch.downvoterIds = arrayRemove(uid); }
    else { down.add(uid); patch.downvoteCount = increment(1); patch.downvoterIds = arrayUnion(uid);
      if (wasUp) { up.delete(uid); patch.upvoteCount = increment(-1); patch.upvoterIds = arrayRemove(uid); } }
  }
  post.upvoterIds = [...up]; post.downvoterIds = [...down];
  post.upvoteCount = Math.max(0, (post.upvoteCount || 0) + (patch.upvoteCount ? (up.has(uid) ? 1 : -1) : 0));
  post.downvoteCount = Math.max(0, (post.downvoteCount || 0) + (patch.downvoteCount ? (down.has(uid) ? 1 : -1) : 0));
  if (ev && ev.currentTarget) popEl(ev.currentTarget);
  render();
  try {
    await updateDoc(doc(db, "channels", state.activeChannel.id, "posts", postId), patch);
  } catch (e) { console.error(e); }
}

    await Promise.all(msgsSnap.docs.map((d) => deleteDoc(d.ref)));

    if (ts && now - ts >= CHAT_EXPIRY_MS) purgeStaleChat(c);

function isCatboxUrl(url) {
  try {
    const u = new URL(url);
    if (u.protocol !== "https:" || !/(^|\.)catbox\.moe$/i.test(u.hostname)) return false;
    // catbox.moe/c/xxxx album/share pages are HTML, not images — only a direct
    // file link (files.catbox.moe/xxxx.jpg) actually renders in an <img>. Require
    // a real file extension so a pasted page link is rejected here instead of
    // silently saving a photo that never displays.
    return /\.[a-z0-9]{2,5}$/i.test(u.pathname);

}

// Catbox file links always end in the original extension, so this is reliable
// for anything uploaded through catbox itself.
function detectCatboxMediaType(url) {
  const clean = url.split(/[?#]/)[0].toLowerCase();
  const ext = (clean.match(/\.([a-z0-9]+)$/) || [])[1] || "";
  if (["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"].includes(ext)) return "image";
  if (["mp4", "webm", "mov", "m4v", "ogv"].includes(ext)) return "video";
  if (["mp3", "wav", "ogg", "oga", "m4a", "aac", "flac", "wma"].includes(ext)) return "audio";

}

  state.messageMediaPicker = false;

  const sendBtn = document.querySelector(".mn-chat-send");
  const textarea = document.querySelector(".mn-chat-composer textarea");
  if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = `<span class="mn-spinner"></span>`; }
  if (textarea) textarea.value = "";
  render();
  try {
    const mediaLabel = mediaType === "video" ? "🎬 Video" : mediaType === "audio" ? "🎵 Audio" : mediaType === "image" ? "📷 Photo" : mediaType ? "📎 File" : "";
    // setDoc(..., {merge:true}) both creates the chat the very first time and
    // keeps it updated after — one write path for "new conversation" and
    // "existing conversation", no separate create-vs-update branching.
    await setDoc(doc(db, "chats", chatId), {
      participants: [myId, other.id],
      participantNames: { [myId]: myName, [other.id]: other.username || "User" },
      participantPhotos: { [myId]: myPhoto, [other.id]: other.photoURL || "" },
      lastMessage: text || mediaLabel || "Message", lastMessageAt: serverTimestamp(), lastSenderId: myId,
      ["unread_" + myId]: 0,
      ["unread_" + other.id]: increment(1),
    }, { merge: true });
    const payload = { text, senderId: myId, senderName: myName, createdAt: serverTimestamp() };
    if (mediaUrl) { payload.mediaUrl = mediaUrl; payload.mediaType = mediaType || "file"; }
    if (replyTo) payload.replyTo = { id: replyTo.id, text: replyTo.text, senderName: replyTo.senderName };
    await addDoc(collection(db, "chats", chatId, "messages"), payload);
    trackEvent("send_message", { item_id: chatId });
  } catch (e) {
    console.error(e);
    state.messageDraft = text; // hand the text and media back so nothing is lost
    state.messageMediaUrl = mediaUrl;
    state.messageMediaType = mediaType;
    if (textarea) textarea.value = text;
    showToast("Couldn't send your message. Please try again.", "error");
  }
  state.messageBusy = false;
  if (sendBtn) {
    sendBtn.disabled = !(state.messageDraft.trim() || state.messageMediaUrl);
    sendBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  render();
}
function openGiftCoins() { setState({ giftOpen: true, giftAmount: 100, giftBusy: false, giftSent: false }); }

function setGiftAmount(v) {

async function sendGiftCoins() {
  if (!state.user || !state.activeChatId || !state.activeChatUser || state.giftBusy) return;
  const amount = state.giftAmount;
  const myCoins = (state.profile && state.profile.coins) || 0;
  if (amount < 1 || myCoins < amount) { showToast("Not enough coins for that gift.", "error"); return; }
  const chatId = state.activeChatId, other = state.activeChatUser;
  const myId = state.user.uid, myName = state.profile.username;
  state.giftBusy = true; render();
  try {
    await updateDoc(doc(db, "users", myId), { coins: increment(-amount), usedCoins: increment(amount) });
    await updateDoc(doc(db, "users", other.id), { coins: increment(amount) });
    state.profile.coins = myCoins - amount;
    await setDoc(doc(db, "chats", chatId), {
      participants: [myId, other.id],
      participantNames: { [myId]: myName, [other.id]: other.username || "User" },
      participantPhotos: { [myId]: state.profile.photoURL || "", [other.id]: other.photoURL || "" },
      lastMessage: `🎁 Sent ${amount} coins`, lastMessageAt: serverTimestamp(), lastSenderId: myId,
      ["unread_" + myId]: 0, ["unread_" + other.id]: increment(1),
    }, { merge: true });
    await addDoc(collection(db, "chats", chatId, "messages"), {
      type: "gift", giftAmount: amount, senderId: myId, senderName: myName, createdAt: serverTimestamp(),
    });
    showToast(`Gift sent — ${amount} coins to ${other.username || "them"}!`);
    state.giftBusy = false;

      if (!suppressNav) { state.giftSent = false; state.giftCustomOpen = false; history.back(); return; }

    }, 800);

}

// Live-enable/disable the post button without a full re-render, so the textarea/input never loses focus or cursor position while typing.
function refreshPostBtn() {

  if (btn) btn.disabled = !canPostForm() || state.postBusy;
}
function setFormBody(v) { state.form.body = v; refreshPostBtn(); }
function setFormLink(v) { state.form.link = v; refreshPostBtn(); }
function setCreateTab(tab) {

  setState({ createTab: tab });
